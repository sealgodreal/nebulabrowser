<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }
    #vanta {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.75;
      filter: blur(8px) saturate(1.2);
      transform: scale(1.1);
    }
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="vanta"></div>
  <canvas id="stars"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script>
    const NEBULA_FOG_THEMES = {
      "oled": { highlightColor: 0x101012, midtoneColor: 0x08080a, lowlightColor: 0x000000, baseColor: 0x000000, rain: [120, 120, 125] },
      "soft-pink": { highlightColor: 0x3a3344, midtoneColor: 0x232030, lowlightColor: 0x121218, baseColor: 0x08080c, rain: [196, 180, 210] },
      "cotton-candy": { highlightColor: 0x8e7db2, midtoneColor: 0x515e8c, lowlightColor: 0x2a2e42, baseColor: 0x161826, rain: [195, 215, 250] },
      moss: { highlightColor: 0x33544a, midtoneColor: 0x1e2f28, lowlightColor: 0x101815, baseColor: 0x080c0a, rain: [168, 205, 178] },
      "blue-lavender": { highlightColor: 0x33405c, midtoneColor: 0x20293d, lowlightColor: 0x12161f, baseColor: 0x080a10, rain: [150, 170, 205] },
      rose: { highlightColor: 0x503a40, midtoneColor: 0x2e2226, lowlightColor: 0x171215, baseColor: 0x0c080a, rain: [205, 172, 180] },
      sand: { highlightColor: 0x4a4132, midtoneColor: 0x2c2620, lowlightColor: 0x161310, baseColor: 0x0c0a08, rain: [205, 188, 160] }
    };
    const NEBULA_FOG_THEME_KEYS = ["oled", "soft-pink", "cotton-candy", "moss", "blue-lavender", "rose", "sand"];
    let nebulaFogTheme = null;
    try {
      const rawFogSettings = localStorage.getItem("nebulaSettings");
      const parsedFogSettings = rawFogSettings ? JSON.parse(rawFogSettings) : {};
      if (parsedFogSettings && NEBULA_FOG_THEME_KEYS.indexOf(parsedFogSettings.themeAccent) >= 0) {
        nebulaFogTheme = parsedFogSettings.themeAccent;
      }
    } catch (e) {}
    const nebulaFogPalette = (nebulaFogTheme && NEBULA_FOG_THEMES[nebulaFogTheme]) || null;
    const nebulaRain = (nebulaFogPalette && nebulaFogPalette.rain) || [190, 190, 195];
    VANTA.FOG({
      el: "#vanta",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: nebulaFogPalette ? nebulaFogPalette.highlightColor : 0x3f4045,
      midtoneColor: nebulaFogPalette ? nebulaFogPalette.midtoneColor : 0x262629,
      lowlightColor: nebulaFogPalette ? nebulaFogPalette.lowlightColor : 0x141416,
      baseColor: nebulaFogPalette ? nebulaFogPalette.baseColor : 0x08080a,
      blurFactor: 0.85,
      speed: 3,
      zoom: 0.65
    });
  </script>
  <script>
    (function () {
      const canvas = document.getElementById("stars");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let w = canvas.width = canvas.offsetWidth || innerWidth;
      let h = canvas.height = canvas.offsetHeight || innerHeight;
      const drops = Array.from({ length: 130 }, () => ({
        x: Math.random() * (w + 120),
        y: Math.random() * h,
        len: Math.random() * 16 + 9,
        speed: Math.random() * 9 + 7,
        o: Math.random() * 0.16 + 0.07
      }));
      function draw() {
        ctx.clearRect(0, 0, w, h);
        ctx.lineWidth = 1;
        for (const d of drops) {
          d.y += d.speed;
          d.x -= d.speed * 0.14;
          if (d.y > h + 24) {
            d.y = -24;
            d.x = Math.random() * (w + 120);
          }
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.len * 0.14, d.y - d.len);
          ctx.strokeStyle = "rgba(" + nebulaRain[0] + ", " + nebulaRain[1] + ", " + nebulaRain[2] + ", " + d.o + ")";
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      window.addEventListener("resize", () => {
        w = canvas.width = canvas.offsetWidth || innerWidth;
        h = canvas.height = canvas.offsetHeight || innerHeight;
      });
      draw();
    })();
  </script>
  <script>
    try {
      window.addEventListener("storage", function (event) {
        if (event && event.key === "nebulaSettings") {
          try { window.location.reload(); } catch (e) {}
        }
      });
    } catch (e) {}
  </script>
</body>
</html>
