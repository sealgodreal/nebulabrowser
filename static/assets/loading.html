<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Minecraftia&display=swap');
    :root {
      --accent: #dfc2ef;
      --accent-hot: #ffa3d7;
    }
    html[data-theme="moss"] {
      --accent: #8fe3b8;
      --accent-hot: #d8f79b;
    }
    html[data-theme="blue-lavender"] {
      --accent: #a9c9f5;
      --accent-hot: #8ab6ff;
    }
    html[data-theme="rose"] {
      --accent: #dfa0b4;
      --accent-hot: #f7b9cd;
    }
    html[data-theme="sand"] {
      --accent: #e0c193;
      --accent-hot: #f2d5a0;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }
    #vanta {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.75;
      filter: blur(8px) saturate(1.2);
      transform: scale(1.1);
    }
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.85);
      font-family: Arial, Helvetica, sans-serif;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 28px;
    }
    .loading-text {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--accent);
    }
    .loading-text-sub {
      margin-top: 6px;
      font-family: 'Minecraftia', monospace;
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 0.04em;
      text-align: center;
      color: rgba(78, 78, 78, 1);
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    try {
      var rawNebulaSettings = localStorage.getItem("nebulaSettings");
      var parsedNebulaSettings = rawNebulaSettings ? JSON.parse(rawNebulaSettings) : {};
      var themeNebulaAccent = parsedNebulaSettings && parsedNebulaSettings.themeAccent;
      if (themeNebulaAccent === "moss" || themeNebulaAccent === "blue-lavender" || themeNebulaAccent === "rose" || themeNebulaAccent === "sand") {
        document.documentElement.setAttribute("data-theme", themeNebulaAccent);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="vanta"></div>
  <canvas id="stars"></canvas>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">loading, be patient.</div>
    <div class="loading-text-sub">sealsarcade.xyz</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script>
    const NEBULA_FOG_THEMES = {
      moss: { highlightColor: 0x33544a, midtoneColor: 0x1e2f28, lowlightColor: 0x101815, baseColor: 0x080c0a, rain: [168, 205, 178] },
      "blue-lavender": { highlightColor: 0x33405c, midtoneColor: 0x20293d, lowlightColor: 0x12161f, baseColor: 0x080a10, rain: [150, 170, 205] },
      rose: { highlightColor: 0x503a40, midtoneColor: 0x2e2226, lowlightColor: 0x171215, baseColor: 0x0c080a, rain: [205, 172, 180] },
      sand: { highlightColor: 0x4a4132, midtoneColor: 0x2c2620, lowlightColor: 0x161310, baseColor: 0x0c0a08, rain: [205, 188, 160] }
    };
    const NEBULA_FOG_THEME_KEYS = ["moss", "blue-lavender", "rose", "sand"];
    let nebulaFogTheme = null;
    try {
      const rawFogSettings = localStorage.getItem("nebulaSettings");
      const parsedFogSettings = rawFogSettings ? JSON.parse(rawFogSettings) : {};
      if (parsedFogSettings && NEBULA_FOG_THEME_KEYS.indexOf(parsedFogSettings.themeAccent) >= 0) {
        nebulaFogTheme = parsedFogSettings.themeAccent;
      }
    } catch (e) {}
    const nebulaFogPalette = (nebulaFogTheme && NEBULA_FOG_THEMES[nebulaFogTheme]) || null;
    const nebulaRain = (nebulaFogPalette && nebulaFogPalette.rain) || [196, 180, 210];
    VANTA.FOG({
      el: "#vanta",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: nebulaFogPalette ? nebulaFogPalette.highlightColor : 0x3a3344,
      midtoneColor: nebulaFogPalette ? nebulaFogPalette.midtoneColor : 0x232030,
      lowlightColor: nebulaFogPalette ? nebulaFogPalette.lowlightColor : 0x121218,
      baseColor: nebulaFogPalette ? nebulaFogPalette.baseColor : 0x08080c,
      blurFactor: 0.85,
      speed: 2,
      zoom: 0.8
    });
  </script>
  <script>
    (function () {
      const canvas = document.getElementById("stars");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let w = canvas.width = canvas.offsetWidth || innerWidth;
      let h = canvas.height = canvas.offsetHeight || innerHeight;
      const drops = Array.from({ length: 130 }, () => ({
        x: Math.random() * (w + 120),
        y: Math.random() * h,
        len: Math.random() * 16 + 9,
        speed: Math.random() * 9 + 7,
        o: Math.random() * 0.16 + 0.07
      }));
      function draw() {
        ctx.clearRect(0, 0, w, h);
        ctx.lineWidth = 1;
        for (const d of drops) {
          d.y += d.speed;
          d.x -= d.speed * 0.14;
          if (d.y > h + 24) {
            d.y = -24;
            d.x = Math.random() * (w + 120);
          }
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.len * 0.14, d.y - d.len);
          ctx.strokeStyle = "rgba(" + nebulaRain[0] + ", " + nebulaRain[1] + ", " + nebulaRain[2] + ", " + d.o + ")";
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      window.addEventListener("resize", () => {
        w = canvas.width = canvas.offsetWidth || innerWidth;
        h = canvas.height = canvas.offsetHeight || innerHeight;
      });
      draw();
    })();
  </script>
</body>
</html>
