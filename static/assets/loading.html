<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }
    #vanta {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.6;
      filter: blur(12px) saturate(1);
      transform: scale(1.1);
    }
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.85);
      font-family: Arial, Helvetica, sans-serif;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.12);
      border-top-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 28px;
    }
    .loading-text {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-align: center;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="vanta"></div>
  <canvas id="stars"></canvas>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">loading, be patient.</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script>
    VANTA.FOG({
      el: "#vanta",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: 0x2a2a2a,
      midtoneColor: 0x1c1c1c,
      lowlightColor: 0x101010,
      baseColor: 0x080808,
      blurFactor: 1,
      speed: 5,
      zoom: 0.6
    });
  </script>
  <script>
    (function () {
      const canvas = document.getElementById("stars");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let w = canvas.width = canvas.offsetWidth || innerWidth;
      let h = canvas.height = canvas.offsetHeight || innerHeight;
      const stars = Array.from({ length: 100 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.8 + 1.4,
        vy: Math.random() * 1.3 + 0.6,
        vx: (Math.random() - 0.5) * 0.15,
        targetVx: (Math.random() - 0.5) * 3,
        o: Math.random() * 0.35 + 0.45,
        targetO: Math.random() * 2 + 0.15
      }));
      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const star of stars) {
          star.y -= star.vy;
          if (star.y + star.r < 0) star.y = h + star.r;
          if (Math.random() < 0.01) star.targetVx = (Math.random() - 0.5) * 0.8;
          if (Math.random() < 0.02) star.targetO = Math.random() * 0.8 + 0.15;
          star.vx += (star.targetVx - star.vx) * 0.01;
          star.o += (star.targetO - star.o) * 0.16;
          star.x += star.vx;
          if (star.x - star.r > w) star.x = -star.r;
          if (star.x + star.r < 0) star.x = w + star.r;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(65, 65, 70, ${star.o})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      window.addEventListener("resize", () => {
        w = canvas.width = canvas.offsetWidth || innerWidth;
        h = canvas.height = canvas.offsetHeight || innerHeight;
      });
      draw();
    })();
  </script>
</body>
</html>
