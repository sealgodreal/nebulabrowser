<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <title>Home - Classroom</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/gclassroom.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/gclassroom.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/gclassroom.png" />
  <link rel="stylesheet" href="index.css" />
  <style>
    .info-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .info-panel {
      width: min(420px, 92vw);
      padding: 28px 28px 22px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
    }
    .info-title {
      margin: 0 0 20px;
      color: #fff;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .info-rows {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
      text-align: left;
    }
    .info-row {
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
    }
    .info-label {
      display: block;
      margin-bottom: 3px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: normal;
    }
    .info-value {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 400;
    }
    .info-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-top: 4px;
    }
    .info-icons a {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #9a9aa3;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .info-icons a:hover {
      color: #f4f4f5;
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
    }
    .info-icons svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    .info-back {
      display: inline-block;
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      font-weight: 300;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .info-back:hover {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <iframe id="background-frame" src="assets/bg.html" title="Background"></iframe>
  <main class="info-page">
    <div class="info-panel">
      <h1 class="info-title">Site Information</h1>
      <div class="info-rows">
        <div class="info-row">
          <span class="info-label">Website</span>
          <span class="info-value">Nebula Unblocker</span>
        </div>
        <div class="info-row">
          <span class="info-label">Build Info</span>
          <span class="info-value">Beta/Experimental</span>
        </div>
        <div class="info-row">
          <span class="info-label">Proxy</span>
          <span class="info-value">Ultraviolet v3.2.7</span>
        </div>
        <div class="info-row">
          <span class="info-label">Developers</span>
          <span class="info-value">sealgod</span>
        </div>
      </div>
      <div class="info-icons">
        <a href="https://dsc.gg/nebulabest" target="_blank" rel="noopener noreferrer" title="Discord" aria-label="Discord">

      </div>
      <a class="info-back" href="/">Return</a>
    </div>
  </main>
</body>
</html>
