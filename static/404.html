<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 - Google Classroom</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: -1;
    }
    .error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      width: 90%;
      max-width: 700px;
    }
    .error h1 {
      margin: 0;
      font-size: 110px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -4px;
    }
    .error p {
      margin: 18px 0 0;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <iframe src="assets/bg.html"></iframe>
  <main class="error">
    <h1>404</h1>
    <p>We could not find what you were looking for.</p>
  </main>
</body>
</html>
