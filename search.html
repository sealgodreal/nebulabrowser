<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="assets/main/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
:root{
    --bg:#0a0a0a;
    --surface:#111;
    --surface2:#161616;
    --border:#1f1f1f;
    --border-subtle:#171717;
    --text:#fff;
    --text-muted:#666;
    --text-dim:#404040;
    --hover:#141414;
    --tab-h:36px
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    margin: 0;
    padding: 0;
    position: fixed;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    touch-action: manipulation;
}
body{
    color:var(--text);
    font-family:Inter,system-ui,sans-serif;
    font-size:13px;
    -webkit-font-smoothing:antialiased;
}
.browser-wrapper {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}
.topbar{
    background:var(--bg);
    user-select:none;
    border-bottom:1px solid var(--border-subtle);
    position:relative;
    z-index:9;
    width:111.111111%;
    height:80px;
    transform:scale(.9);
    transform-origin:top left
}
.tabs{
    display:flex;
    align-items:stretch;
    height:var(--tab-h);
    padding:0 6px;
    gap:1px;
    border-bottom:1px solid var(--border-subtle);
    overflow:hidden;
    transition:none
}
.topbar.collapsing .tabs{
    transform:translateY(-100%);
    opacity:0
}
.topbar.expanding .tabs{
    transform:translateY(-100%);
    opacity:0;
    pointer-events:none
}
.topbar.expanding.showing .tabs{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto
}
.topbar.collapsed .tabs{
    height:0;
    padding-top:0;
    padding-bottom:0;
    border-bottom-color:transparent;
    transform:translateY(-100%);
    opacity:0;
    pointer-events:none
}
.topbar.collapsed{
    height:44px
}
.tab{
    background:transparent;
    border:none;
    padding:0 12px;
    border-radius:6px 6px 0 0;
    font-size:12px;
    font-weight:400;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--text-muted);
    max-width:200px;
    min-width:80px;
    overflow:hidden;
    white-space:nowrap;
    transition:background .1s,color .1s;
    position:relative;
    flex-shrink:1
}
.tab:hover{
    background:var(--hover);
    color:#999
}
.tab.active{
    background:var(--surface);
    color:var(--text);
    font-weight:500
}
.tab.active:after{
    content:'';
    position:absolute;
    bottom:-1px;
    left:0;
    right:0;
    height:1px;
    background:var(--surface)
}
.tab-favicon{
    width:16px;
    height:16px;
    font-size:14px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
    flex-shrink:0
}
.tab-label{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis
}
.close{
    opacity:0;
    font-size:11px;
    line-height:1;
    padding:2px 3px;
    border-radius:3px;
    color:var(--text-muted);
    flex-shrink:0;
    transition:opacity .1s,background .1s
}
.tab:hover .close{
    opacity:1
}
.close:hover{
    background:var(--surface2);
    color:var(--text)
}
.new-tab{
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:24px;
    margin:auto 2px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:18px;
    font-weight:300;
    border-radius:4px;
    transition:color .1s,background .1s;
    flex-shrink:0
}
.new-tab:hover{
    color:var(--text-muted);
    background:var(--hover)
}
.navbar{
    display:flex;
    align-items:center;
    gap:2px;
    padding:6px 8px;
    height:44px
}
.nav-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:14px;
    width:28px;
    height:28px;
    cursor:pointer;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .1s,color .1s;
    flex-shrink:0;
    text-decoration:none
}
.nav-btn:hover{
    background:var(--hover);
    color:var(--text-muted)
}
.nav-btn:active{
    background:var(--surface2)
}
.nav-btn svg{
    pointer-events:none
}
.home-btn{
    width:32px;
    height:32px
}
.home-btn svg{
    width:17px;
    height:17px
}
.omnibox-wrap{
    flex:1;
    display:flex;
    padding:0 6px
}
.omnibox{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--surface);
    border:1px solid #383838;
    border-radius:6px;
    padding:5px 12px;
    width:100%;
    position:relative;
    overflow:hidden;
    transition:background .15s
}
.omnibox-border{
    position:absolute;
    z-index:0;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    opacity:.78;
    filter:drop-shadow(0 0 3px rgba(102,102,102,.24));
    transition:opacity .15s
}
.omnibox-border rect{
    fill:none;
    stroke:#444;
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:32 68;
    stroke-dashoffset:0;
    vector-effect:non-scaling-stroke;
    animation:omnibox-border-travel 4s linear infinite
}
.omnibox:focus-within{
    background:#131313
}
.omnibox:focus-within .omnibox-border{
    opacity:1
}
.omnibox > *{
    position:relative;
    z-index:1
}
.omnibox > .omnibox-border{
    position:absolute;
    z-index:0
}
@keyframes omnibox-border-travel{
    to{stroke-dashoffset:-100}
}
@media (prefers-reduced-motion:reduce){
    .omnibox-border rect{animation:none}
}
.omnibox-icon{
    color:var(--text-dim);
    flex-shrink:0;
    display:flex;
    align-items:center
}
.omnibox input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:12.5px;
    font-family:Inter,sans-serif;
    font-weight:400;
    letter-spacing:.01em;
    text-align:left
}
.omnibox input::placeholder{
    color:var(--text-dim)
}
.omnibox input:disabled{
    opacity:0.5;
    cursor:not-allowed
}
.page{
    position:absolute;
    top:72px;
    bottom:0;
    left:0;
    right:0;
    background:var(--bg);
    transition:none
}
.topbar.collapsed + .page{
    top:40px
}
.webview{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
    display:none;
    background:var(--bg);
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x pan-y pinch-zoom;
    overscroll-behavior:contain;
    pointer-events:auto;
    user-select:auto;
    -webkit-user-select:auto;
}
@media (max-width: 768px){
    .browser-wrapper{
        height:100dvh;
        min-height:100dvh
    }
    .page{
        height:calc(100dvh - 72px);
        min-height:0
    }
    .topbar.collapsed + .page{
        height:calc(100dvh - 40px)
    }
    .webview{
        display:none;
        height:100%;
        min-height:0;
        overflow:scroll;
        -webkit-overflow-scrolling:touch;
        touch-action:pan-x pan-y pinch-zoom;
        overscroll-behavior:auto;
        pointer-events:auto;
        user-select:auto;
        -webkit-user-select:auto;
    }
}
#loadingOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    z-index: -1;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: none;
    pointer-events: none;
}
#loadingOverlay.visible {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.2s ease-in;
}
#loadingOverlay.hidden {
    opacity: 0;
    transition: opacity 0.3s ease-out;
    pointer-events: none;
    z-index: -1;
}
#loadingOverlay iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #0a0a0a;
}
</style>
</head>
<body>
<div class="browser-wrapper">
    <div class="topbar">
        <div class="tabs" id="tabs"></div>
        <div class="navbar">
            <button class="nav-btn" onclick="goBack()" title="Back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <button class="nav-btn" onclick="goForward()" title="Forward">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
            <button class="nav-btn" onclick="doReload()" title="Reload">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
            </button>
            <a class="nav-btn home-btn" id="homeBtn" href="#" title="Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 11.5L12 4l9 7.5"/>
                    <path d="M5.5 10v9h13v-9"/>
                    <path d="M9.5 19v-5h5v5"/>
                </svg>
            </a>
            <div class="omnibox-wrap">
                <div class="omnibox">
                    <svg class="omnibox-border" aria-hidden="true" preserveAspectRatio="none">
                        <rect x="2" y="2" width="calc(100% - 4px)" height="calc(100% - 4px)" rx="5" pathLength="100"/>
                    </svg>
                    <span class="omnibox-icon">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </span>
                    <input
                        id="url"
                        placeholder="Search or type a URL"
                        onkeydown="navigate(event)"
                    >
                </div>
            </div>
        </div>
    </div>
    <div class="page" id="page">
        <div id="loadingOverlay"></div>
    </div>
</div>
<script>
let _p="https://except-fails-offered-registered.trycloudflare.com/ixl/";
const NEW_TAB_URL="assets/html/home.html";
const NEW_TAB_ADDRESS="nebula://new";
let proxyReady = true;
let pendingNavigations = [];
let loadingTimeout = null;

const _launchParams = (function () {
    const params = new URLSearchParams(window.location.search);
    const url          = params.get("url")           || null;
    const originalstate= params.get("originalstate") || null;
    const file         = params.get("file")          || "false";
    if (window.history && window.history.replaceState) {
        window.history.replaceState({}, "", window.location.pathname);
    }
    return { url, originalstate, file };
})();

function showLoadingOverlay() {
    const overlay = document.getElementById('loadingOverlay');
    if (!overlay) return;
    if (loadingTimeout) { clearTimeout(loadingTimeout); loadingTimeout = null; }
    overlay._hideAborted = true;
    const old = document.getElementById('loadingFrame');
    if (old) { old.src = 'about:blank'; old.remove(); }
    const loadingFrame = document.createElement('iframe');
    loadingFrame.src = 'assets/html/loading.html';
    loadingFrame.id = 'loadingFrame';
    overlay.appendChild(loadingFrame);
    overlay.style.display = 'flex';
    overlay.style.zIndex = '10';
    void overlay.offsetHeight;
    overlay.classList.remove('hidden');
    overlay.classList.add('visible');
    loadingTimeout = setTimeout(hideLoadingOverlay, 15000);
}

function hideLoadingOverlay() {
    const overlay = document.getElementById('loadingOverlay');
    if (!overlay) return;
    if (loadingTimeout) { clearTimeout(loadingTimeout); loadingTimeout = null; }
    overlay._hideAborted = false;
    overlay.classList.remove('visible');
    overlay.classList.add('hidden');
    const cleanup = () => {
        if (overlay._hideAborted) return;
        const frame = document.getElementById('loadingFrame');
        if (frame) { frame.src = 'about:blank'; frame.remove(); }
        overlay.style.display = 'none';
        overlay.style.zIndex = '-1';
    };
    const onTransitionEnd = (e) => {
        if (e.propertyName !== 'opacity') return;
        overlay.removeEventListener('transitionend', onTransitionEnd);
        clearTimeout(fallback);
        cleanup();
    };
    overlay.addEventListener('transitionend', onTransitionEnd);
    const fallback = setTimeout(() => {
        overlay.removeEventListener('transitionend', onTransitionEnd);
        cleanup();
    }, 500);
}

function handlePageLoad() { hideLoadingOverlay(); }

function isLocalFile(url) {
    if (!url) return false;
    if (url.startsWith("about:") || url.startsWith("data:") || url.startsWith("blob:")) return true;
    if (url.startsWith("file:")) return true;
    try {
        const resolved = new URL(url, document.baseURI);
        return resolved.origin === window.location.origin;
    } catch {
        return false;
    }
}

function getHomeURL(){
    const state = _launchParams.originalstate;
    if (state === "full" || state === "browser") {
        return `./dashboard.html?state=${encodeURIComponent(state)}`;
    }
    return "./dashboard.html";
}

const HOME = getHomeURL();
let tabs = [];
let activeTab = null;
let tabId = 0;
const tabsContainer = document.getElementById("tabs");
const page = document.getElementById("page");
const urlInput = document.getElementById("url");
const homeBtn = document.getElementById("homeBtn");
const topbar = document.querySelector(".topbar");
let topbarCollapseTimeout = null;
let topbarCollapseStartFrame = null;
let topbarExpandCleanupTimeout = null;
let topbarTabsAnimation = null;
let topbarPageAnimation = null;
let topbarState = "expanded";

function resetTopbarCollapseTimer(){
    if(!topbar) return;
    const wasCollapsed = topbarState === "collapsed" || topbarState === "collapsing";
    if(topbarExpandCleanupTimeout){ clearTimeout(topbarExpandCleanupTimeout); topbarExpandCleanupTimeout = null; }
    if(wasCollapsed){ topbarTabsAnimation?.cancel(); topbarPageAnimation?.cancel(); }
    topbar.classList.remove("collapsed","collapsing","expanding","showing");
    if(wasCollapsed){
        topbarState = "expanding";
        tabsContainer.style.cssText = "height:0px;min-height:0px;max-height:36px;padding-top:0px;padding-bottom:0px;transform:translateY(-100%);opacity:0;pointer-events:auto";
        page.style.setProperty("top","40px");
        void tabsContainer.offsetHeight;
        topbarTabsAnimation = tabsContainer.animate([
            { height:"0px", transform:"translateY(-100%)", opacity:0 },
            { height:"36px", transform:"translateY(0)", opacity:1 }
        ],{duration:160,easing:"cubic-bezier(0.16,1,0.3,1)",fill:"forwards"});
        topbarPageAnimation = page.animate([
            { top:"40px" },{ top:"72px" }
        ],{duration:160,easing:"cubic-bezier(0.16,1,0.3,1)",fill:"forwards"});
        topbarTabsAnimation.onfinish = () => {
            topbarTabsAnimation = null;
            topbarState = "expanded";
            tabsContainer.style.cssText = "";
            page.style.removeProperty("top");
        };
    } else if(topbarState === "expanded"){
        tabsContainer.style.cssText = "";
        page.style.removeProperty("top");
    }
    if(topbarCollapseTimeout) clearTimeout(topbarCollapseTimeout);
    if(topbarCollapseStartFrame !== null){ cancelAnimationFrame(topbarCollapseStartFrame); topbarCollapseStartFrame = null; }
    topbarCollapseTimeout = setTimeout(()=>{
        topbarState = "collapsing";
        tabsContainer.style.pointerEvents = "none";
        topbarTabsAnimation = tabsContainer.animate([
            { height:"36px", transform:"translateY(0)", opacity:1 },
            { height:"0px", transform:"translateY(-100%)", opacity:0 }
        ],{duration:160,easing:"cubic-bezier(0.16,1,0.3,1)",fill:"forwards"});
        topbarPageAnimation = page.animate([
            { top:"72px" },{ top:"40px" }
        ],{duration:160,easing:"cubic-bezier(0.16,1,0.3,1)",fill:"forwards"});
        topbarTabsAnimation.onfinish = () => {
            topbarTabsAnimation = null;
            topbarState = "collapsed";
            topbar.classList.add("collapsed");
            tabsContainer.style.cssText = "height:0px;min-height:0px;max-height:0px;padding-top:0px;padding-bottom:0px";
            page.style.setProperty("top","40px","important");
        };
    }, 2000);
}

["pointerenter","pointermove","pointerdown","focusin","keydown"].forEach(ev => {
    topbar?.addEventListener(ev, resetTopbarCollapseTimer);
});

homeBtn.href = HOME;
homeBtn.onclick = e => {
    if(window.parent !== window && typeof window.parent.closeBrowserOverlay === "function"){
        e.preventDefault();
        window.parent.closeBrowserOverlay();
    }
};

const newTabBtn = document.createElement("div");
newTabBtn.className = "new-tab";
newTabBtn.textContent = "+";
newTabBtn.title = "New Tab";
newTabBtn.onclick = () => createTab(NEW_TAB_URL, true, true, NEW_TAB_ADDRESS);
tabsContainer.appendChild(newTabBtn);

function toProxy(url) {
    if (!url || url === "about:blank") return url;
    return _p + encodeURIComponent(url);
}

function isSearchQuery(input) {
    input = input.trim();
    if(!input) return false;
    if(input.startsWith("http://") || input.startsWith("https://") || input.startsWith("about:")) return false;
    if(/^[^\s]+\.[^\s]+$/.test(input)) return false;
    return true;
}

function formatURL(input){
    input = input.trim();
    if(!input) return "about:blank";
    if(input.startsWith("http://") || input.startsWith("https://") || input.startsWith("about:")) return input;
    if(/^[^\s]+\.[^\s]+$/.test(input)) return "https://" + input;
    return "https://duckduckgo.com/?q=" + encodeURIComponent(input) + "&ia=web";
}

const EDU_TAB_TITLES = {
    "edu/study.html":"Study",
    "edu/apps.html":"Apps",
    "edu/remote.html":"Remote",
    "edu/cloud.html":"Cloud"
};

function getEduTabTitle(url){ return EDU_TAB_TITLES[url] || null; }

function getTabTitle(url){
    if(!url || url === "about:blank") return "New Tab";
    const edu = getEduTabTitle(url);
    if(edu) return edu;
    try{ return new URL(url).hostname.replace("www.",""); }
    catch{ return "New Tab"; }
}

function createTab(url="about:blank", makeActive=true, skipProxy=false, displayUrl=null){
    const id = tabId++;
    const tab = document.createElement("div");
    tab.className = "tab";

    const favicon = document.createElement("span");
    favicon.className = "tab-favicon";
    favicon.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>`;

    const label = document.createElement("span");
    label.className = "tab-label";
    label.textContent = getTabTitle(url);

    const close = document.createElement("span");
    close.className = "close";
    close.innerHTML = "&#10005;";
    close.title = "Close";
    close.onclick = e => { e.stopPropagation(); closeTab(id); };

    tab.append(favicon, label, close);

    const iframe = document.createElement("iframe");
    iframe.setAttribute("scrolling","yes");
    iframe.setAttribute("allowtransparency","true");
    iframe.style.touchAction = "pan-x pan-y pinch-zoom";
    iframe.style.webkitOverflowScrolling = "touch";
    iframe.allow = "camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write; web-share; xr-spatial-tracking; gamepad; geolocation; accelerometer; ambient-light-sensor; battery; bluetooth; browsing-topics; compute-pressure; document-domain; encrypted-media; execution-while-not-rendered; execution-while-out-of-viewport; fullscreen; gyroscope; hid; identity-credentials-get; idle-detection; keyboard-map; local-fonts; magnetometer; midi; otp-credentials; payment; picture-in-picture; publickey-credentials-create; publickey-credentials-get; screen-wake-lock; serial; speaker-selection; storage-access; usb; window-management";
    iframe.className = "webview";
    iframe.allowFullscreen = true;

    const obj = { id, tab, iframe, url, displayUrl: displayUrl || url, label, history:[], historyIndex:-1, reloadPending:false, skipProxy:false };
    tabs.push(obj);
    page.appendChild(iframe);
    tabsContainer.insertBefore(tab, newTabBtn);
    tab.onclick = () => switchTab(id);

    iframe.addEventListener("load", () => {
        if(obj.url === "about:blank"){
            try{
                const d = obj.iframe.contentDocument;
                if(d){ d.documentElement.style.background="#0a0a0a"; if(d.body) d.body.style.background="#0a0a0a"; }
            }catch{}
        }
        if(obj.reloadPending){
            const src = obj.iframe.src;
            obj.reloadPending = false;
            setTimeout(()=>{ if(obj.iframe.isConnected && obj.iframe.src===src) obj.iframe.src = src; }, 0);
            return;
        }
        if(activeTab?.id === id){ updateAddressBar(); handlePageLoad(); }
        updateTabFromFrame(obj);
    });

    if(makeActive) switchTab(id);
    loadURL(id, url, skipProxy, true, displayUrl);
}

function updateTabFromFrame(tab){
    if(tab.displayUrl === NEW_TAB_ADDRESS){ tab.label.textContent = "New Tab"; return; }
    const edu = getEduTabTitle(tab.url);
    if(edu){ tab.label.textContent = edu; return; }
    try{
        const title = tab.iframe.contentDocument?.title;
        if(title){ tab.label.textContent = title; return; }
    }catch{}
    tab.label.textContent = getTabTitle(tab.url);
}

function switchTab(id){
    tabs.forEach(t=>{ t.tab.classList.remove("active"); t.iframe.style.display="none"; });
    const t = tabs.find(t=>t.id===id);
    if(!t) return;
    t.tab.classList.add("active");
    t.iframe.style.display = "block";
    activeTab = t;
    updateAddressBar();
}

function closeTab(id){
    const index = tabs.findIndex(t=>t.id===id);
    if(index===-1) return;
    const wasActive = tabs[index].id === activeTab?.id;
    tabs[index].tab.remove();
    tabs[index].iframe.remove();
    tabs.splice(index,1);
    if(!tabs.length){ activeTab=null; createTab(NEW_TAB_URL,true,true,NEW_TAB_ADDRESS); return; }
    if(wasActive) switchTab(tabs[Math.max(0,index-1)].id);
}

function loadURL(id, raw, skipProxy, addHistory=true, displayUrl=null){
    const t = tabs.find(t=>t.id===id);
    if(!t) return;
    const bypassProxy = skipProxy || isLocalFile(raw);
    const url = bypassProxy ? raw : formatURL(raw);
    if(addHistory){
        t.history = t.history.slice(0, t.historyIndex+1);
        if(t.history[t.history.length-1]?.url !== url || t.history[t.history.length-1]?.skipProxy !== bypassProxy){
            t.history.push({ url, skipProxy: bypassProxy, displayUrl: displayUrl||url });
        }
        t.historyIndex = t.history.length-1;
    }
    t.url = url;
    t.displayUrl = displayUrl || url;
    t.skipProxy = bypassProxy;
    t.reloadPending = !bypassProxy && url !== "about:blank";
    if(activeTab?.id === id){
        urlInput.value = t.displayUrl;
        if(!bypassProxy && url !== "about:blank") showLoadingOverlay();
    }
    t.label.textContent = t.displayUrl===NEW_TAB_ADDRESS ? "New Tab" : getTabTitle(url);
    if(url === "about:blank"){ t.iframe.src = "about:blank"; }
    else if(bypassProxy){ t.iframe.src = url; }
    else{ t.iframe.src = toProxy(url); }
}

function updateAddressBar(){
    if(activeTab) urlInput.value = activeTab.displayUrl || activeTab.url || "";
}

function navigate(e){
    if(e.key==="Enter" && activeTab){
        const inputValue = e.target.value;
        const formattedUrl = formatURL(inputValue);
        if(formattedUrl !== "about:blank") showLoadingOverlay();
        loadURL(activeTab.id, formattedUrl);
        urlInput.value = isSearchQuery(inputValue) ? formattedUrl : inputValue;
    }
}

function goBack(){
    if(!activeTab || activeTab.historyIndex <= 0) return;
    activeTab.historyIndex--;
    const entry = activeTab.history[activeTab.historyIndex];
    loadURL(activeTab.id, entry.url, entry.skipProxy, false, entry.displayUrl);
}

function goForward(){
    if(!activeTab || activeTab.historyIndex >= activeTab.history.length-1) return;
    activeTab.historyIndex++;
    const entry = activeTab.history[activeTab.historyIndex];
    loadURL(activeTab.id, entry.url, entry.skipProxy, false, entry.displayUrl);
}

function doReload(){
    if(!activeTab || activeTab.url === "about:blank") return;
    try{ showLoadingOverlay(); activeTab.iframe.contentWindow.location.reload(); }
    catch{ activeTab.iframe.src = activeTab.iframe.src; }
}

document.addEventListener("keydown", e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="l"){ e.preventDefault(); urlInput.focus(); urlInput.select(); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="r"){ e.preventDefault(); doReload(); }
    if(e.altKey && e.key==="ArrowLeft"){ e.preventDefault(); goBack(); }
    if(e.altKey && e.key==="ArrowRight"){ e.preventDefault(); goForward(); }
});

(function applyMobileTouchFix(){
    const pageEl = document.getElementById('page');
    if(pageEl){ pageEl.addEventListener('touchmove', e=>{ if(e.target===pageEl) e.preventDefault(); },{ passive:false }); }
    function patchIframe(iframe){
        if(!iframe) return;
        iframe.style.touchAction = 'pan-x pan-y pinch-zoom';
        iframe.style.webkitOverflowScrolling = 'touch';
        iframe.style.pointerEvents = 'auto';
        iframe.addEventListener('load',()=>{
            iframe.style.touchAction = 'pan-x pan-y pinch-zoom';
            iframe.style.webkitOverflowScrolling = 'touch';
            iframe.style.pointerEvents = 'auto';
        });
    }
    const obs = new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.tagName==='IFRAME') patchIframe(n); })));
    obs.observe(document.getElementById('page')||document.body,{ childList:true, subtree:true });
    document.querySelectorAll('iframe.webview').forEach(patchIframe);
})();

(function init(){
    const startUrl = _launchParams.url;
    if(startUrl){
        createTab(startUrl, true, false, startUrl);
    } else {
        createTab(NEW_TAB_URL, true, true, NEW_TAB_ADDRESS);
    }
})();
</script>
