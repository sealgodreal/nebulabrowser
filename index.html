<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula | Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;600&family=Geist:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --ease-out-mac: cubic-bezier(0.22, 1, 0.36, 1); }

body {
  font-family: 'Geist', sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  color: white;
  overflow: hidden;
}

#bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.35;
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 28px 34px;
  border-radius: 16px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);
}
.logo { font-size: 2.8rem; font-weight: 600; }
.logo span { color: rgba(255,255,255,0.2); font-weight: 300; }
.subtext { margin-top: 8px; font-size: 13px; color: #555; }
.button {
  margin-top: 20px;
  display: inline-block;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid #1a1a1a;
  background: #080808;
  color: #aaa;
  font-size: 13px;
  cursor: pointer;
  transition: 0.2s;
  text-decoration: none;
}
.button:hover { background: #111; border-color: #333; color: #fff; transform: translateY(-1px); }

.footer { position: absolute; bottom: 18px; font-size: 11px; color: #2a2a2a; z-index: 2; }

body.fading-out { animation: pageFade 0.55s ease forwards; }
@keyframes pageFade { from { opacity: 1; } to { opacity: 0; } }

.quiet-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
  z-index: 10;
}
.quiet-overlay.visible { opacity: 1; }
.quiet-text {
  font-size: 1.05rem;
  color: rgba(255,255,255,0.3);
  letter-spacing: -0.01em;
  font-weight: 300;
}
.quiet-text strong { color: rgba(255,255,255,0.65); font-weight: 600; }

.macos-window {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 420px;
  border-radius: 14px;
  background: rgba(6,6,6,0.95);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 20px 60px rgba(0,0,0,0.95);
  overflow: hidden;
  animation: popIn 0.45s var(--ease-out-mac);
  z-index: 5;
  transition: opacity 0.3s ease, box-shadow 0.35s var(--ease-out-mac);
}

@keyframes popIn {
  0%   { transform: translate(-50%, -50%) scale(0.92); opacity: 0; filter: blur(8px); }
  100% { transform: translate(-50%, -50%) scale(1);    opacity: 1; filter: blur(0); }
}

.macos-window:not(.fullscreen):hover { box-shadow: 0 28px 80px rgba(0,0,0,0.9); }

.macos-window.fullscreen {
  top: 0 !important; left: 0 !important;
  width: 100vw !important; height: 100vh !important;
  border-radius: 0 !important;
  overflow-y: auto;
  transform: none !important;
  transition: top 0.45s var(--ease-out-mac), left 0.45s var(--ease-out-mac),
              width 0.45s var(--ease-out-mac), height 0.45s var(--ease-out-mac),
              border-radius 0.45s var(--ease-out-mac),
              opacity 0.3s ease, box-shadow 0.45s var(--ease-out-mac) !important;
}

.macos-window.exiting-fullscreen {
  transition: top 0.45s var(--ease-out-mac), left 0.45s var(--ease-out-mac),
              width 0.45s var(--ease-out-mac), height 0.45s var(--ease-out-mac),
              border-radius 0.45s var(--ease-out-mac), transform 0.45s var(--ease-out-mac),
              opacity 0.3s ease, box-shadow 0.45s var(--ease-out-mac) !important;
}

.macos-window.fading-out  { opacity: 0 !important; transition: opacity 0.3s ease !important; }
.macos-window.fading-in   { opacity: 1 !important; transition: opacity 0.35s ease !important; }

.titlebar {
  height: 34px;
  display: grid;
  grid-template-columns: 60px 1fr 60px;
  align-items: center;
  padding: 0 10px;
  cursor: grab;
  background: rgba(255,255,255,0.02);
  user-select: none;
}
.titlebar.no-drag { cursor: default; }

.traffic { display: flex; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: filter 0.15s; }
.dot:hover { filter: brightness(1.3); }
.red    { background: #ff5f57; }
.yellow { background: #febc2e; }
.green  { background: #28c840; }

.title { font-size: 12px; color: #555; text-align: center; }
.window-body { padding: 20px; }

.dock {
  position: fixed;
  bottom: 24px;
  left: 24px;
  display: none;
  padding: 9px 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  backdrop-filter: blur(14px);
  font-size: 12px; color: rgba(255,255,255,0.5);
  cursor: pointer;
  opacity: 0;
  z-index: 20;
  transition: opacity 0.45s ease, color 0.2s;
}
.dock.visible { opacity: 1; }
.dock:hover { color: #fff; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="quiet-overlay" id="quietOverlay">
  <div class="quiet-text">it's quiet here. you should try out <strong>nebula</strong>!</div>
</div>

<div class="dock" id="dock">nebula portal</div>

<script>
const sped   = 5;
const canvas = document.getElementById("bg");
const ctx    = canvas.getContext("2d");

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resize);
resize();

const SHADES = [
  "rgba(255,255,255,","rgba(235,235,235,","rgba(210,210,210,",
  "rgba(185,185,185,","rgba(160,160,160,","rgba(220,220,220,"
];

function spawnParticle() {
  const w = canvas.width, h = canvas.height;
  const edge = Math.random();
  let x, y, vx, vy;
  const speed = (0.35 + Math.random() * 0.55) * sped;
  if (edge < 0.45) {
    x = Math.random() * w * 0.65; y = h * (0.92 + Math.random() * 0.08);
    const angle = -(Math.PI * 0.18 + Math.random() * Math.PI * 0.28);
    vx = speed * Math.cos(angle) * (0.6 + Math.random() * 0.6);
    vy = speed * Math.sin(angle) * (0.8 + Math.random() * 0.5);
  } else if (edge < 0.85) {
    x = w * (Math.random() * 0.05); y = h * (0.35 + Math.random() * 0.65);
    vx = speed * (0.7 + Math.random() * 0.5);
    vy = -speed * (0.3 + Math.random() * 0.5);
  } else {
    x = w * (Math.random() * 0.1); y = h * (0.85 + Math.random() * 0.15);
    const angle = -(Math.PI * 0.22 + Math.random() * Math.PI * 0.22);
    vx = speed * Math.cos(angle) * (0.6 + Math.random() * 0.7);
    vy = speed * Math.sin(angle) * (0.7 + Math.random() * 0.5);
  }
  return {
    x, y, vx, vy,
    size: 0.8 + Math.random() * 2.2,
    shade: SHADES[Math.floor(Math.random() * SHADES.length)],
    alpha: 0.25 + Math.random() * 0.5,
    frame: 0,
    wobbleAmp: 0.2 + Math.random() * 0.9,
    wobbleFreq: 0.015 + Math.random() * 0.025,
    wobbleOffset: Math.random() * Math.PI * 2,
    curve: (Math.random() - 0.35) * 0.006,
  };
}

function stepParticle(p) {
  p.vx += p.curve;
  p.x  += p.vx + Math.sin(p.frame * p.wobbleFreq + p.wobbleOffset) * p.wobbleAmp;
  p.y  += p.vy;
  p.frame++;
}

function isOffscreen(p) {
  return p.x > canvas.width + 20 || p.y < -20 || p.x < -20 || p.y > canvas.height + 20;
}

function drawParticle(p) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
  ctx.fillStyle = p.shade + p.alpha.toFixed(3) + ")";
  ctx.fill();
}

function seedParticles(count) {
  const w = canvas.width, h = canvas.height;
  const cols  = Math.ceil(Math.sqrt(count * (w / h)));
  const rows  = Math.ceil(count / cols);
  const cellW = w / cols, cellH = h / rows;
  const result = [];
  for (let row = 0; row < rows && result.length < count; row++) {
    for (let col = 0; col < cols && result.length < count; col++) {
      const targetX = col * cellW + Math.random() * cellW;
      const targetY = row * cellH + Math.random() * cellH;
      let best = null, bestDist = Infinity;
      for (let attempt = 0; attempt < 30; attempt++) {
        const p = spawnParticle();
        const preFrames = Math.floor(10 + Math.random() * 500);
        for (let f = 0; f < preFrames; f++) stepParticle(p);
        if (isOffscreen(p)) continue;
        const dist = Math.hypot(p.x - targetX, p.y - targetY);
        if (dist < bestDist) { bestDist = dist; best = p; }
        if (dist < Math.max(cellW, cellH) * 0.5) break;
      }
      result.push(best || spawnParticle());
    }
  }
  return result;
}

const particles = seedParticles(55);

(function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < particles.length; i++) {
    if (isOffscreen(particles[i])) particles[i] = spawnParticle();
    stepParticle(particles[i]);
    drawParticle(particles[i]);
  }
  requestAnimationFrame(animateParticles);
})();

const content = document.createElement("div");
content.className = "container";
content.innerHTML = `
  <div class="logo">nebula<span>.</span></div>
  <div class="subtext">welcome to your personal learning environment</div>
  <a class="button" id="getStarted" href="#">get started</a>
`;

const win = document.createElement("div");
win.className = "macos-window";
win.innerHTML = `
  <div class="titlebar" id="dragBar">
    <div class="traffic">
      <div class="dot red"    id="closeBtn"></div>
      <div class="dot yellow" id="minBtn"></div>
      <div class="dot green"  id="maxBtn"></div>
    </div>
    <div class="title">nebula portal</div>
    <div></div>
  </div>
  <div class="window-body"></div>
`;
document.body.appendChild(win);
win.querySelector(".window-body").appendChild(content);

const footer = document.createElement("div");
footer.className = "footer";
footer.textContent = "nebula - developed by sealgod";
document.body.appendChild(footer);

document.getElementById("getStarted").addEventListener("click", (e) => {
  e.preventDefault();
  document.body.classList.add("fading-out");
  setTimeout(() => { window.location.href = "./math.html"; }, 580);
});

const dock    = document.getElementById("dock");
const quietEl = document.getElementById("quietOverlay");

function showQuiet() {
  setTimeout(() => quietEl.classList.add("visible"), 200);
}

function fadeOutWindow(callback) {
  win.classList.add("fading-out");
  setTimeout(() => {
    win.style.display = "none";
    win.classList.remove("fading-out");
    if (callback) callback();
  }, 300);
}

function fadeInWindow() {
  win.style.display = "block";
  win.style.opacity = "0";
  quietEl.classList.remove("visible");
  dock.classList.remove("visible");
  setTimeout(() => { dock.style.display = "none"; }, 450);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    win.classList.add("fading-in");
    win.style.opacity = "";
    setTimeout(() => win.classList.remove("fading-in"), 350);
  }));
}

document.getElementById("closeBtn").onclick = () => {
  document.body.style.transition = "opacity 0.3s ease";
  document.body.style.opacity = "0";
  fadeOutWindow(() => {
    showQuiet();
    dock.style.display = "block";
    requestAnimationFrame(() => dock.classList.add("visible"));
  });
};

document.getElementById("minBtn").onclick = () => {
  fadeOutWindow(() => {
    dock.style.display = "block";
    requestAnimationFrame(() => requestAnimationFrame(() => dock.classList.add("visible")));
    showQuiet();
  });
};

dock.onclick = () => {
  document.body.style.transition = "opacity 0.35s ease";
  document.body.style.opacity = "1";
  fadeInWindow();
};

let fullscreen = false;
const bar = document.getElementById("dragBar");

document.getElementById("maxBtn").onclick = () => {
  if (!fullscreen) {
    fullscreen = true;
    win.classList.add("fullscreen");
    bar.classList.add("no-drag");
    isDragging = false;
  } else {
    fullscreen = false;
    win.classList.remove("fullscreen");
    win.classList.add("exiting-fullscreen");
    bar.classList.remove("no-drag");
    win.style.top = ""; win.style.left = "";
    win.style.width = "420px"; win.style.height = "auto";
    win.style.transform = "translate(-50%, -50%)";
    setTimeout(() => win.classList.remove("exiting-fullscreen"), 500);
  }
};

let isDragging = false;
let offsetX = 0, offsetY = 0;
let currentX = null, currentY = null;

bar.style.touchAction = "none"; // important for mobile

bar.addEventListener("pointerdown", (e) => {
  if (fullscreen) return;

  isDragging = true;

  const rect = win.getBoundingClientRect();
  currentX = rect.left;
  currentY = rect.top;

  win.style.transform = "none";
  win.style.left = currentX + "px";
  win.style.top = currentY + "px";

  offsetX = e.clientX - currentX;
  offsetY = e.clientY - currentY;

  bar.setPointerCapture(e.pointerId);
  bar.style.cursor = "grabbing";
});

bar.addEventListener("pointermove", (e) => {
  if (!isDragging || fullscreen) return;

  currentX = e.clientX - offsetX;
  currentY = e.clientY - offsetY;
});

bar.addEventListener("pointerup", (e) => {
  isDragging = false;
  bar.style.cursor = "grab";
  try { bar.releasePointerCapture(e.pointerId); } catch {}
});

bar.addEventListener("pointercancel", () => {
  isDragging = false;
});

(function animateWindow() {
  if (!fullscreen && isDragging && currentX !== null) {
    const cx = parseFloat(win.style.left) || 0;
    const cy = parseFloat(win.style.top)  || 0;
    win.style.left = cx + (currentX - cx) * 0.18 + "px";
    win.style.top  = cy + (currentY - cy) * 0.18 + "px";
  }
  requestAnimationFrame(animateWindow);
})();
</script>
</body>
</html>
