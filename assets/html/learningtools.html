<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface-elevated: #161616;
    --surface-hover: #1a1a1a;
    --border: #1f1f1f;
    --border-hover: #2a2a2a;
    --text: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #5a5a5a;
    --accent: #8b5cf6;
    --accent-glow: rgba(139, 92, 246, 0.25);
    --accent-soft: rgba(139, 92, 246, 0.08);
    --danger: #ef4444;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    touch-action: manipulation;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: #444;
}

.header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
}

.header-count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    padding: 2px 8px;
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
}

.search-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 14px;
    width: 220px;
    transition: var(--transition-smooth);
}

.search-wrap:focus-within {
    width: 280px;
    border-color: var(--accent);
    background: var(--surface-elevated);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-wrap svg {
    color: var(--text-muted);
    flex-shrink: 0;
    transition: var(--transition-fast);
}

.search-wrap:focus-within svg {
    color: var(--accent);
}

.search-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    width: 100%;
    font-family: inherit;
}

.search-wrap input::placeholder {
    color: var(--text-muted);
}

.content {
    padding: 40px 24px;
    display: flex;
    justify-content: center;
}

.grid {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    justify-content: center;
    gap: 16px;
}

.tool-card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: var(--transition-smooth);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    animation: fadeUp 0.35s ease both;
}

.tool-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    border: 1px solid transparent;
    transition: var(--transition-fast);
    pointer-events: none;
    z-index: 2;
}

.tool-card:hover::before {
    border-color: rgba(139, 92, 246, 0.15);
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.tool-card:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: var(--border-hover);
    box-shadow: var(--shadow-lg), 0 0 30px rgba(139, 92, 246, 0.06);
}

.tool-card:active {
    transform: translateY(-3px) scale(1.015);
    transition: var(--transition-fast);
}

.tool-icon {
    position: absolute;
    inset: 0;
}

.tool-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.9);
    transform: scale(1.05);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.tool-card:hover .tool-icon img {
    transform: scale(1.12);
    filter: brightness(0.75);
}

.tool-card .overlay-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.05)
    );
    opacity: 0;
    transition: var(--transition-smooth);
    z-index: 1;
}

.tool-card:hover .overlay-gradient {
    opacity: 1;
}

.tool-name {
    position: absolute;
    bottom: 14px;
    left: 14px;
    right: 14px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(8px);
    transition: var(--transition-smooth);
    color: var(--text);
    z-index: 3;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.tool-card:hover .tool-name {
    opacity: 1;
    transform: translateY(0);
}

.empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 16px;
    animation: fadeUp 0.4s ease both;
}

.empty-state svg {
    width: 48px;
    height: 48px;
    color: var(--text-muted);
    opacity: 0.4;
}

.empty-state p {
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
}

#toolOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: none;
    flex-direction: column;
}

#toolFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}

#loadingScreen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.5s;
    z-index: 10000;
}

#loadingScreen iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.close-overlay-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: rgba(17, 17, 17, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10001;
    transition: var(--transition-fast);
    box-shadow: var(--shadow-md);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.close-overlay-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-hover);
}

.close-overlay-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.close-overlay-btn.dragging {
    opacity: 0.8;
    cursor: grabbing;
    transition: none;
}

@media (max-width: 768px) {
    .content {
        padding: 24px 16px;
    }

    .grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
    }

    .header {
        padding: 12px 16px;
    }

    .search-wrap {
        width: 160px;
    }

    .search-wrap:focus-within {
        width: 200px;
    }

    .header-title {
        font-size: 14px;
    }
}

@media (max-width: 480px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }
}

::selection {
    background: rgba(139, 92, 246, 0.3);
    color: #fff;
}
</style>

<base target="_blank">
</head>

<body>

<div class="header">
    <div class="header-brand">
        <span class="header-title">Nebula Apps</span>
    </div>

    <span class="header-count" id="toolCount">0 apps</span>

    <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>

        <input type="text" id="searchInput" placeholder="Search apps..." autocomplete="off">
    </div>
</div>

<div class="content">
    <div class="grid" id="grid"></div>
</div>

<div id="toolOverlay">

    <button class="close-overlay-btn" id="closeOverlayBtn" aria-label="Close">
        <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <div id="loadingScreen">
        <iframe src="./loading.html"></iframe>
    </div>

    <iframe
        id="toolFrame"
        allow="camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write; web-share; xr-spatial-tracking; gamepad; geolocation; accelerometer; ambient-light-sensor; battery; bluetooth; browsing-topics; compute-pressure; document-domain; encrypted-media; execution-while-not-rendered; execution-while-out-of-viewport; fullscreen; gyroscope; hid; identity-credentials-get; idle-detection; keyboard-map; local-fonts; magnetometer; midi; otp-credentials; payment; picture-in-picture; publickey-credentials-create; publickey-credentials-get; screen-wake-lock; serial; speaker-selection; storage-access; usb; window-management"
        allowfullscreen
        credentialless
    ></iframe>

</div>

<script>
let searchQuery = "";
let _p = "";

const grid = document.getElementById("grid");
const overlay = document.getElementById("toolOverlay");
const loadingScreen = document.getElementById("loadingScreen");
const closeOverlayBtn = document.getElementById("closeOverlayBtn");

let frame = document.getElementById("toolFrame");
let loadToken = 0;

async function P_FETCH() {
    const keys = await caches.keys();
    for (const key of keys) await caches.delete(key);
    sessionStorage.clear();

    const proxyUrls = [
        "https://brooklyn-oval-bike-tourism.trycloudflare.com",
        "https://resources-indices-exists-maintaining.trycloudflare.com",
        "https://modules-stop-souls-precipitation.trycloudflare.com"
    ];

    const overlay = Object.assign(document.createElement("div"), {
        id: "proxyOverlay",
        style: "position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;flex-direction:column;user-select:none;"
    });
    const statusText = Object.assign(document.createElement("div"), {
        id: "proxyStatus",
        style: "color:#fff;font-size:16px;font-weight:300;letter-spacing:1px;",
        textContent: "finding unblocked proxy..."
    });
    overlay.appendChild(statusText);
    document.body.appendChild(overlay);

    const probeFrame = Object.assign(document.createElement("iframe"), {
        id: "probeFrame",
        style: "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;",
        sandbox: "allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
    });
    document.body.appendChild(probeFrame);

    const isFrameBlocked = () => {
        try {
            const src = probeFrame.src;
            if (!src || src === "about:blank" || src.startsWith("about:")) return true;

            let href = null;
            try { href = probeFrame.contentWindow?.location?.href || probeFrame.src; } catch (_) { href = probeFrame.src; }

            const lower = (href || src || "").toLowerCase();
            const blockedKeywords = [
                "securly.com/broker/blocked","goguardian.com/blocked","goguardian.com/filter",
                "lightspeed.com/blocked","iboss.com/blocked","smoothwall.com/blocked",
                "fortiguard.com/blocked","opendns.com/blocked","umbrella.com/blocked",
                "zscaler.com/blocked","mcafee.com/blocked","barracuda.com/blocked",
                "forcepoint.com/blocked","netnanny.com/blocked","cyberpatrol.com/blocked",
                "surfwatch.com/blocked","covenanteyes.com/blocked","blocked","filter",
                "restricted","denied","forbidden","notallowed","policyviolation",
                "accessdenied","categoryblocked","webfilter","dnsfilter","contentfilter"
            ];
            if (blockedKeywords.some(k => lower.includes(k))) return true;

            try {
                const doc = probeFrame.contentDocument || probeFrame.contentWindow?.document;
                if (doc) {
                    const title = (doc.title || "").toLowerCase();
                    if (["blocked","securly","goguardian","access denied","forbidden","restricted","filter"].some(k => title.includes(k))) return true;
                    if (doc.body) {
                        const bodyText = (doc.body.innerText || doc.body.textContent || "").toLowerCase();
                        if (bodyText.includes("login to continue") && bodyText.includes("school email")) return true;
                        if (bodyText.trim().length < 10) return true;
                    }
                }
            } catch (_) {}
            return false;
        } catch (_) { return false; }
    };

    const fetchBlocked = async url => {
        try { await fetch(url, { method: "HEAD", mode: "no-cors", cache: "no-store" }); return false; }
        catch (_) { return true; }
    };

    const loadFrame = (url, timeout = 15000) => new Promise((resolve, reject) => {
        let timer = null;
        let settled = false;
        const cleanup = () => { if (timer) clearTimeout(timer); probeFrame.onload = null; probeFrame.onerror = null; };
        probeFrame.onload = () => { if (!settled) { settled = true; cleanup(); resolve(); } };
        probeFrame.onerror = () => { if (!settled) { settled = true; cleanup(); reject(); } };
        timer = setTimeout(() => { if (!settled) { settled = true; cleanup(); reject(); } }, timeout);
        probeFrame.src = url;
    });

    const findProxy = async () => {
        let attempt = 0;
        const maxAttempts = proxyUrls.length * 3;
        let idx = 0;

        while (attempt < maxAttempts) {
            const url = proxyUrls[idx % proxyUrls.length];
            try {
                await loadFrame(url, 18000);
                let blocked = isFrameBlocked();
                if (!blocked && await fetchBlocked(url)) {
                    const src = probeFrame.src || "";
                    if (src.includes("securly") || src.includes("goguardian") || src.includes("blocked") || src.includes("filter")) {
                        blocked = true;
                    }
                }
                const lower = url.toLowerCase();
                if (lower.includes("securly.com/broker/blocked") || lower.includes("goguardian.com/blocked")) blocked = true;
                if (!blocked) return url;
            } catch (_) {}
            idx = (idx + 1) % proxyUrls.length;
            attempt++;
            await new Promise(r => setTimeout(r, 500));
        }
        return null;
    };

    const found = await findProxy();
    const overlayEl = document.getElementById("proxyOverlay");
    const statusEl = document.getElementById("proxyStatus");

    if (found) {
        if (statusEl) statusEl.textContent = "link found! initializing...";
        _p = found + "/learn/study/";
        await new Promise(r => setTimeout(r, 100));
        if (overlayEl) overlayEl.remove();
    } else {
        if (statusEl) statusEl.textContent = "all proxy links are blocked.";
    }

    const probeFrameEl = document.getElementById("probeFrame");
    if (probeFrameEl) { probeFrameEl.src = "about:blank"; probeFrameEl.remove(); }
}

async function resetLoadingScreen() {
    const oldLoadingFrame = loadingScreen.querySelector("iframe");

    if (oldLoadingFrame) {
        oldLoadingFrame.remove();
    }

    const newLoadingFrame = document.createElement("iframe");
    newLoadingFrame.src = "./loading.html";
    loadingScreen.appendChild(newLoadingFrame);

    await new Promise(resolve => {
        newLoadingFrame.onload = resolve;
        setTimeout(resolve, 100);
    });
}

function createToolFrame() {
    if (frame) {
        frame.onload = null;
        frame.src = "about:blank";
        frame.remove();
    }

    const newFrame = document.createElement("iframe");

    newFrame.id = "toolFrame";
    newFrame.allow = "camera; microphone; display-capture; autoplay; " +
        "clipboard-read; clipboard-write; web-share; " +
        "xr-spatial-tracking; gamepad; geolocation; accelerometer; " +
        "ambient-light-sensor; battery; bluetooth; browsing-topics; " +
        "compute-pressure; document-domain; encrypted-media; " +
        "execution-while-not-rendered; execution-while-out-of-viewport; " +
        "fullscreen; gyroscope; hid; identity-credentials-get; " +
        "idle-detection; keyboard-map; local-fonts; magnetometer; " +
        "midi; otp-credentials; payment; picture-in-picture; " +
        "publickey-credentials-create; publickey-credentials-get; " +
        "screen-wake-lock; serial; speaker-selection; storage-access; " +
        "usb; window-management";
    newFrame.allowFullscreen = true;
    newFrame.setAttribute("credentialless", "");
    newFrame.style.width = "100%";
    newFrame.style.height = "100%";
    newFrame.style.border = "none";
    newFrame.style.display = "none";

    overlay.appendChild(newFrame);

    frame = newFrame;

    return newFrame;
}

async function openTool(url) {
    const token = ++loadToken;

    overlay.style.display = "flex";

    frame = createToolFrame();

    frame.style.display = "none";

    loadingScreen.style.opacity = "1";
    loadingScreen.style.display = "flex";

    await resetLoadingScreen();

    if (token !== loadToken) {
        return;
    }

    frame.onload = () => {
        if (token !== loadToken) {
            return;
        }

        loadingScreen.style.opacity = "0";

        setTimeout(() => {
            if (token === loadToken) {
                loadingScreen.style.display = "none";
            }
        }, 500);

        frame.style.display = "block";
    };

    if (url === "./homeworkhelper.html") {
        frame.src = url;
    } else {
        frame.src = _p + encodeURIComponent(url);
    }
}

function closeTool() {
    ++loadToken;

    overlay.style.display = "none";

    if (frame) {
        frame.onload = null;
        frame.src = "about:blank";
        frame.remove();
    }

    frame = null;

    loadingScreen.style.opacity = "1";
    loadingScreen.style.display = "flex";

    resetLoadingScreen();
}

document.getElementById("searchInput").addEventListener("input", e => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderGrid();
});

let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let hasDragged = false;

closeOverlayBtn.addEventListener("pointerdown", e => {
    isDragging = true;
    hasDragged = false;

    closeOverlayBtn.setPointerCapture(e.pointerId);
    closeOverlayBtn.classList.add("dragging");

    dragOffsetX = e.clientX - closeOverlayBtn.offsetLeft;
    dragOffsetY = e.clientY - closeOverlayBtn.offsetTop;
});

closeOverlayBtn.addEventListener("pointermove", e => {
    if (!isDragging) return;

    hasDragged = true;
    e.preventDefault();

    let newX = e.clientX - dragOffsetX;
    let newY = e.clientY - dragOffsetY;

    const maxX = overlay.clientWidth - closeOverlayBtn.offsetWidth;
    const maxY = overlay.clientHeight - closeOverlayBtn.offsetHeight;

    newX = Math.max(0, Math.min(newX, maxX));
    newY = Math.max(0, Math.min(newY, maxY));

    closeOverlayBtn.style.left = newX + "px";
    closeOverlayBtn.style.top = newY + "px";
});

closeOverlayBtn.addEventListener("pointerup", () => {
    isDragging = false;
    closeOverlayBtn.classList.remove("dragging");
});

closeOverlayBtn.addEventListener("pointercancel", () => {
    isDragging = false;
    closeOverlayBtn.classList.remove("dragging");
});

closeOverlayBtn.addEventListener("click", e => {
    if (hasDragged) {
        hasDragged = false;
        e.stopPropagation();
        return;
    }

    closeTool();
});

overlay.addEventListener("click", e => {
    if (e.target === overlay) {
        closeTool();
    }
});

function renderGrid() {
    const apps = [
        { name: "YouTube", icon: "../images/youtube.webp", url: "https://youtube.com" },
        { name: "TikTok", icon: "../images/tiktok.jpg", url: "https://tiktok.com" },
        { name: "SoundCloud", icon: "../images/sndcld.png", url: "https://soundcloud.com" },
        { name: "CornHub", icon: "../images/cornhub.png", url: "https://cornhub.website" },
        { name: "NebulaGPT", icon: "../images/chatgpt.png", url: "./homeworkhelper.html" },
        { name: "Blooket Bot", icon: "../images/blooketbot.png", url: "https://blooketbot.schoolcheats.net" },
        { name: "Twitch", icon: "../images/twitch.png", url: "https://twitch.tv" },
        { name: "Snapchat", icon: "../images/snap.jpg", url: "https://snapchat.com" },
        { name: "SpenFlix (Movies)", icon: "../images/movies.svg", url: "https://watch.spencerdevs.xyz" },
        { name: "Archive Of Our Own", icon: "../images/ao3.png", url: "https://archiveofourown.org" },
        { name: "Webtoons", icon: "../images/webtoon.png", url: "https://webtoons.com/en" },
        { name: "Visual Studio Code", icon: "../images/vsc.png", url: "https://vscode.dev" },
    ];

    const filtered = apps.filter(app =>
        app.name.toLowerCase().includes(searchQuery)
    );

    document.getElementById("toolCount").textContent =
        filtered.length + " App" + (filtered.length !== 1 ? "s" : "");

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <p>No apps found matching "${searchQuery}"</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = "";

    filtered.forEach((tool, i) => {
        const card = document.createElement("div");

        card.className = "tool-card";
        card.style.animationDelay = `${i * 0.04}s`;
        card.onclick = () => openTool(tool.url);

        card.innerHTML = `
            <div class="tool-icon">
                <img src="${tool.icon}" alt="${tool.name}" loading="lazy">
            </div>
            <div class="overlay-gradient"></div>
            <div class="tool-name">${tool.name}</div>
        `;

        grid.appendChild(card);
    });
}

P_FETCH();
renderGrid();
</script>

</body>
</html>
