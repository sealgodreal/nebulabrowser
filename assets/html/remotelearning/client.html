<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
    --bg:#08090b;
    --panel:#14161a;
    --panel2:#1b1e23;
    --border:#292d33;
    --text:#eeeeee;
    --muted:#858b94;
    --accent:#a78bfa;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body {
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    background:#000;
    color:var(--text);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body {
    touch-action:none;
}

button,input {
    font-family:inherit;
}

#app {
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    background:#000;
    overflow:hidden;
}

#screenContainer {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

#screen {
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
}

#waiting {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:#555b63;
    font-family:monospace;
    font-size:12px;
    pointer-events:none;
}

.waiting-icon {
    font-size:32px;
    color:#3b4048;
}

#menuButton {
    position:fixed;
    top:calc(12px + env(safe-area-inset-top));
    left:calc(12px + env(safe-area-inset-left));
    width:44px;
    height:44px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    background:rgba(15,17,20,.78);
    backdrop-filter:blur(12px);
    color:white;
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:100;
}

#menuButton:active {
    transform:scale(.92);
}

#connection {
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:20px;
    background:rgba(15,17,20,.65);
    backdrop-filter:blur(10px);
    color:#aaa;
    font-family:monospace;
    font-size:9px;
    z-index:100;
}

#connectionDot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:#e05252;
}

#connectionDot.connected {
    background:#55c98a;
    box-shadow:0 0 8px rgba(85,201,138,.6);
}

#drawer {
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:190px;
    padding:18px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
    background:linear-gradient(to bottom,rgba(20,22,26,.96),rgba(13,15,18,.99));
    border-top:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    z-index:200;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.22,1,.36,1);
}

#drawer.open {
    transform:translateY(0);
}

.drawer-handle {
    width:38px;
    height:4px;
    border-radius:4px;
    background:#454a52;
    margin:0 auto 18px auto;
}

.drawer-title {
    color:#777d86;
    font-size:10px;
    font-family:monospace;
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-bottom:12px;
}

.drawer-buttons {
    display:flex;
    gap:10px;
}

.drawer-button {
    height:58px;
    min-width:120px;
    flex:0 0 auto;
    padding:0 18px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--panel2);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:12px;
    cursor:pointer;
}

.drawer-button:active {
    transform:scale(.97);
    background:#252931;
}

.drawer-icon {
    font-size:20px;
}

#popupBackdrop {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s;
    z-index:350;
}

#popupBackdrop.open {
    opacity:1;
    pointer-events:auto;
}

#monitorPopup {
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.94);
    width:min(420px,calc(100vw - 30px));
    max-height:70vh;
    overflow-y:auto;
    padding:16px;
    background:#15171b;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s,transform .18s;
    z-index:400;
}

#monitorPopup.open {
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
}

.popup-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.popup-title {
    font-size:14px;
    font-weight:600;
}

.popup-close {
    width:32px;
    height:32px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel2);
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
}

.monitor-list {
    display:flex;
    flex-direction:column;
    gap:7px;
}

.monitor-item {
    width:100%;
    min-height:52px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel2);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
}

.monitor-item:active {
    transform:scale(.99);
}

.monitor-item.active {
    border-color:#5f4a91;
    background:rgba(167,139,250,.09);
    color:var(--accent);
}

.monitor-name {
    font-size:12px;
}

.monitor-resolution {
    font-family:monospace;
    font-size:9px;
    color:#646a73;
}

#hiddenKeyboardInput {
    position:fixed;
    left:50%;
    bottom:2px;
    width:2px;
    height:2px;
    padding:0;
    margin:0;
    border:0;
    outline:none;
    background:transparent;
    color:transparent;
    caret-color:transparent;
    opacity:.01;
    font-size:16px;
    z-index:-1;
    pointer-events:none;
    -webkit-user-select:none;
    user-select:none;
}

#touchIndicator {
    position:fixed;
    width:38px;
    height:38px;
    border:2px solid rgba(167,139,250,.8);
    border-radius:50%;
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
    z-index:600;
}

#touchIndicator.show {
    animation:touchPulse .35s ease-out;
}

@keyframes touchPulse {
    from {
        opacity:.85;
        transform:translate(-50%,-50%) scale(.5);
    }
    to {
        opacity:0;
        transform:translate(-50%,-50%) scale(1.4);
    }
}

#toast {
    position:fixed;
    left:50%;
    bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%,15px);
    padding:9px 13px;
    border:1px solid var(--border);
    border-radius:6px;
    background:#17191d;
    color:#a4a9b0;
    font-family:monospace;
    font-size:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s,transform .2s;
    z-index:700;
}

#toast.show {
    opacity:1;
    transform:translate(-50%,0);
}

@media (max-width:900px) and (orientation:landscape) {
    #drawer {
        height:150px;
        padding-top:11px;
    }

    .drawer-handle {
        margin-bottom:10px;
    }

    .drawer-title {
        margin-bottom:7px;
    }

    .drawer-button {
        height:48px;
        min-width:110px;
    }
}

#orientationWarning {
    display:none;
    position:fixed;
    inset:0;
    background:#08090b;
    z-index:1000;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    text-align:center;
    padding:30px;
}

.orientationIcon {
    font-size:45px;
}

.orientationTitle {
    font-size:17px;
    font-weight:600;
}

.orientationText {
    color:#737982;
    font-size:11px;
    font-family:monospace;
}

@media (max-width:700px) and (orientation:portrait) {
    #orientationWarning {
        display:flex;
    }
}

#loginOverlay {
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#08090b;
}

#loginPanel {
    width:min(420px,100%);
    padding:28px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    box-shadow:0 20px 70px rgba(0,0,0,.45);
}

#loginTitle {
    margin:0 0 8px;
    font-size:24px;
}

#loginSubtitle {
    margin:0 0 22px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.loginField {
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:7px;
    outline:none;
    background:#0d0f12;
    color:var(--text);
}

.loginButton {
    width:100%;
    height:44px;
    margin-top:10px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel2);
    color:var(--text);
    cursor:pointer;
}

.loginButton.primary {
    background:#24202f;
    border-color:#5f4a91;
}

#loginStatus {
    min-height:18px;
    margin-top:14px;
    color:var(--muted);
    font-family:monospace;
    font-size:10px;
    white-space:pre-wrap;
}

#loginBack {
    display:none;
}
</style>
</head>

<body>

<div id="loginOverlay">
    <div id="loginPanel">
        <h1 id="loginTitle">Nebula Connect</h1>

        <p id="loginSubtitle">
            Nebula Connect allows you to stream content from one device and connect to it remotely from another device.
        </p>

        <div id="loginChoice">
            <button
                class="loginButton primary"
                id="createConnectionButton"
            >
                Create Connection
            </button>

            <button
                class="loginButton"
                id="connectConnectionButton"
            >
                Connect
            </button>
        </div>

        <div id="loginForm" style="display:none;">
            <input
                id="loginToken"
                class="loginField"
                type="text"
                autocomplete="off"
                placeholder="Connection token"
            >

            <button
                class="loginButton primary"
                id="loginSubmit"
            >
                Continue
            </button>

            <button
                class="loginButton"
                id="loginBack"
            >
                Back
            </button>
        </div>

        <div id="loginStatus"></div>
    </div>
</div>

<div id="app">
    <div id="screenContainer">
        <img
            id="screen"
            draggable="false"
            alt="Remote computer screen"
        >

        <div id="waiting">
            <div class="waiting-icon">◫</div>
            Waiting for screen...
        </div>
    </div>

    <button id="menuButton">☰</button>

    <div id="connection">
        <div id="connectionDot"></div>

        <span id="connectionText">
            connecting
        </span>
    </div>

    <div id="drawer">
        <div class="drawer-handle"></div>

        <div class="drawer-title">
            Remote controls
        </div>

        <div class="drawer-buttons">
            <button
                class="drawer-button"
                id="monitorsButton"
            >
                <span class="drawer-icon">▣</span>
                <span>Monitors</span>
            </button>

            <button
                class="drawer-button"
                id="keyboardButton"
            >
                <span class="drawer-icon">⌨</span>
                <span>Keyboard</span>
            </button>
        </div>
    </div>

    <div id="popupBackdrop"></div>

    <div id="monitorPopup">
        <div class="popup-header">
            <div class="popup-title">
                Monitors
            </div>

            <button
                class="popup-close"
                id="monitorClose"
            >
                ×
            </button>
        </div>

        <div
            class="monitor-list"
            id="monitorList"
        ></div>
    </div>

    <input
        id="hiddenKeyboardInput"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        inputmode="text"
        enterkeyhint="done"
        aria-label="Remote keyboard"
    >

    <div id="touchIndicator"></div>

    <div id="toast"></div>
</div>

<div id="orientationWarning">
    <div class="orientationIcon">↻</div>

    <div class="orientationTitle">
        Rotate your device
    </div>

    <div class="orientationText">
        Landscape mode gives you the best remote desktop experience.
    </div>
</div>

<script>
const SERVER_URL = "https://nebula-remote-streaming-backend.onrender.com";

let verificationToken = null;

const urlParams =
    new URLSearchParams(window.location.search);

verificationToken =
    urlParams.get("token");

if (
    !verificationToken &&
    window.location.search.startsWith("?=")
) {
    verificationToken =
        decodeURIComponent(
            window.location.search.slice(2)
        );
}

const loginOverlay =
    document.getElementById("loginOverlay");

const loginChoice =
    document.getElementById("loginChoice");

const loginForm =
    document.getElementById("loginForm");

const loginToken =
    document.getElementById("loginToken");

const loginStatus =
    document.getElementById("loginStatus");

const createConnectionButton =
    document.getElementById("createConnectionButton");

const connectConnectionButton =
    document.getElementById("connectConnectionButton");

const loginSubmit =
    document.getElementById("loginSubmit");

const loginBack =
    document.getElementById("loginBack");

function hideLogin() {
    loginOverlay.style.display = "none";
}

function showTokenForm(mode) {
    loginChoice.style.display = "none";
    loginForm.style.display = "block";
    loginBack.style.display = "block";
    loginStatus.textContent = "";

    loginSubmit.textContent =
        mode === "connect"
            ? "Connect"
            : "Continue";

    loginSubmit.onclick =
        connectToExisting;

    setTimeout(function() {
        loginToken.focus();
    },50);
}

function showLoginChoice() {
    loginChoice.style.display = "block";
    loginForm.style.display = "none";
    loginBack.style.display = "none";
    loginStatus.textContent = "";
}

function downloadCreateRemote() {
    alert("Please extract the .zip file, then run \"Launcher.cmd\" and make sure you have Python installed.")
    const link =
        document.createElement("a");

    link.href = "./remote.zip";
    link.download = "remote.zip";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

createConnectionButton.addEventListener(
    "click",
    downloadCreateRemote
);

connectConnectionButton.addEventListener(
    "click",
    function() {
        showTokenForm("connect");
    }
);

loginBack.addEventListener(
    "click",
    showLoginChoice
);

loginToken.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            loginSubmit.click();
        }
    }
);

async function connectToExisting() {
    const value =
        loginToken.value.trim();

    if (!value) {
        loginStatus.textContent =
            "Enter a token.";
        return;
    }

    verificationToken = value;

    loginStatus.textContent =
        "Checking connection...";

    try {
        await connect();
    } catch (error) {
        console.error(
            "Connection error:",
            error
        );

        loginStatus.textContent =
            "Connection failed:\n" +
            error.message;
    }
}

const screen =
    document.getElementById("screen");

const waiting =
    document.getElementById("waiting");

const menuButton =
    document.getElementById("menuButton");

const drawer =
    document.getElementById("drawer");

const connectionDot =
    document.getElementById("connectionDot");

const connectionText =
    document.getElementById("connectionText");

const monitorsButton =
    document.getElementById("monitorsButton");

const keyboardButton =
    document.getElementById("keyboardButton");

const monitorPopup =
    document.getElementById("monitorPopup");

const monitorList =
    document.getElementById("monitorList");

const monitorClose =
    document.getElementById("monitorClose");

const popupBackdrop =
    document.getElementById("popupBackdrop");

const hiddenKeyboardInput =
    document.getElementById("hiddenKeyboardInput");

const touchIndicator =
    document.getElementById("touchIndicator");

const toast =
    document.getElementById("toast");

let socket = null;
let monitors = [];
let selectedMonitor = null;
let screenWidth = 1920;
let screenHeight = 1080;
let pointerDown = false;
let holdTimer = null;
let holdStarted = false;
let lastTapTime = 0;
let lastTapPosition = null;
let toastTimer = null;
let reconnectTimer = null;
let manuallyDisconnected = false;
let keyboardMode = false;

function isMobileDevice() {
    return (
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0 ||
        /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        )
    );
}

async function requestLandscape() {
    try {
        if (
            screen.orientation &&
            screen.orientation.lock
        ) {
            await screen.orientation.lock(
                "landscape"
            );
        }
    } catch (error) {}
}

document.addEventListener(
    "click",
    function() {
        requestLandscape();
    },
    { once:true }
);

menuButton.addEventListener(
    "click",
    function(event) {
        event.stopPropagation();

        drawer.classList.toggle(
            "open"
        );
    }
);

function connect() {
    return new Promise(
        function(resolve,reject) {
            if (!verificationToken) {
                connectionText.textContent =
                    "missing token";

                reject(
                    new Error(
                        "No connection token."
                    )
                );

                return;
            }

            if (
                socket &&
                (
                    socket.readyState ===
                    WebSocket.OPEN ||
                    socket.readyState ===
                    WebSocket.CONNECTING
                )
            ) {
                resolve();
                return;
            }

            if (reconnectTimer) {
                clearTimeout(
                    reconnectTimer
                );

                reconnectTimer = null;
            }

            connectionText.textContent =
                "connecting";

            connectionDot.classList.remove(
                "connected"
            );

            const websocketURL =
                SERVER_URL
                    .replace(
                        /^http:/,
                        "ws:"
                    )
                    .replace(
                        /^https:/,
                        "wss:"
                    ) +
                "/connection/?=" +
                encodeURIComponent(
                    verificationToken
                ) +
                "&role=client";

            let settled = false;

            const failTimer =
                setTimeout(
                    function() {
                        if (!settled) {
                            settled = true;

                            try {
                                socket.close();
                            } catch (error) {}

                            reject(
                                new Error(
                                    "Server connection timed out."
                                )
                            );
                        }
                    },
                    8000
                );

            socket =
                new WebSocket(
                    websocketURL
                );

            socket.binaryType = "blob";

            socket.onopen =
                function() {
                    clearTimeout(
                        failTimer
                    );

                    settled = true;

                    connectionDot.classList.add(
                        "connected"
                    );

                    connectionText.textContent =
                        "connected";

                    loginStatus.textContent =
                        "";

                    hideLogin();

                    resolve();
                };

            socket.onclose =
                function(event) {
                    connectionDot.classList.remove(
                        "connected"
                    );

                    connectionText.textContent =
                        "disconnected";

                    if (!settled) {
                        clearTimeout(
                            failTimer
                        );

                        settled = true;

                        reject(
                            new Error(
                                "Could not connect to the remote computer."
                            )
                        );

                        return;
                    }

                    if (
                        !manuallyDisconnected
                    ) {
                        connectionText.textContent =
                            "reconnecting";

                        reconnectTimer =
                            setTimeout(
                                function() {
                                    connect().catch(
                                        function() {}
                                    );
                                },
                                1500
                            );
                    }
                };

            socket.onerror =
                function(error) {
                    console.error(
                        "WebSocket error:",
                        error
                    );

                    connectionDot.classList.remove(
                        "connected"
                    );

                    connectionText.textContent =
                        "connection error";

                    if (!settled) {
                        clearTimeout(
                            failTimer
                        );

                        settled = true;

                        reject(
                            new Error(
                                "WebSocket connection failed."
                            )
                        );
                    }
                };

            socket.onmessage =
                function(event) {
                    if (
                        typeof event.data ===
                        "string"
                    ) {
                        try {
                            const message =
                                JSON.parse(
                                    event.data
                                );

                            if (
                                message.type ===
                                "monitors"
                            ) {
                                monitors =
                                    Array.isArray(
                                        message.monitors
                                    )
                                        ? message.monitors
                                        : [];

                                if (
                                    selectedMonitor ===
                                    null &&
                                    monitors.length > 0
                                ) {
                                    const primary =
                                        monitors.find(
                                            function(monitor) {
                                                return (
                                                    monitor.primary === true ||
                                                    monitor.main === true ||
                                                    Number(
                                                        monitor.id
                                                    ) === 1
                                                );
                                            }
                                        );

                                    selectedMonitor =
                                        primary
                                            ? primary.id
                                            : monitors[0].id;
                                }

                                if (
                                    monitors.length > 0 &&
                                    !monitors.some(
                                        function(monitor) {
                                            return String(
                                                monitor.id
                                            ) === String(
                                                selectedMonitor
                                            );
                                        }
                                    )
                                ) {
                                    selectedMonitor =
                                        monitors[0].id;
                                }

                                renderMonitors();
                            } else if (
                                message.type ===
                                "size"
                            ) {
                                screenWidth =
                                    Number(
                                        message.width
                                    ) || 1920;

                                screenHeight =
                                    Number(
                                        message.height
                                    ) || 1080;

                                waiting.style.display =
                                    "none";
                            } else if (
                                message.type ===
                                "error"
                            ) {
                                showToast(
                                    message.message ||
                                    "Server error"
                                );
                            }
                        } catch (error) {
                            console.error(
                                "Message parse error:",
                                error
                            );
                        }

                        return;
                    }

                    waiting.style.display =
                        "none";

                    const imageURL =
                        URL.createObjectURL(
                            event.data
                        );

                    screen.onload =
                        function() {
                            URL.revokeObjectURL(
                                imageURL
                            );
                        };

                    screen.src =
                        imageURL;
                };
        }
    );
}

function send(message) {
    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {
        try {
            socket.send(
                JSON.stringify(
                    message
                )
            );

            return true;
        } catch (error) {
            console.error(
                "Send error:",
                error
            );
        }
    }

    return false;
}

function renderMonitors() {
    monitorList.innerHTML = "";

    if (monitors.length === 0) {
        const empty =
            document.createElement(
                "div"
            );

        empty.style.color = "#666";
        empty.style.fontSize = "11px";
        empty.textContent =
            "No monitors detected.";

        monitorList.appendChild(
            empty
        );

        return;
    }

    monitors.forEach(
        function(monitor) {
            const item =
                document.createElement(
                    "button"
                );

            item.type = "button";
            item.className =
                "monitor-item";

            if (
                String(
                    monitor.id
                ) ===
                String(
                    selectedMonitor
                )
            ) {
                item.classList.add(
                    "active"
                );
            }

            const name =
                monitor.name ||
                (
                    Number(
                        monitor.id
                    ) === 1
                        ? "Main display"
                        : "Display " +
                          monitor.id
                );

            const width =
                Number(
                    monitor.width
                ) || 0;

            const height =
                Number(
                    monitor.height
                ) || 0;

            const nameElement =
                document.createElement(
                    "span"
                );

            nameElement.className =
                "monitor-name";

            nameElement.textContent =
                name;

            const resolutionElement =
                document.createElement(
                    "span"
                );

            resolutionElement.className =
                "monitor-resolution";

            resolutionElement.textContent =
                width +
                " × " +
                height;

            item.appendChild(
                nameElement
            );

            item.appendChild(
                resolutionElement
            );

            item.addEventListener(
                "click",
                function(event) {
                    event.preventDefault();
                    event.stopPropagation();

                    selectMonitor(
                        monitor.id
                    );
                }
            );

            monitorList.appendChild(
                item
            );
        }
    );
}

function selectMonitor(id) {
    if (
        id === undefined ||
        id === null
    ) {
        return;
    }

    selectedMonitor = id;

    const sent =
        send({
            type:"select_monitor",
            monitor:id
        });

    renderMonitors();

    if (!sent) {
        showToast(
            "Not connected"
        );

        return;
    }

    closeMonitorPopup();

    drawer.classList.remove(
        "open"
    );

    const selected =
        monitors.find(
            function(monitor) {
                return String(
                    monitor.id
                ) === String(
                    id
                );
            }
        );

    showToast(
        selected
            ? (
                selected.name ||
                (
                    Number(id) === 1
                        ? "Main display"
                        : "Display " + id
                )
            ) + " selected"
            : "Display " + id + " selected"
    );
}

monitorsButton.addEventListener(
    "click",
    function(event) {
        event.preventDefault();
        event.stopPropagation();

        drawer.classList.remove(
            "open"
        );

        monitorPopup.classList.add(
            "open"
        );

        popupBackdrop.classList.add(
            "open"
        );

        if (
            !send({
                type:"send_monitors"
            })
        ) {
            renderMonitors();
        }
    }
);

function closeMonitorPopup() {
    monitorPopup.classList.remove(
        "open"
    );

    popupBackdrop.classList.remove(
        "open"
    );
}

monitorClose.addEventListener(
    "click",
    function(event) {
        event.preventDefault();
        closeMonitorPopup();
    }
);

popupBackdrop.addEventListener(
    "click",
    function(event) {
        if (
            event.target ===
            popupBackdrop
        ) {
            closeMonitorPopup();
        }
    }
);

function getCoordinates(event) {
    const rect =
        screen.getBoundingClientRect();

    const imageRatio =
        screenWidth /
        screenHeight;

    const rectRatio =
        rect.width /
        rect.height;

    let displayedWidth;
    let displayedHeight;

    if (
        rectRatio >
        imageRatio
    ) {
        displayedHeight =
            rect.height;

        displayedWidth =
            displayedHeight *
            imageRatio;
    } else {
        displayedWidth =
            rect.width;

        displayedHeight =
            displayedWidth /
            imageRatio;
    }

    const offsetX =
        rect.left +
        (
            rect.width -
            displayedWidth
        ) / 2;

    const offsetY =
        rect.top +
        (
            rect.height -
            displayedHeight
        ) / 2;

    let x =
        (
            event.clientX -
            offsetX
        ) *
        screenWidth /
        displayedWidth;

    let y =
        (
            event.clientY -
            offsetY
        ) *
        screenHeight /
        displayedHeight;

    x =
        Math.max(
            0,
            Math.min(
                screenWidth - 1,
                x
            )
        );

    y =
        Math.max(
            0,
            Math.min(
                screenHeight - 1,
                y
            )
        );

    return {
        x:Math.round(x),
        y:Math.round(y)
    };
}

function showTouch(event) {
    touchIndicator.style.left =
        event.clientX + "px";

    touchIndicator.style.top =
        event.clientY + "px";

    touchIndicator.classList.remove(
        "show"
    );

    void touchIndicator.offsetWidth;

    touchIndicator.classList.add(
        "show"
    );
}

screen.addEventListener(
    "pointerdown",
    function(event) {
        event.preventDefault();

        if (
            drawer.classList.contains(
                "open"
            )
        ) {
            drawer.classList.remove(
                "open"
            );
        }

        pointerDown = true;
        holdStarted = false;

        try {
            screen.setPointerCapture(
                event.pointerId
            );
        } catch (error) {}

        showTouch(event);

        const position =
            getCoordinates(
                event
            );

        const now =
            performance.now();

        const isDoubleTap =
            (
                now -
                lastTapTime
            ) < 350;

        const isSamePosition =
            lastTapPosition &&
            Math.abs(
                lastTapPosition.x -
                event.clientX
            ) < 40 &&
            Math.abs(
                lastTapPosition.y -
                event.clientY
            ) < 40;

        if (
            isDoubleTap &&
            isSamePosition
        ) {
            clearTimeout(
                holdTimer
            );

            send({
                type:"mouse_click",
                button:"right",
                x:position.x,
                y:position.y
            });

            lastTapTime = 0;
            lastTapPosition = null;

            return;
        }

        lastTapTime = now;

        lastTapPosition = {
            x:event.clientX,
            y:event.clientY
        };

        holdTimer =
            setTimeout(
                function() {
                    if (!pointerDown) {
                        return;
                    }

                    holdStarted = true;

                    send({
                        type:"mouse_down",
                        button:"left",
                        x:position.x,
                        y:position.y
                    });
                },
                450
            );
    }
);

screen.addEventListener(
    "pointermove",
    function(event) {
        if (
            !pointerDown ||
            !holdStarted
        ) {
            return;
        }

        event.preventDefault();

        const position =
            getCoordinates(
                event
            );

        send({
            type:"mouse_move",
            x:position.x,
            y:position.y
        });
    }
);

screen.addEventListener(
    "pointerup",
    function(event) {
        event.preventDefault();

        pointerDown = false;

        clearTimeout(
            holdTimer
        );

        const position =
            getCoordinates(
                event
            );

        if (holdStarted) {
            send({
                type:"mouse_up",
                button:"left",
                x:position.x,
                y:position.y
            });

            holdStarted = false;

            return;
        }

        send({
            type:"mouse_click",
            button:"left",
            x:position.x,
            y:position.y
        });
    }
);

screen.addEventListener(
    "pointercancel",
    function() {
        pointerDown = false;

        clearTimeout(
            holdTimer
        );

        if (holdStarted) {
            send({
                type:"mouse_up",
                button:"left"
            });

            holdStarted = false;
        }
    }
);

screen.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);

function activateKeyboard() {
    keyboardMode = true;

    drawer.classList.remove(
        "open"
    );

    if (
        isMobileDevice()
    ) {
        hiddenKeyboardInput.value =
            "";

        hiddenKeyboardInput.focus();

        setTimeout(
            function() {
                if (
                    keyboardMode &&
                    document.activeElement !==
                    hiddenKeyboardInput
                ) {
                    hiddenKeyboardInput.focus();
                }
            },
            50
        );

        showToast(
            "Keyboard active"
        );

        return;
    }

    showToast(
        "keyboard active"
    );
}

keyboardButton.addEventListener(
    "click",
    function(event) {
        event.preventDefault();
        event.stopPropagation();

        activateKeyboard();
    }
);

document.addEventListener(
    "keydown",
    function(event) {
        if (
            !keyboardMode ||
            isMobileDevice()
        ) {
            return;
        }

        if (
            event.ctrlKey ||
            event.metaKey
        ) {
            return;
        }

        event.preventDefault();

        send({
            type:"key_down",
            key:event.key,
            code:event.code
        });
    }
);

document.addEventListener(
    "keyup",
    function(event) {
        if (
            !keyboardMode ||
            isMobileDevice()
        ) {
            return;
        }

        if (
            event.ctrlKey ||
            event.metaKey
        ) {
            return;
        }

        event.preventDefault();

        send({
            type:"key_up",
            key:event.key,
            code:event.code
        });
    }
);

hiddenKeyboardInput.addEventListener(
    "keydown",
    function(event) {
        if (!keyboardMode) {
            return;
        }

        event.stopPropagation();
        event.preventDefault();

        send({
            type:"key_down",
            key:event.key,
            code:event.code
        });
    }
);

hiddenKeyboardInput.addEventListener(
    "keyup",
    function(event) {
        if (!keyboardMode) {
            return;
        }

        event.stopPropagation();
        event.preventDefault();

        send({
            type:"key_up",
            key:event.key,
            code:event.code
        });
    }
);

hiddenKeyboardInput.addEventListener(
    "beforeinput",
    function(event) {
        if (!keyboardMode) {
            return;
        }

        if (
            event.inputType ===
            "insertText" &&
            event.data
        ) {
            event.preventDefault();
        }
    }
);

hiddenKeyboardInput.addEventListener(
    "input",
    function() {
        hiddenKeyboardInput.value =
            "";
    }
);

document.addEventListener(
    "keydown",
    function(event) {
        if (
            keyboardMode &&
            !isMobileDevice() &&
            event.key === "Escape"
        ) {
            keyboardMode = false;

            showToast(
                "Keyboard inactive"
            );
        }
    }
);

function showToast(message) {
    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function() {
                toast.classList.remove(
                    "show"
                );
            },
            1600
        );
}

if (verificationToken) {
    hideLogin();

    connect().catch(
        function(error) {
            console.error(
                error
            );

            loginOverlay.style.display =
                "flex";

            loginStatus.textContent =
                "Connection failed:\n" +
                error.message;
        }
    );
} else {
    showLoginChoice();
}
</script>
