<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
    --bg:#08090b;
    --panel:#14161a;
    --panel2:#1b1e23;
    --border:#292d33;
    --text:#eeeeee;
    --muted:#858b94;
    --accent:#a78bfa;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body {
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    background:#000;
    color:var(--text);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body {
    touch-action:none;
}

button,input {
    font-family:inherit;
}

#app {
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    background:#000;
    overflow:hidden;
}

#screenContainer {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

#screen {
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
}

#waiting {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:#555b63;
    font-family:monospace;
    font-size:12px;
    pointer-events:none;
}

.waiting-icon {
    font-size:32px;
    color:#3b4048;
}

#menuButton {
    position:fixed;
    top:calc(12px + env(safe-area-inset-top));
    left:calc(12px + env(safe-area-inset-left));
    width:44px;
    height:44px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    background:rgba(15,17,20,.78);
    backdrop-filter:blur(12px);
    color:white;
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:100;
}

#menuButton:active {
    transform:scale(.92);
}

#connection {
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:20px;
    background:rgba(15,17,20,.65);
    backdrop-filter:blur(10px);
    color:#aaa;
    font-family:monospace;
    font-size:9px;
    z-index:100;
}

#connectionDot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:#e05252;
}

#connectionDot.connected {
    background:#55c98a;
    box-shadow:0 0 8px rgba(85,201,138,.6);
}

#drawer {
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:190px;
    padding:18px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
    background:linear-gradient(to bottom,rgba(20,22,26,.96),rgba(13,15,18,.99));
    border-top:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    z-index:200;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.22,1,.36,1);
}

#drawer.open {
    transform:translateY(0);
}

.drawer-handle {
    width:38px;
    height:4px;
    border-radius:4px;
    background:#454a52;
    margin:0 auto 18px auto;
}

.drawer-title {
    color:#777d86;
    font-size:10px;
    font-family:monospace;
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-bottom:12px;
}

.drawer-buttons {
    display:flex;
    gap:10px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

.drawer-button {
    height:58px;
    min-width:120px;
    flex:0 0 auto;
    padding:0 18px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--panel2);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:12px;
    cursor:pointer;
}

.drawer-button:active {
    transform:scale(.97);
    background:#252931;
}

.drawer-button.enabled {
    border-color:#5f4a91;
    background:rgba(167,139,250,.09);
    color:var(--accent);
}

#popupBackdrop {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s;
    z-index:350;
}

#popupBackdrop.open {
    opacity:1;
    pointer-events:auto;
}

#monitorPopup {
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.94);
    width:min(420px,calc(100vw - 30px));
    max-height:70vh;
    overflow-y:auto;
    padding:16px;
    background:#15171b;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s,transform .18s;
    z-index:400;
}

#monitorPopup.open {
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
}

.popup-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.popup-title {
    font-size:14px;
    font-weight:600;
}

.popup-close {
    width:32px;
    height:32px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel2);
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
}

.monitor-list {
    display:flex;
    flex-direction:column;
    gap:7px;
}

.monitor-item {
    width:100%;
    min-height:52px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel2);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
}

.monitor-item:active {
    transform:scale(.99);
}

.monitor-item.active {
    border-color:#5f4a91;
    background:rgba(167,139,250,.09);
    color:var(--accent);
}

.monitor-name {
    font-size:12px;
}

.monitor-resolution {
    font-family:monospace;
    font-size:9px;
    color:#646a73;
}

#hiddenKeyboardInput {
    position:fixed;
    left:50%;
    bottom:2px;
    width:2px;
    height:2px;
    padding:0;
    margin:0;
    border:0;
    outline:none;
    background:transparent;
    color:transparent;
    caret-color:transparent;
    opacity:.01;
    font-size:16px;
    z-index:-1;
    pointer-events:none;
    -webkit-user-select:none;
    user-select:none;
}

@keyframes touchPulse {
    from {
        opacity:.85;
        transform:translate(-50%,-50%) scale(.5);
    }

    to {
        opacity:0;
        transform:translate(-50%,-50%) scale(1.4);
    }
}

#gamepadJoystick {
    position:fixed;
    left:calc(26px + env(safe-area-inset-left));
    bottom:calc(26px + env(safe-area-inset-bottom));
    width:132px;
    height:132px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.09),rgba(18,20,24,.55) 65%);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 22px rgba(0,0,0,.4);
    backdrop-filter:blur(6px);
    z-index:150;
    display:none;
    touch-action:none;
}

#gamepadJoystick.active {
    display:block;
}

#gamepadJoystick::before {
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.06);
}

#gamepadKnob {
    position:absolute;
    left:50%;
    top:50%;
    width:56px;
    height:56px;
    margin:-28px 0 0 -28px;
    border-radius:50%;
    background:linear-gradient(160deg,#4a505a,#1d2024);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 5px 12px rgba(0,0,0,.55),inset 0 1px 2px rgba(255,255,255,.18);
    pointer-events:none;
    transition:box-shadow .15s;
    will-change:transform;
}

#gamepadJoystick.dragging #gamepadKnob {
    box-shadow:0 3px 8px rgba(0,0,0,.6),0 0 0 5px rgba(167,139,250,.22);
}

#jumpButton {
    position:fixed;
    right:calc(28px + env(safe-area-inset-right));
    bottom:calc(40px + env(safe-area-inset-bottom));
    width:76px;
    height:76px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.13),rgba(26,29,34,.68) 68%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.14);
    color:#e7e7e9;
    font-size:11px;
    font-weight:600;
    font-family:monospace;
    letter-spacing:.6px;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:150;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
}

#jumpButton.active {
    display:flex;
}

#jumpButton.pressed {
    transform:scale(.9);
    box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 0 5px rgba(167,139,250,.22);
    color:var(--accent);
}

#toast {
    position:fixed;
    left:50%;
    bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%,15px);
    padding:9px 13px;
    border:1px solid var(--border);
    border-radius:6px;
    background:#17191d;
    color:#a4a9b0;
    font-family:monospace;
    font-size:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s,transform .2s;
    z-index:700;
}

#toast.show {
    opacity:1;
    transform:translate(-50%,0);
}

@media (max-width:900px) and (orientation:landscape) {
    #drawer {
        height:150px;
        padding-top:11px;
    }

    .drawer-handle {
        margin-bottom:10px;
    }

    .drawer-title {
        margin-bottom:7px;
    }

    .drawer-button {
        height:48px;
        min-width:110px;
    }

    #gamepadJoystick {
        width:112px;
        height:112px;
    }

    #jumpButton {
        width:66px;
        height:66px;
    }
}

#orientationWarning {
    display:none;
    position:fixed;
    inset:0;
    background:#08090b;
    z-index:1000;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    text-align:center;
    padding:30px;
}

.orientationIcon {
    font-size:45px;
}

.orientationTitle {
    font-size:17px;
    font-weight:600;
}

.orientationText {
    color:#737982;
    font-size:11px;
    font-family:monospace;
}

@media (max-width:700px) and (orientation:portrait) {
    #orientationWarning {
        display:flex;
    }
}

#loginOverlay {
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#08090b;
}

#loginPanel {
    width:min(420px,100%);
    padding:28px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    box-shadow:0 20px 70px rgba(0,0,0,.45);
}

#loginTitle {
    margin:0 0 8px;
    font-size:24px;
}

#loginSubtitle {
    margin:0 0 22px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.loginField {
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:7px;
    outline:none;
    background:#0d0f12;
    color:var(--text);
}

.loginButton {
    width:100%;
    height:44px;
    margin-top:10px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel2);
    color:var(--text);
    cursor:pointer;
}

.loginButton.primary {
    background:#24202f;
    border-color:#5f4a91;
}

#loginStatus {
    min-height:18px;
    margin-top:14px;
    color:var(--muted);
    font-family:monospace;
    font-size:10px;
    white-space:pre-wrap;
}

#loginBack {
    display:none;
}
</style>
</head>

<body>

<div id="loginOverlay">
    <div id="loginPanel">
        <h1 id="loginTitle">Nebula Connect</h1>

        <p id="loginSubtitle">
            Nebula Connect allows you to stream content from one device and connect to it remotely from another device.
        </p>

        <div id="loginChoice">
            <button
                class="loginButton primary"
                id="createConnectionButton"
            >
                Create Connection
            </button>

            <button
                class="loginButton"
                id="connectConnectionButton"
            >
                Connect
            </button>
        </div>

        <div id="loginForm" style="display:none;">
            <input
                id="loginToken"
                class="loginField"
                type="text"
                autocomplete="off"
                placeholder="Connection token"
            >

            <button
                class="loginButton primary"
                id="loginSubmit"
            >
                Continue
            </button>

            <button
                class="loginButton"
                id="loginBack"
            >
                Back
            </button>
        </div>

        <div id="loginStatus"></div>
    </div>
</div>

<div id="app">

    <div id="screenContainer">

        <img
            id="screen"
            draggable="false"
            alt="Remote computer screen"
        >

        <div id="waiting">
            <div class="waiting-icon">◫</div>
            Waiting for screen...
        </div>

    </div>

    <button id="menuButton">☰</button>

    <div id="connection">
        <div id="connectionDot"></div>

        <span id="connectionText">
            connecting
        </span>
    </div>

    <div id="drawer">

        <div class="drawer-handle"></div>

        <div class="drawer-title">
            Remote controls
        </div>

        <div class="drawer-buttons">

            <button
                class="drawer-button"
                id="monitorsButton"
            >
                <span>Monitors</span>
            </button>

            <button
                class="drawer-button"
                id="keyboardButton"
            >
                <span>Keyboard</span>
            </button>

            <button
                class="drawer-button"
                id="gamepadButton"
            >
                <span>Gamepad</span>
            </button>

        </div>
    </div>

    <div id="popupBackdrop"></div>

    <div id="monitorPopup">

        <div class="popup-header">

            <div class="popup-title">
                Monitors
            </div>

            <button
                class="popup-close"
                id="monitorClose"
            >
                ×
            </button>

        </div>

        <div
            class="monitor-list"
            id="monitorList"
        ></div>

    </div>

    <input
        id="hiddenKeyboardInput"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        inputmode="text"
        enterkeyhint="done"
        aria-label="Remote keyboard"
    >

    <div id="gamepadJoystick">
        <div id="gamepadKnob"></div>
    </div>

    <button id="jumpButton">
        Jump
    </button>

    <div id="toast"></div>

</div>

<div id="orientationWarning">

    <div class="orientationIcon">
        ↻
    </div>

    <div class="orientationTitle">
        Rotate your device
    </div>

    <div class="orientationText">
        Landscape mode gives you the best remote desktop experience.
    </div>

</div>

<script>
const SERVER_URL =
    "https://nebula-remote-streaming-backend.onrender.com";

let verificationToken = null;

const urlParams =
    new URLSearchParams(
        window.location.search
    );

verificationToken =
    urlParams.get("token");

if (
    !verificationToken &&
    window.location.search.startsWith("?=")
) {
    verificationToken =
        decodeURIComponent(
            window.location.search.slice(2)
        );
}

const loginOverlay =
    document.getElementById(
        "loginOverlay"
    );

const loginChoice =
    document.getElementById(
        "loginChoice"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginToken =
    document.getElementById(
        "loginToken"
    );

const loginStatus =
    document.getElementById(
        "loginStatus"
    );

const createConnectionButton =
    document.getElementById(
        "createConnectionButton"
    );

const connectConnectionButton =
    document.getElementById(
        "connectConnectionButton"
    );

const loginSubmit =
    document.getElementById(
        "loginSubmit"
    );

const loginBack =
    document.getElementById(
        "loginBack"
    );

function hideLogin() {
    loginOverlay.style.display =
        "none";
}

function showTokenForm(mode) {
    loginChoice.style.display =
        "none";

    loginForm.style.display =
        "block";

    loginBack.style.display =
        "block";

    loginStatus.textContent =
        "";

    loginSubmit.textContent =
        mode === "connect"
            ? "Connect"
            : "Continue";

    loginSubmit.onclick =
        connectToExisting;

    setTimeout(
        function() {
            loginToken.focus();
        },
        50
    );
}

function showLoginChoice() {
    loginChoice.style.display =
        "block";

    loginForm.style.display =
        "none";

    loginBack.style.display =
        "none";

    loginStatus.textContent =
        "";
}

function downloadCreateRemote() {
    alert(
        "Please extract the .zip file, then run \"Launcher.cmd\" and make sure you have Python installed."
    );

    const link =
        document.createElement("a");

    link.href =
        "./remote.zip";

    link.download =
        "remote.zip";

    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );
}

createConnectionButton.addEventListener(
    "click",
    downloadCreateRemote
);

connectConnectionButton.addEventListener(
    "click",
    function() {
        showTokenForm(
            "connect"
        );
    }
);

loginBack.addEventListener(
    "click",
    showLoginChoice
);

loginToken.addEventListener(
    "keydown",
    function(event) {
        if (
            event.key === "Enter"
        ) {
            loginSubmit.click();
        }
    }
);

async function connectToExisting() {

    const value =
        loginToken.value.trim();

    if (!value) {

        loginStatus.textContent =
            "Enter a token.";

        return;
    }

    verificationToken =
        value;

    loginStatus.textContent =
        "Checking connection...";

    try {

        await connect();

    } catch (error) {

        console.error(
            "Connection error:",
            error
        );

        loginStatus.textContent =
            "Connection failed:\n" +
            error.message;
    }
}

const screen =
    document.getElementById(
        "screen"
    );

const waiting =
    document.getElementById(
        "waiting"
    );

const menuButton =
    document.getElementById(
        "menuButton"
    );

const drawer =
    document.getElementById(
        "drawer"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const monitorsButton =
    document.getElementById(
        "monitorsButton"
    );

const keyboardButton =
    document.getElementById(
        "keyboardButton"
    );

const gamepadButton =
    document.getElementById(
        "gamepadButton"
    );

const gamepadJoystick =
    document.getElementById(
        "gamepadJoystick"
    );

const gamepadKnob =
    document.getElementById(
        "gamepadKnob"
    );

const jumpButton =
    document.getElementById(
        "jumpButton"
    );

const monitorPopup =
    document.getElementById(
        "monitorPopup"
    );

const monitorList =
    document.getElementById(
        "monitorList"
    );

const monitorClose =
    document.getElementById(
        "monitorClose"
    );

const popupBackdrop =
    document.getElementById(
        "popupBackdrop"
    );

const hiddenKeyboardInput =
    document.getElementById(
        "hiddenKeyboardInput"
    );

const toast =
    document.getElementById(
        "toast"
    );

let socket = null;
let monitors = [];
let selectedMonitor = null;
let screenWidth = 1920;
let screenHeight = 1080;

let pointerDown = false;
let holdTimer = null;
let holdStarted = false;

let lastTapTime = 0;
let lastTapPosition = null;

let toastTimer = null;
let reconnectTimer = null;
let manuallyDisconnected = false;

let keyboardMode = false;

function isMobileDevice() {

    return (
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0 ||
        /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        )
    );
}

async function requestLandscape() {

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );
        }

    } catch (error) {}
}

document.addEventListener(
    "click",
    function() {
        requestLandscape();
    },
    {
        once:true
    }
);

menuButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        drawer.classList.toggle(
            "open"
        );
    }
);

function connect() {

    return new Promise(
        function(resolve, reject) {

            if (!verificationToken) {

                connectionText.textContent =
                    "missing token";

                reject(
                    new Error(
                        "No connection token."
                    )
                );

                return;
            }

            if (
                socket &&
                (
                    socket.readyState ===
                    WebSocket.OPEN ||
                    socket.readyState ===
                    WebSocket.CONNECTING
                )
            ) {

                resolve();

                return;
            }

            if (reconnectTimer) {

                clearTimeout(
                    reconnectTimer
                );

                reconnectTimer =
                    null;
            }

            if (
                !screenWidth ||
                !screenHeight
            ) {

                screenWidth =
                    1920;

                screenHeight =
                    1080;
            }

            waiting.style.display =
                "flex";

            connectionText.textContent =
                "connecting";

            connectionDot.classList.remove(
                "connected"
            );

            const websocketURL =
                SERVER_URL
                    .replace(
                        /^http:/,
                        "ws:"
                    )
                    .replace(
                        /^https:/,
                        "wss:"
                    ) +
                "/connection/?=" +
                encodeURIComponent(
                    verificationToken
                ) +
                "&role=client";

            let settled = false;

            const failTimer =
                setTimeout(
                    function() {

                        if (!settled) {

                            settled = true;

                            try {

                                socket.close();

                            } catch (error) {}

                            reject(
                                new Error(
                                    "Server connection timed out."
                                )
                            );
                        }

                    },
                    8000
                );

            socket =
                new WebSocket(
                    websocketURL
                );

            socket.binaryType =
                "blob";

            socket.onopen =
                function() {

                    clearTimeout(
                        failTimer
                    );

                    settled = true;

                    connectionDot.classList.add(
                        "connected"
                    );

                    connectionText.textContent =
                        "connected";

                    loginStatus.textContent =
                        "";

                    hideLogin();

                    resolve();
                };

            socket.onclose =
                function(event) {

                    connectionDot.classList.remove(
                        "connected"
                    );

                    connectionText.textContent =
                        "disconnected";

                    if (!settled) {

                        clearTimeout(
                            failTimer
                        );

                        settled = true;

                        reject(
                            new Error(
                                "Could not connect to the remote computer."
                            )
                        );

                        return;
                    }

                    if (
                        !manuallyDisconnected
                    ) {

                        connectionText.textContent =
                            "reconnecting";

                        reconnectTimer =
                            setTimeout(
                                function() {

                                    connect().catch(
                                        function() {}
                                    );

                                },
                                1500
                            );
                    }
                };

            socket.onerror =
                function(error) {

                    console.error(
                        "WebSocket error:",
                        error
                    );

                    connectionDot.classList.remove(
                        "connected"
                    );

                    connectionText.textContent =
                        "connection error";

                    if (!settled) {

                        clearTimeout(
                            failTimer
                        );

                        settled = true;

                        reject(
                            new Error(
                                "WebSocket connection failed."
                            )
                        );
                    }
                };

            socket.onmessage =
                function(event) {
                    if (
                        typeof event.data ===
                        "string"
                    ) {

                        try {

                            const message =
                                JSON.parse(
                                    event.data
                                );

                            if (
                                message.type ===
                                "monitors"
                            ) {

                                monitors =
                                    Array.isArray(
                                        message.monitors
                                    )
                                        ? message.monitors
                                        : [];

                                if (
                                    selectedMonitor ===
                                    null &&
                                    monitors.length > 0
                                ) {

                                    const primary =
                                        monitors.find(
                                            function(monitor) {

                                                return (
                                                    monitor.primary === true ||
                                                    monitor.main === true ||
                                                    Number(
                                                        monitor.id
                                                    ) === 1
                                                );
                                            }
                                        );

                                    selectedMonitor =
                                        primary
                                            ? primary.id
                                            : monitors[0].id;
                                }

                                if (
                                    monitors.length > 0 &&
                                    !monitors.some(
                                        function(monitor) {

                                            return String(
                                                monitor.id
                                            ) === String(
                                                selectedMonitor
                                            );
                                        }
                                    )
                                ) {

                                    selectedMonitor =
                                        monitors[0].id;
                                }

                                renderMonitors();

                            }

                            else if (
                                message.type ===
                                "size"
                            ) {

                                const srcW =
                                    Number(
                                        message.source_width
                                    );

                                const srcH =
                                    Number(
                                        message.source_height
                                    );

                                if (
                                    srcW > 0 &&
                                    srcH > 0
                                ) {

                                    screenWidth =
                                        srcW;

                                    screenHeight =
                                        srcH;

                                } else {

                                    const msgW =
                                        Number(
                                            message.width
                                        );

                                    const msgH =
                                        Number(
                                            message.height
                                        );

                                    if (
                                        msgW > 0 &&
                                        msgH > 0
                                    ) {

                                        screenWidth =
                                            msgW;

                                        screenHeight =
                                            msgH;
                                    }
                                }

                                if (
                                    typeof resizeScreen ===
                                    "function"
                                ) {

                                    resizeScreen();

                                } else if (
                                    typeof updateScreenLayout ===
                                    "function"
                                ) {

                                    updateScreenLayout();

                                }

                                waiting.style.display =
                                    "none";
                            }

                            else if (
                                message.type ===
                                "error"
                            ) {

                                showToast(
                                    message.message ||
                                    "Server error"
                                );
                            }

                        } catch (error) {

                            console.error(
                                "Message parse error:",
                                error
                            );
                        }

                        return;
                    }

                    waiting.style.display =
                        "none";

                    const imageURL =
                        URL.createObjectURL(
                            event.data
                        );

                    screen.onload =
                        function() {

                            URL.revokeObjectURL(
                                imageURL
                            );

                            if (
                                screen.naturalWidth > 0 &&
                                screen.naturalHeight > 0
                            ) {

                                screenWidth =
                                    screen.naturalWidth;

                                screenHeight =
                                    screen.naturalHeight;
                            }

                            if (
                                typeof resizeScreen ===
                                "function"
                            ) {

                                resizeScreen();

                            } else if (
                                typeof updateScreenLayout ===
                                "function"
                            ) {
                                updateScreenLayout();
                            }
                        };

                    screen.src =
                        imageURL;
                };
        }
    );
}

function send(message) {

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        try {

            socket.send(
                JSON.stringify(
                    message
                )
            );

            return true;

        } catch (error) {

            console.error(
                "Send error:",
                error
            );
        }
    }

    return false;
}

function getCoordinates(event) {

    const rect =
        screen.getBoundingClientRect();

    if (
        rect.width <= 0 ||
        rect.height <= 0 ||
        screenWidth <= 0 ||
        screenHeight <= 0
    ) {
        return {
            x: 0,
            y: 0
        };
    }

    let x =
        (
            event.clientX -
            rect.left
        ) *
        screenWidth /
        rect.width;

    let y =
        (
            event.clientY -
            rect.top
        ) *
        screenHeight /
        rect.height;

    x =
        Math.max(
            0,
            Math.min(
                screenWidth - 1,
                x
            )
        );

    y =
        Math.max(
            0,
            Math.min(
                screenHeight - 1,
                y
            )
        );

    return {
        x: Math.round(x),
        y: Math.round(y)
    };
}

screen.addEventListener(
    "pointerdown",
    function(event) {

        if (
            drawer.classList.contains(
                "open"

        ) {
            drawer.classList.remove(
                "open"
            );
        }

        if (gamepadMode) {

            gamepadScreenPointerId =
                event.pointerId;

            gamepadScreenDragging =
                false;

            gamepadScreenStartX =
                event.clientX;

            gamepadScreenStartY =
                event.clientY;

            try {

                screen.setPointerCapture(
                    event.pointerId
                );

            } catch (error) {}

            return;
        }

        pointerDown =
            true;

        holdStarted =
            false;

        try {

            screen.setPointerCapture(
                event.pointerId
            );

        } catch (error) {}

        showTouch(
            event
        );

        const position =
            getCoordinates(
                event
            );

        const now =
            performance.now();

        const isDoubleTap =
            (
                now -
                lastTapTime
            ) < 350;

        const isSamePosition =
            lastTapPosition &&
            Math.abs(
                lastTapPosition.x -
                event.clientX
            ) < 40 &&
            Math.abs(
                lastTapPosition.y -
                event.clientY
            ) < 40;

        if (
            isDoubleTap &&
            isSamePosition
        ) {

            clearTimeout(
                holdTimer
            );

            send({
                type:"mouse_click",
                button:"right",
                x:position.x,
                y:position.y
            });

            lastTapTime =
                0;

            lastTapPosition =
                null;

            return;
        }

        lastTapTime =
            now;

        lastTapPosition = {
            x:event.clientX,
            y:event.clientY
        };

        holdTimer =
            setTimeout(
                function() {

                    if (!pointerDown) {
                        return;
                    }

                    holdStarted =
                        true;

                    send({
                        type:"mouse_down",
                        button:"left",
                        x:position.x,
                        y:position.y
                    });

            );

);

            if (
                gamepadScreenDragging

const dx =

screen.addEventListener(
    "pointerup",
    function(event) {

        event.preventDefault();

        if (gamepadMode) {

            if (
                event.pointerId !==
                gamepadScreenPointerId
            ) {
                return;
            }

            const wasDragging =
                gamepadScreenDragging;

            gamepadScreenDragging =
                false;

            gamepadScreenPointerId =
                null;

            if (wasDragging) {

                const position =
                    getCoordinates(
                        event
                    );

                send({
                    type:"mouse_up",

                    x:position.x,
                    y:position.y
                });

            send({

            });

            return;
        }

        pointerDown =

        clearTimeout(

        );

        const position =

        if (holdStarted) {

            send({

            });

const GAMEPAD_KEY_MAP = {

    W:{
        key:"w",
        code:"KeyW"
    },

    A:{
        key:"a",
        code:"KeyA"
    },

    S:{
        key:"s",
        code:"KeyS"
    },

    D:{
        key:"d",
        code:"KeyD"
    },

    SPACE:{
        key:" ",
        code:"Space"
    }
};

let gamepadMode =
    false;

const activeGamepadKeys =
    new Set();

function gamepadPressKey(name) {

    if (
        activeGamepadKeys.has(
            name
        )
    ) {
        return;
    }

    activeGamepadKeys.add(
        name
    );

    const mapping =
        GAMEPAD_KEY_MAP[
            name
        ];

    send({
        type:"key_down",
        key:mapping.key,
        code:mapping.code
    });
}

function gamepadReleaseKey(name) {

    if (
        !activeGamepadKeys.has(
            name
        )
    ) {
        return;
    }

    activeGamepadKeys.delete(
        name
    );

    const mapping =
        GAMEPAD_KEY_MAP[
            name
        ];

    send({
        type:"key_up",
        key:mapping.key,
        code:mapping.code
    });
}

function gamepadReleaseMovementKeys() {

    [
        "W",
        "A",
        "S",
        "D"
    ].forEach(
        gamepadReleaseKey
    );
}

let joystickPointerId =
    null;

const JOYSTICK_MAX_DISTANCE =
    40;

const JOYSTICK_DEADZONE =
    14;

function joystickDirections(
    dx,
    dy
) {

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (
        distance <
        JOYSTICK_DEADZONE
    ) {
        return [];
    }

    let angle =
        Math.atan2(
            -dy,
            dx
        ) *
        180 /
        Math.PI;

    if (
        angle <
        0
    ) {
        angle += 360;
    }

    const sector =
        Math.round(
            angle / 45
        ) % 8;

    switch (sector) {

        case 0:
            return ["D"];

        case 1:
            return ["W","D"];

        case 2:
            return ["W"];

        case 3:
            return ["W","A"];

        case 4:
            return ["A"];

        case 5:
            return ["S","A"];

        case 6:
            return ["S"];

        case 7:
            return ["S","D"];
    }

    return [];
}

function updateJoystickKeys(
    dx,
    dy
) {

    const desired =
        joystickDirections(
            dx,
            dy
        );

    [
        "W",
        "A",
        "S",
        "D"
    ].forEach(
        function(direction) {

            if (
                desired.indexOf(
                    direction
                ) !== -1
            ) {

                gamepadPressKey(
                    direction
                );

            } else {

                gamepadReleaseKey(
                    direction
                );
            }
        }
    );
}

function handleJoystickPointer(
    clientX,
    clientY
) {

    const rect =
        gamepadJoystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (
        distance >
        JOYSTICK_MAX_DISTANCE
    ) {

        const ratio =
            JOYSTICK_MAX_DISTANCE /
            distance;

        dx *= ratio;
        dy *= ratio;
    }

    gamepadKnob.style.transform =
        "translate(" +
        dx +
        "px," +
        dy +
        "px)";

    updateJoystickKeys(
        dx,
        dy
    );
}

gamepadJoystick.addEventListener(
    "pointerdown",
    function(event) {

        if (!gamepadMode) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        joystickPointerId =
            event.pointerId;

        gamepadJoystick.classList.add(
            "dragging"
        );

        try {

            gamepadJoystick.setPointerCapture(
                event.pointerId
            );

        } catch (error) {}

        handleJoystickPointer(
            event.clientX,
            event.clientY
        );
    }
);

gamepadJoystick.addEventListener(
    "pointermove",
    function(event) {

        if (
            event.pointerId !==
            joystickPointerId
        ) {
            return;
        }

        event.preventDefault();

        handleJoystickPointer(
            event.clientX,
            event.clientY
        );
    }
);

function endJoystick(event) {

    if (
        event.pointerId !==
        joystickPointerId
    ) {
        return;
    }

    joystickPointerId =
        null;

    resetJoystickKnob();

    gamepadReleaseMovementKeys();
}

gamepadJoystick.addEventListener(
    "pointerup",
    endJoystick
);

gamepadJoystick.addEventListener(
    "pointercancel",
    endJoystick
);

jumpButton.addEventListener(
    "pointerdown",
    function(event) {

        if (!gamepadMode) {
            return;
        }

        event.preventDefault();
        event.stopPropagation();

        jumpButton.classList.add(
            "pressed"
        );

        try {

            jumpButton.setPointerCapture(
                event.pointerId
            );

        } catch (error) {}

        gamepadPressKey(
            "SPACE"
        );
    }
);

function releaseJump(event) {

    jumpButton.classList.remove(
        "pressed"
    );

    gamepadReleaseKey(
        "SPACE"
    );
}

jumpButton.addEventListener(
    "pointerup",
    releaseJump
);

jumpButton.addEventListener(
    "pointercancel",
    releaseJump
);

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            1600
        );
}

if (verificationToken) {

    hideLogin();

    connect().catch(
        function(error) {

            console.error(
                error
            );

            loginOverlay.style.display =
                "flex";

            loginStatus.textContent =
                "Connection failed:\n" +
                error.message;
        }
    );

} else {

    showLoginChoice();
}
</script>
