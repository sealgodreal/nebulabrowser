<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --surface-elevated: #161616;
    --border: #1f1f1f;
    --border-hover: #2a2a2a;
    --text: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #5a5a5a;
    --accent: #8b5cf6;
    --accent2: #a78bfa;
    --accent-glow: rgba(139, 92, 246, 0.25);
    --accent-soft: rgba(139, 92, 246, 0.08);
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, 0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 14px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 32px rgba(0,0,0,0.5);
    --shadow-lg: 0 16px 56px rgba(0,0,0,0.6);
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: auto;
    touch-action: manipulation;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #444; }

.header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 20px;
    height: 52px;
    background: rgba(10,10,10,0.88);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.header-brand {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    margin-right: 20px;
}

.header-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
}

.header-count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    padding: 2px 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    border: 1px solid var(--border);
    margin-left: 10px;
    flex-shrink: 0;
}

.header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    width: 200px;
    transition: var(--transition-smooth);
    flex-shrink: 0;
}

.search-wrap:focus-within {
    width: 260px;
    border-color: #333;
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
}

.search-wrap svg { color: var(--text-muted); flex-shrink: 0; transition: var(--transition-fast); }
.search-wrap:focus-within svg { color: var(--text-secondary); }

.search-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    width: 100%;
    font-family: inherit;
}

.search-wrap input::placeholder { color: var(--text-muted); }

.content {
    position: relative;
    z-index: 1;
    padding: 20px 20px 40px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 160px);
    gap: 14px;
    justify-content: center;
    align-items: center;
    justify-items: center;
    width: calc(5 * 160px + 4 * 14px);
    max-width: calc(100vw - 40px);
    margin: 0 auto;
}

.service-card {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    display: block;
    width: 160px;
    height: 160px;
    background: #161616;
    border: 1px solid var(--border);
    color: #ffffff;
    transition:
        transform var(--transition-smooth),
        box-shadow var(--transition-smooth),
        border-color var(--transition-smooth);
    animation: fadeUp 0.3s ease both;
    user-select: none;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.service-card:hover {
    transform: translateY(-3px) scale(1.025);
    border-color: var(--border-hover);
    box-shadow: 0 8px 32px rgba(0,0,0,0.55), var(--shadow-lg);
}

.service-card:active { transform: translateY(-1px) scale(1.01); }

.service-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #141414, #1a1a1a);
}

.service-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: block;
}

.service-card:hover .service-icon img { transform: scale(1.06); }

.service-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    pointer-events: none;
    background: rgba(12,12,12,0.38);
    backdrop-filter: blur(2px) saturate(1.05);
    -webkit-backdrop-filter: blur(2px) saturate(1.05);
    border: 1px solid rgba(255,255,255,0.07);
    transition: background var(--transition-smooth), backdrop-filter var(--transition-smooth);
}

.service-card:hover .service-label {
    background: rgba(12,12,12,0.42);
    backdrop-filter: blur(2px) saturate(1.08);
    -webkit-backdrop-filter: blur(2px) saturate(1.08);
}

.service-name {
    font-size: 14px;
    font-weight: 650;
    color: #ffffff;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90%;
    text-align: center;
    text-shadow: 0 1px 5px rgba(0,0,0,0.45);
}

.overlay-gradient { display: none; }

.empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 14px;
    animation: fadeUp 0.4s ease both;
}

.empty-state svg { width: 44px; height: 44px; color: var(--text-muted); opacity: 0.35; }
.empty-state p { color: var(--text-muted); font-size: 14px; text-align: center; }

#serviceOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: none;
    flex-direction: column;
}

#serviceFrame { width: 100%; height: 100%; border: none; display: none; }

#loadingScreen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.5s;
    z-index: 10000;
}

#loadingScreen iframe { width: 100%; height: 100%; border: none; }

.close-overlay-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: rgba(17, 17, 17, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10001;
    transition: var(--transition-fast);
    box-shadow: var(--shadow-md);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.close-overlay-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-hover); }

.close-overlay-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.close-overlay-btn.dragging { opacity: 0.8; cursor: grabbing; transition: none; }

.disclaimer {
    padding: 16px 20px 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.5;
}

@media (max-width: 768px) {
    .content { padding: 16px 12px 32px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .header-title { font-size: 17px; }
    .search-wrap { width: 160px; }
    .search-wrap:focus-within { width: 200px; }
    .provider-btn span { display: none; }
}

@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}

::selection { background: rgba(139, 92, 246, 0.3); color: #fff; }
</style>

<base target="_blank">
</head>

<body>

<div class="header">
    <div class="header-brand">
        <span class="header-title">Nebula Cloud</span>
        <span class="header-count" id="serviceCount">0 Services</span>
    </div>

    <div class="header-right">
        <div class="search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search services..." autocomplete="off">
        </div>
    </div>
</div>

<div class="content">
    <div class="grid" id="grid"></div>
</div>

<div class="disclaimer" id="disclaimer">
    Nebula Cloud uses the service "nowgg.fun" by Frogiee1 (frogiee.one). This service is not owned or controlled by us.
</div>

</div>

<div id="serviceOverlay">
    <button class="close-overlay-btn" id="closeOverlayBtn" aria-label="Close">
        <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <div id="loadingScreen">
        <iframe src="loading.html"></iframe>
    </div>

    <iframe
        id="serviceFrame"
        allow="camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write; web-share; xr-spatial-tracking; gamepad; geolocation"
        allowfullscreen
        credentialless
    ></iframe>
</div>

<script>
const SERVICES = {
    nowggfun: [
        {
            name: "Android",
            icon: "../images/android.webp",
            url: "https://nowgg.fun/apps/uncube/7074/now.html"
        },
        {
            name: "Aptoide",
            icon: "../images/aptoide.png",
            url: "https://nowgg.fun/apps/aptoide/5874/aptoide.html"
        },
        {
            name: "Roblox",
            icon: "../images/roblox.jpg",
            url: "https://nowgg.fun/apps/a/19900/b.html"
        },
        {
            name: "Geometry Dash",
            icon: "../images/gd.png",
            url: "https://nowgg.fun/apps/robtop-games/1400/geometry-dash.html"
        },
        {
            name: "Minecraft Trial",
            icon: "../images/mctrial.png",
            url: "https://nowgg.fun/apps/aptoide/5874/aptoide.html?deep_link=aptoidesearch://com.mojang.minecrafttrialpe"
        }
    ]
};

const DISCLAIMERS = {
    nowggfun: 'Nebula Cloud uses the service "nowgg.fun" by Frogiee1 (frogiee.one). This service is not owned or controlled by us.'
};

let currentProvider = "nowggfun";
let searchQuery = "";

const grid = document.getElementById("grid");
const overlay = document.getElementById("serviceOverlay");
const loadingScreen = document.getElementById("loadingScreen");
const closeOverlayBtn = document.getElementById("closeOverlayBtn");
const serviceCount = document.getElementById("serviceCount");
const disclaimer = document.getElementById("disclaimer");

let frame = document.getElementById("serviceFrame");
let loadToken = 0;

document.getElementById("searchInput").addEventListener("input", e => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderGrid();
});

let _p = "";
let _pReady = false;
let _pResolvers = [];

function _waitForProxy() {
    if (_pReady) return Promise.resolve(_p);
    return new Promise(resolve => _pResolvers.push(resolve));
}

(async function () {
    const keys = await caches.keys();
    for (const key of keys) await caches.delete(key);
    sessionStorage.clear();

    const proxyUrls = [
        "https://brooklyn-oval-bike-tourism.trycloudflare.com",
        "https://resources-indices-exists-maintaining.trycloudflare.com",
        "https://modules-stop-souls-precipitation.trycloudflare.com"
    ];

    const overlay = Object.assign(document.createElement("div"), {
        id: "proxyOverlay",
        style: "position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;flex-direction:column;user-select:none;"
    });
    const statusText = Object.assign(document.createElement("div"), {
        id: "proxyStatus",
        style: "color:#fff;font-size:16px;font-weight:300;letter-spacing:1px;",
        textContent: "finding unblocked proxy..."
    });
    overlay.appendChild(statusText);
    document.body.appendChild(overlay);

    const probeFrame = Object.assign(document.createElement("iframe"), {
        id: "probeFrame",
        style: "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;",
        sandbox: "allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
    });
    document.body.appendChild(probeFrame);

    const isFrameBlocked = () => {
        try {
            const src = probeFrame.src;
            if (!src || src === "about:blank" || src.startsWith("about:")) return true;

            let href = null;
            try { href = probeFrame.contentWindow?.location?.href || probeFrame.src; } catch (_) { href = probeFrame.src; }

            const lower = (href || src || "").toLowerCase();
            const blockedKeywords = [
                "securly.com/broker/blocked","goguardian.com/blocked","goguardian.com/filter",
                "lightspeed.com/blocked","iboss.com/blocked","smoothwall.com/blocked",
                "fortiguard.com/blocked","opendns.com/blocked","umbrella.com/blocked",
                "zscaler.com/blocked","mcafee.com/blocked","barracuda.com/blocked",
                "forcepoint.com/blocked","netnanny.com/blocked","cyberpatrol.com/blocked",
                "surfwatch.com/blocked","covenanteyes.com/blocked","blocked","filter",
                "restricted","denied","forbidden","notallowed","policyviolation",
                "accessdenied","categoryblocked","webfilter","dnsfilter","contentfilter"
            ];
            if (blockedKeywords.some(k => lower.includes(k))) return true;

            try {
                const doc = probeFrame.contentDocument || probeFrame.contentWindow?.document;
                if (doc) {
                    const title = (doc.title || "").toLowerCase();
                    if (["blocked","securly","goguardian","access denied","forbidden","restricted","filter"].some(k => title.includes(k))) return true;
                    if (doc.body) {
                        const bodyText = (doc.body.innerText || doc.body.textContent || "").toLowerCase();
                        if (bodyText.includes("login to continue") && bodyText.includes("school email")) return true;
                        if (bodyText.trim().length < 10) return true;
                    }
                }
            } catch (_) {}
            return false;
        } catch (_) { return false; }
    };

    const fetchBlocked = async url => {
        try { await fetch(url, { method: "HEAD", mode: "no-cors", cache: "no-store" }); return false; }
        catch (_) { return true; }
    };

    const loadFrame = (url, timeout = 15000) => new Promise((resolve, reject) => {
        let timer = null;
        let settled = false;
        const cleanup = () => { if (timer) clearTimeout(timer); probeFrame.onload = null; probeFrame.onerror = null; };
        probeFrame.onload = () => { if (!settled) { settled = true; cleanup(); resolve(); } };
        probeFrame.onerror = () => { if (!settled) { settled = true; cleanup(); reject(); } };
        timer = setTimeout(() => { if (!settled) { settled = true; cleanup(); reject(); } }, timeout);
        probeFrame.src = url;
    });

    const findProxy = async () => {
        let attempt = 0;
        const maxAttempts = proxyUrls.length * 3;
        let idx = 0;

        while (attempt < maxAttempts) {
            const url = proxyUrls[idx % proxyUrls.length];
            const proxyPath = url.replace(/\/$/, "") + "/learn/study/";
            try {
                await loadFrame(proxyPath, 18000);
                let blocked = isFrameBlocked();
                if (!blocked && await fetchBlocked(proxyPath)) {
                    const src = probeFrame.src || "";
                    if (src.includes("securly") || src.includes("goguardian") || src.includes("blocked") || src.includes("filter")) {
                        blocked = true;
                    }
                }
                const lower = url.toLowerCase();
                if (lower.includes("securly.com/broker/blocked") || lower.includes("goguardian.com/blocked")) blocked = true;
                if (!blocked) return url;
            } catch (_) {}
            idx = (idx + 1) % proxyUrls.length;
            attempt++;
            await new Promise(r => setTimeout(r, 500));
        }
        return null;
    };

    const found = await findProxy();
    const overlayEl = document.getElementById("proxyOverlay");
    const statusEl = document.getElementById("proxyStatus");

    if (found) {
        if (statusEl) statusEl.textContent = "link found! initializing...";
        _p = found + "/learn/study/";
        await new Promise(r => setTimeout(r, 100));
        if (overlayEl) overlayEl.remove();
    } else {
        if (statusEl) statusEl.textContent = "all proxy links are blocked.";
        _p = "https://pennsylvania-discussed-perform-dot.trycloudflare.com/learn/study/";
    }

    _pReady = true;
    _pResolvers.forEach(resolve => resolve(_p));
    _pResolvers = [];

    const probeEl = document.getElementById("probeFrame");
    if (probeEl) { probeEl.src = "about:blank"; probeEl.remove(); }
})();

async function resetLoadingScreen() {
    const old = loadingScreen.querySelector("iframe");

    if (old) {
        old.remove();
    }

    const f = document.createElement("iframe");
    f.src = "./loading.html";

    loadingScreen.appendChild(f);

    await new Promise(resolve => {
        f.onload = resolve;
        setTimeout(resolve, 100);
    });
}

function createServiceFrame() {
    if (frame) {
        frame.onload = null;
        frame.src = "about:blank";
        frame.remove();
    }

    const newFrame = document.createElement("iframe");

    newFrame.id = "serviceFrame";
    newFrame.allow = "camera; microphone; display-capture; autoplay; " +
        "clipboard-read; clipboard-write; web-share; " +
        "xr-spatial-tracking; gamepad; geolocation; accelerometer; " +
        "ambient-light-sensor; battery; bluetooth; browsing-topics; " +
        "compute-pressure; document-domain; encrypted-media; " +
        "execution-while-not-rendered; execution-while-out-of-viewport; " +
        "fullscreen; gyroscope; hid; identity-credentials-get; " +
        "idle-detection; keyboard-map; local-fonts; magnetometer; " +
        "midi; otp-credentials; payment; picture-in-picture; " +
        "publickey-credentials-create; publickey-credentials-get; " +
        "screen-wake-lock; serial; speaker-selection; storage-access; " +
        "usb; window-management";
    newFrame.setAttribute("credentialless", "");
    newFrame.style.cssText = "width:100%;height:100%;border:none;display:none;";

    overlay.appendChild(newFrame);

    frame = newFrame;

    return newFrame;
}

async function openService(url) {
    const token = ++loadToken;

    overlay.style.display = "flex";

    frame = createServiceFrame();
    frame.style.display = "none";

    loadingScreen.style.opacity = "1";
    loadingScreen.style.display = "flex";

    await resetLoadingScreen();

    if (token !== loadToken) {
        return;
    }

    frame.onload = () => {
        if (token !== loadToken) {
            return;
        }

        loadingScreen.style.opacity = "0";

        setTimeout(() => {
            if (token === loadToken) {
                loadingScreen.style.display = "none";
            }
        }, 500);

        frame.style.display = "block";
    };

    const proxyBase = await _waitForProxy();
    frame.src = proxyBase + encodeURIComponent(url);
}

function closeService() {
    ++loadToken;

    overlay.style.display = "none";

    if (frame) {
        frame.onload = null;
        frame.src = "about:blank";
        frame.remove();
    }

    frame = null;

    loadingScreen.style.opacity = "1";
    loadingScreen.style.display = "flex";

    resetLoadingScreen();
}

let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let hasDragged = false;

closeOverlayBtn.addEventListener("pointerdown", e => {
    isDragging = true;
    hasDragged = false;

    closeOverlayBtn.setPointerCapture(e.pointerId);
    closeOverlayBtn.classList.add("dragging");

    dragOffsetX = e.clientX - closeOverlayBtn.offsetLeft;
    dragOffsetY = e.clientY - closeOverlayBtn.offsetTop;
});

closeOverlayBtn.addEventListener("pointermove", e => {
    if (!isDragging) {
        return;
    }

    hasDragged = true;

    e.preventDefault();

    const nx = Math.max(
        0,
        Math.min(
            e.clientX - dragOffsetX,
            overlay.clientWidth - closeOverlayBtn.offsetWidth
        )
    );

    const ny = Math.max(
        0,
        Math.min(
            e.clientY - dragOffsetY,
            overlay.clientHeight - closeOverlayBtn.offsetHeight
        )
    );

    closeOverlayBtn.style.left = nx + "px";
    closeOverlayBtn.style.top = ny + "px";
});

closeOverlayBtn.addEventListener("pointerup", () => {
    isDragging = false;
    closeOverlayBtn.classList.remove("dragging");
});

closeOverlayBtn.addEventListener("pointercancel", () => {
    isDragging = false;
    closeOverlayBtn.classList.remove("dragging");
});

closeOverlayBtn.addEventListener("click", e => {
    if (hasDragged) {
        hasDragged = false;
        e.stopPropagation();
        return;
    }

    closeService();
});

overlay.addEventListener("click", e => {
    if (e.target === overlay) {
        closeService();
    }
});

function renderGrid() {
    const services = SERVICES[currentProvider];

    const filtered = services.filter(service =>
        service.name.toLowerCase().includes(searchQuery)
    );

    serviceCount.textContent =
        filtered.length +
        " Service" +
        (filtered.length !== 1 ? "s" : "");

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <p>No services found matching "${searchQuery}"</p>
            </div>
        `;

        return;
    }

    grid.innerHTML = "";

    filtered.forEach((service, i) => {
        const card = document.createElement("div");

        card.className = "service-card";
        card.style.animationDelay = `${i * 0.04}s`;

        card.onclick = () => openService(service.url);

        card.innerHTML = `
            <div class="service-icon">
                <img src="${service.icon}" alt="${service.name}" loading="lazy">
            </div>
            <div class="service-label">
                <span class="service-name">${service.name}</span>
            </div>
        `;

        grid.appendChild(card);
    });
}

renderGrid();
</script>

<canvas id="stars"></canvas>
<style>
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
</style>
<script>
function setupstars(canvas) {
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width = canvas.offsetWidth || window.innerWidth;
  var h = canvas.height = canvas.offsetHeight || window.innerHeight;
  var stars = [];
  for (var i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.2 + 0.3,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      o: Math.random() * 0.8 + 0.2
    });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    var t = Date.now() / 1000;
    var c = '70,70,75';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < 0 || s.x > w) s.vx *= -1;
      if (s.y < 0 || s.y > h) s.vy *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + c + ', ' + (s.o + Math.sin(t + s.x) * 0.2) + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  function setsize() {
    w = canvas.width = canvas.offsetWidth || window.innerWidth;
    h = canvas.height = canvas.offsetHeight || window.innerHeight;
  }
  window.addEventListener('resize', setsize);
  draw();
}
setupstars(document.getElementById('stars'));
</script>

</body>
</html>
