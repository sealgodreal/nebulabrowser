<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface-elevated: #161616;
    --surface-hover: #1a1a1a;
    --border: #1f1f1f;
    --border-hover: #2a2a2a;
    --text: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #5a5a5a;
    --accent: #8b5cf6;
    --accent-glow: rgba(139, 92, 246, 0.25);
    --accent-soft: rgba(139, 92, 246, 0.08);
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, 0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    touch-action: manipulation;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: #444;
}

.header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
}

.header-count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    padding: 2px 8px;
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.provider-switcher {
    position: relative;
    margin-left: auto;
    flex-shrink: 0;
}

.provider-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition-fast);
    white-space: nowrap;
    user-select: none;
}

.provider-btn:hover {
    border-color: var(--border-hover);
    color: var(--text);
    background: var(--surface-elevated);
}

.provider-btn[aria-expanded="true"] {
    border-color: var(--accent);
    color: var(--text);
    background: var(--surface-elevated);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.provider-btn svg.chevron {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform var(--transition-fast);
    flex-shrink: 0;
}

.provider-btn[aria-expanded="true"] svg.chevron {
    transform: rotate(180deg);
}

.provider-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 160px;
    background: var(--surface-elevated);
    border: 1px solid var(--border-hover);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    display: none;
    flex-direction: column;
    z-index: 200;
    animation: dropIn 0.15s cubic-bezier(0.4, 0, 0.2, 1) both;
}

.provider-dropdown.open {
    display: flex;
}

@keyframes dropIn {
    from {
        opacity: 0;
        transform: translateY(-6px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.provider-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: var(--transition-fast);
    border: none;
    background: transparent;
    font-family: inherit;
    text-align: left;
    width: 100%;
    user-select: none;
}

.provider-option:hover {
    background: var(--surface-hover);
    color: var(--text);
}

.provider-option.selected {
    color: var(--accent);
    background: var(--accent-soft);
}

.provider-option .checkmark {
    margin-left: auto;
    width: 14px;
    height: 14px;
    stroke: var(--accent);
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
}

.provider-option.selected .checkmark {
    opacity: 1;
}

.dropdown-divider {
    height: 1px;
    background: var(--border);
    margin: 2px 0;
}

.search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 14px;
    width: 220px;
    transition: var(--transition-smooth);
    flex-shrink: 0;
}

.search-wrap:focus-within {
    width: 280px;
    border-color: var(--accent);
    background: var(--surface-elevated);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-wrap svg {
    color: var(--text-muted);
    flex-shrink: 0;
    transition: var(--transition-fast);
}

.search-wrap:focus-within svg {
    color: var(--accent);
}

.search-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    width: 100%;
    font-family: inherit;
}

.search-wrap input::placeholder {
    color: var(--text-muted);
}

.content {
    padding: 40px 24px;
    display: flex;
    justify-content: center;
}

.grid {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(161px, 1fr));
    justify-content: center;
    gap: 16px;
}

.service-card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: var(--transition-smooth);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    animation: fadeUp 0.35s ease both;
}

.service-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    border: 1px solid transparent;
    transition: var(--transition-fast);
    pointer-events: none;
    z-index: 2;
}

.service-card:hover::before {
    border-color: rgba(139, 92, 246, 0.15);
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.service-card:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: var(--border-hover);
    box-shadow: var(--shadow-lg), 0 0 30px rgba(139, 92, 246, 0.06);
}

.service-card:active {
    transform: translateY(-3px) scale(1.015);
    transition: var(--transition-fast);
}

.service-icon {
    position: absolute;
    inset: 0;
}

.service-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.9);
    transform: scale(1.05);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.service-card:hover .service-icon img {
    transform: scale(1.12);
    filter: brightness(0.75);
}

.service-card .overlay-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.05)
    );
    opacity: 0;
    transition: var(--transition-smooth);
    z-index: 1;
}

.service-card:hover .overlay-gradient {
    opacity: 1;
}

.service-name {
    position: absolute;
    bottom: 14px;
    left: 14px;
    right: 14px;
    font-size: 16px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(8px);
    transition: var(--transition-smooth);
    color: var(--text);
    z-index: 3;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.service-card:hover .service-name {
    opacity: 1;
    transform: translateY(0);
}

.empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 16px;
    animation: fadeUp 0.4s ease both;
}

.empty-state svg {
    width: 48px;
    height: 48px;
    color: var(--text-muted);
    opacity: 0.4;
}

.empty-state p {
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
}

#serviceOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: none;
    flex-direction: column;
}

#serviceFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}

#loadingScreen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.5s;
    z-index: 10000;
}

#loadingScreen iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.close-overlay-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: rgba(17, 17, 17, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10001;
    transition: var(--transition-fast);
    box-shadow: var(--shadow-md);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.close-overlay-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-hover);
}

.close-overlay-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.close-overlay-btn.dragging {
    opacity: 0.8;
    cursor: grabbing;
    transition: none;
}

.disclaimer {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 24px 32px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.5;
}

@media (max-width: 768px) {
    .content {
        padding: 24px 16px;
    }

    .grid {
        grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
        gap: 12px;
    }

    .header {
        padding: 12px 16px;
        gap: 8px;
    }

    .search-wrap {
        width: 140px;
    }

    .search-wrap:focus-within {
        width: 180px;
    }

    .header-title {
        font-size: 14px;
    }

    .provider-btn span {
        display: none;
    }
}

::selection {
    background: rgba(139, 92, 246, 0.3);
    color: #fff;
}
</style>

function openProviderDropdown() {
    providerDropdown.classList.add("open");
    providerBtn.setAttribute("aria-expanded", "true");
}

function closeProviderDropdown() {
    providerDropdown.classList.remove("open");
    providerBtn.setAttribute("aria-expanded", "false");
}

providerBtn.addEventListener("click", e => {
    e.stopPropagation();

    const isOpen = providerDropdown.classList.contains("open");

    if (isOpen) {
        closeProviderDropdown();
    } else {
        openProviderDropdown();
    }
});

document.addEventListener("click", e => {
    if (!document.getElementById("providerSwitcher").contains(e.target)) {
        closeProviderDropdown();
    }
});

document.querySelectorAll(".provider-option").forEach(opt => {
    opt.addEventListener("click", () => {
        const provider = opt.dataset.provider;

        if (provider === currentProvider) {
            closeProviderDropdown();
            return;

        currentProvider = provider;

        providerBtnLabel.textContent =
            provider === "nowggfun" ? "nowgg.fun" : "now.gg";

                    const title = (doc.title || "").toLowerCase();
                    if (["blocked","securly","goguardian","access denied","forbidden","restricted","filter"].some(k => title.includes(k))) return true;
                    if (doc.body) {
                        const bodyText = (doc.body.innerText || doc.body.textContent || "").toLowerCase();
                        if (bodyText.includes("login to continue") && bodyText.includes("school email")) return true;
                        if (bodyText.trim().length < 10) return true;
                    }
                }
            } catch (_) {}
            return false;
        } catch (_) { return false; }
    };

    const fetchBlocked = async url => {
        try { await fetch(url, { method: "HEAD", mode: "no-cors", cache: "no-store" }); return false; }
        catch (_) { return true; }
    };

    const loadFrame = (url, timeout = 15000) => new Promise((resolve, reject) => {
        let timer = null;
        let settled = false;
        const cleanup = () => { if (timer) clearTimeout(timer); probeFrame.onload = null; probeFrame.onerror = null; };
        probeFrame.onload = () => { if (!settled) { settled = true; cleanup(); resolve(); } };
        probeFrame.onerror = () => { if (!settled) { settled = true; cleanup(); reject(); } };
        timer = setTimeout(() => { if (!settled) { settled = true; cleanup(); reject(); } }, timeout);
        probeFrame.src = url;
    });

    const findProxy = async () => {
        let attempt = 0;
        const maxAttempts = proxyUrls.length * 3;
        let idx = 0;

        while (attempt < maxAttempts) {
            const url = proxyUrls[idx % proxyUrls.length];
            try {
                await loadFrame(url, 18000);
                let blocked = isFrameBlocked();
                if (!blocked && await fetchBlocked(url)) {
                    const src = probeFrame.src || "";
                    if (src.includes("securly") || src.includes("goguardian") || src.includes("blocked") || src.includes("filter")) {
                        blocked = true;
                    }
                }
                const lower = url.toLowerCase();
                if (lower.includes("securly.com/broker/blocked") || lower.includes("goguardian.com/blocked")) blocked = true;
                if (!blocked) return url;
            } catch (_) {}
            idx = (idx + 1) % proxyUrls.length;
            attempt++;
            await new Promise(r => setTimeout(r, 500));
        }
        return null;
    };

    const found = await findProxy();
    const overlayEl = document.getElementById("proxyOverlay");
    const statusEl = document.getElementById("proxyStatus");

    if (found) {
        if (statusEl) statusEl.textContent = "link found! initializing...";
        _p = found + "/learn/study/";
        await new Promise(r => setTimeout(r, 100));
        if (overlayEl) overlayEl.remove();
    } else {
        if (statusEl) statusEl.textContent = "all proxy links are blocked.";
        _p = "https://pennsylvania-discussed-perform-dot.trycloudflare.com/learn/study/";
    }

    _pReady = true;
    _pResolvers.forEach(resolve => resolve(_p));
    _pResolvers = [];

    const probeEl = document.getElementById("probeFrame");
    if (probeEl) { probeEl.src = "about:blank"; probeEl.remove(); }
})();

async function resetLoadingScreen() {
    const old = loadingScreen.querySelector("iframe");

    if (old) {
        old.remove();
    }

    const f = document.createElement("iframe");
    f.src = "./loading.html";

    loadingScreen.appendChild(f);

    await new Promise(resolve => {
        f.onload = resolve;
        setTimeout(resolve, 100);
    });
}

function createServiceFrame() {
    if (frame) {
        frame.onload = null;
        frame.src = "about:blank";
        frame.remove();
    }

    const newFrame = document.createElement("iframe");

    newFrame.id = "serviceFrame";
    newFrame.allow = "camera; microphone; display-capture; autoplay; " +
        "clipboard-read; clipboard-write; web-share; " +
        "xr-spatial-tracking; gamepad; geolocation; accelerometer; " +
        "ambient-light-sensor; battery; bluetooth; browsing-topics; " +
        "compute-pressure; document-domain; encrypted-media; " +
        "execution-while-not-rendered; execution-while-out-of-viewport; " +
        "fullscreen; gyroscope; hid; identity-credentials-get; " +
        "idle-detection; keyboard-map; local-fonts; magnetometer; " +
        "midi; otp-credentials; payment; picture-in-picture; " +
        "publickey-credentials-create; publickey-credentials-get; " +
        "screen-wake-lock; serial; speaker-selection; storage-access; " +
        "usb; window-management";
    newFrame.setAttribute("credentialless", "");
    newFrame.style.cssText = "width:100%;height:100%;border:none;display:none;";

    overlay.appendChild(newFrame);

    frame = newFrame;

    return newFrame;
}

async function openService(url) {
    const token = ++loadToken;

    overlay.style.display = "flex";

    frame = createServiceFrame();
    frame.style.display = "none";

    loadingScreen.style.opacity = "1";
    loadingScreen.style.display = "flex";

    await resetLoadingScreen();

    if (token !== loadToken) {
        return;
    }

    frame.onload = () => {
        if (token !== loadToken) {
            return;
        }

        loadingScreen.style.opacity = "0";

        setTimeout(() => {
            if (token === loadToken) {
                loadingScreen.style.display = "none";
            }
        }, 500);

        frame.style.display = "block";
    };

    const proxyBase = await _waitForProxy();
    frame.src = proxyBase + encodeURIComponent(url);
}

function closeService() {
    ++loadToken;

    overlay.style.display = "none";

    if (frame) {
        frame.onload = null;
        frame.src = "about:blank";
        frame.remove();
    }

    frame = null;

    loadingScreen.style.opacity = "1";
    loadingScreen.style.display = "flex";

    resetLoadingScreen();
}

let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let hasDragged = false;

closeOverlayBtn.addEventListener("pointerdown", e => {
    isDragging = true;
    hasDragged = false;

    closeOverlayBtn.setPointerCapture(e.pointerId);
    closeOverlayBtn.classList.add("dragging");

    dragOffsetX = e.clientX - closeOverlayBtn.offsetLeft;
    dragOffsetY = e.clientY - closeOverlayBtn.offsetTop;
});

closeOverlayBtn.addEventListener("pointermove", e => {
    if (!isDragging) {
        return;
    }

    hasDragged = true;

    e.preventDefault();

    const nx = Math.max(
        0,
        Math.min(
            e.clientX - dragOffsetX,
            overlay.clientWidth - closeOverlayBtn.offsetWidth
        )
    );

    const ny = Math.max(
        0,
        Math.min(
            e.clientY - dragOffsetY,
            overlay.clientHeight - closeOverlayBtn.offsetHeight
        )
    );

    closeOverlayBtn.style.left = nx + "px";
    closeOverlayBtn.style.top = ny + "px";
});

closeOverlayBtn.addEventListener("pointerup", () => {
    isDragging = false;
    closeOverlayBtn.classList.remove("dragging");
});

closeOverlayBtn.addEventListener("pointercancel", () => {
    isDragging = false;
    closeOverlayBtn.classList.remove("dragging");
});

closeOverlayBtn.addEventListener("click", e => {
    if (hasDragged) {
        hasDragged = false;
        e.stopPropagation();
        return;
    }

    closeService();
});

overlay.addEventListener("click", e => {
    if (e.target === overlay) {
        closeService();
    }
});

function renderGrid() {
    const services = SERVICES[currentProvider];

    const filtered = services.filter(service =>
        service.name.toLowerCase().includes(searchQuery)
    );

    serviceCount.textContent =
        filtered.length +
        " Service" +
        (filtered.length !== 1 ? "s" : "");

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <p>No services found matching "${searchQuery}"</p>
            </div>
        `;

        return;
    }

    grid.innerHTML = "";

    filtered.forEach((service, i) => {
        const card = document.createElement("div");

        card.className = "service-card";
        card.style.animationDelay = `${i * 0.04}s`;

        card.onclick = () => openService(service.url);

        card.innerHTML = `
            <div class="service-icon">
                <img
                    src="${service.icon}"
                    alt="${service.name}"
                    loading="lazy"
                >
            </div>

            <div class="overlay-gradient"></div>

            <div class="service-name">
                ${service.name}
            </div>
        `;

        grid.appendChild(card);
    });
}

renderGrid();
