<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Nunito', sans-serif; }
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
.app {
  position: fixed; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center; gap: 28px; padding: 30px;
  overflow: hidden;
}
.card {
  flex: 0 0 auto;
  width: clamp(340px, 32vw, 520px);
  height: clamp(520px, 75vh, 720px);
  background: rgba(28, 28, 30, 0.78);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  backdrop-filter: blur(18px);
  display: flex; flex-direction: column; overflow: hidden;
}
.album-art {
  flex-shrink: 0; height: 240px;
  background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  transition: background 0.4s;
}
.album-art img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0;
  transition: opacity 0.4s;
}
.album-art img.loaded { opacity: 1; }
.album-art > svg { opacity: 0.18; color: #fff; width: 64px; height: 64px; z-index: 1; transition: opacity 0.3s; }
.album-art.has-art > svg { opacity: 0; }

.preview-badge {
  position: absolute; bottom: 8px; right: 8px; z-index: 2;
  background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.6);
  font-size: 10px; padding: 3px 7px; border-radius: 20px;
  font-family: 'Nunito', sans-serif;
  backdrop-filter: blur(6px);
  display: none;
}
.album-art.has-art .preview-badge { display: block; }

.track-info { flex-shrink: 0; padding: 14px 18px 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
.track-meta { flex: 1; min-width: 0; }
.track-title { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.92); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-artist { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itunes-link { display: none; }
.itunes-link.show { display: block; }
.itunes-link a { font-size: 10px; color: rgba(255,100,100,0.6); text-decoration: none; margin-top: 2px; display: block; }
.itunes-link a:hover { color: rgba(255,100,100,0.9); }

.progress-wrap { flex-shrink: 0; padding: 0 18px; }
.progress-track { height: 5px; background: rgba(255,255,255,0.12); border-radius: 999px; cursor: pointer; position: relative; }
.progress-fill { height: 100%; background: rgba(255,255,255,0.55); border-radius: 999px; width: 0%; transition: width 0.25s linear; pointer-events: none; }
.time-row { display: flex; justify-content: space-between; padding: 4px 0 0; font-size: 10px; color: rgba(255,255,255,0.28); }

.controls { flex-shrink: 0; padding: 16px 18px; display: flex; align-items: center; justify-content: center; gap: 18px; border-top: 1px solid rgba(255,255,255,0.06); }
.ctrl-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.55); padding: 10px; border-radius: 14px; transition: color 0.15s, background 0.15s; display: flex; align-items: center; justify-content: center; }
.ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
.play-btn { background: rgba(255,255,255,0.9); border: none; cursor: pointer; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0a0a0a; transition: background 0.15s, transform 0.1s; }
.play-btn:hover { background: #fff; transform: scale(1.05); }
.play-btn:active { transform: scale(0.97); }

.bottom-bar { flex-shrink: 0; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); }
.vol-wrap { display: flex; align-items: center; gap: 6px; }
.vol-wrap svg { color: rgba(255,255,255,0.3); }
.vol-slider { -webkit-appearance: none; appearance: none; width: 70px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.14); outline: none; cursor: pointer; }
.vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,0.7); }

.search-bar { flex-shrink: 0; padding: 14px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.search-input { background: none; border: none; outline: none; color: #fff; font-size: 14px; flex: 1; caret-color: rgba(255,255,255,0.5); font-family: 'Nunito', sans-serif; }
.search-input::placeholder { color: rgba(255,255,255,0.25); }

.mode-toggle {
  flex-shrink: 0;
  display: flex;
  background: rgba(255,255,255,0.07);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.35);
  padding: 4px 10px;
  border-radius: 7px;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.mode-btn.active {
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.9);
}

.results-area { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }
.results-area::-webkit-scrollbar { width: 4px; }
.results-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 10px; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: rgba(255,255,255,0.18); }
.empty-state svg { opacity: 0.22; width: 34px; height: 34px; }
.empty-state span { font-size: 12px; }

.loading-state { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: rgba(255,255,255,0.25); }
.loading-state.visible { display: flex; }
.spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: rgba(255,255,255,0.4); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.result-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; transition: background 0.12s; border-radius: 12px; margin: 0 6px; }
.result-item:hover { background: rgba(255,255,255,0.06); }
.result-item.playing { background: rgba(255,255,255,0.08); }
.result-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.06); }
.result-thumb-placeholder { width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; }

.result-item.artist-item .result-thumb {
  width: 40px; height: 40px; border-radius: 50%;
}
.result-item.artist-item .result-thumb-placeholder {
  border-radius: 50%;
}
.result-artist-sub { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 2px; }

.result-title { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-artist { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-meta { flex: 1; min-width: 0; }
.result-duration { font-size: 10px; color: rgba(255,255,255,0.2); flex-shrink: 0; }

.section-label { padding: 8px 14px 4px; font-size: 10px; color: rgba(255,255,255,0.2); text-transform: uppercase; letter-spacing: 0.08em; }
.music-note { padding: 10px 14px; font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 6px; margin-left: 4px; }

@media (max-width: 900px) {
  .app { overflow-x: auto; scroll-snap-type: x mandatory; padding: 0; gap: 0; justify-content: flex-start; }
  .card { width: 100vw; height: 100vh; border-radius: 0; scroll-snap-align: center; }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="app">
  <div class="card">
    <div class="album-art" id="albumArt">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <img id="albumImg" src="" alt="" />
      <div class="preview-badge" id="previewBadge">30s preview</div>
    </div>

    <div class="track-info">
      <div class="track-meta">
        <div class="track-title" id="trackTitle">not playing</div>
        <div class="track-artist" id="trackArtist">search a song to get started</div>
        <div class="itunes-link" id="itunesLink"><a id="itunesA" href="#" target="_blank">open in apple music ↗</a></div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track" onclick="seekTo(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="timeElapsed">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" onclick="skipPrev()" title="Previous">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" onclick="togglePlay()">
        <svg id="playIcon" width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="skipNext()" title="Next">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
      </button>
    </div>

    <div class="bottom-bar">
      <div class="vol-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input class="vol-slider" type="range" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="rgba(255,255,255,0.28)">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input class="search-input" id="searchInput" placeholder="search songs..." oninput="onSearchInput()" />
      <div class="mode-toggle">
        <button class="mode-btn active" id="btnSong" onclick="setMode('song')">songs</button>
        <button class="mode-btn" id="btnArtist" onclick="setMode('artist')">artists</button>
      </div>
    </div>
    <div class="results-area" id="resultsArea">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="currentColor" style="color:#fff">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span id="emptyText">search any song or artist</span>
      </div>
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <span id="loadingText" style="font-size:12px">searching itunes...</span>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
window.addEventListener("resize", () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
const SHADES = ["rgba(255,255,255,","rgba(235,235,235,","rgba(210,210,210,","rgba(185,185,185,","rgba(160,160,160,","rgba(220,220,220,"];
function spawnParticle() {
  const w = canvas.width, h = canvas.height, edge = Math.random();
  let x, y, vx, vy;
  const speed = (0.35 + Math.random() * 0.55) * 5;
  if (edge < 0.45) { x = Math.random() * w * 0.65; y = h * (0.92 + Math.random() * 0.08); const a = -(Math.PI * 0.18 + Math.random() * Math.PI * 0.28); vx = speed * Math.cos(a) * (0.6 + Math.random() * 0.6); vy = speed * Math.sin(a) * (0.8 + Math.random() * 0.5); }
  else if (edge < 0.85) { x = w * (Math.random() * 0.05); y = h * (0.35 + Math.random() * 0.65); const a = -(Math.PI * 0.08 + Math.random() * Math.PI * 0.3); vx = speed * (0.7 + Math.random() * 0.5); vy = -speed * (0.3 + Math.random() * 0.5); }
  else { x = w * (Math.random() * 0.1); y = h * (0.85 + Math.random() * 0.15); const a = -(Math.PI * 0.22 + Math.random() * Math.PI * 0.22); vx = speed * Math.cos(a) * (0.6 + Math.random() * 0.7); vy = speed * Math.sin(a) * (0.7 + Math.random() * 0.5); }
  return { x, y, vx, vy, size: 0.8 + Math.random() * 2.2, shade: SHADES[Math.floor(Math.random() * SHADES.length)], alpha: 0.25 + Math.random() * 0.5, frame: 0, wobbleAmp: 0.2 + Math.random() * 0.9, wobbleFreq: 0.015 + Math.random() * 0.025, wobbleOffset: Math.random() * Math.PI * 2, curve: (Math.random() - 0.35) * 0.006 };
}
function stepParticle(p) { p.vx += p.curve; p.x += p.vx + Math.sin(p.frame * p.wobbleFreq + p.wobbleOffset) * p.wobbleAmp; p.y += p.vy; p.frame++; }
function isOffscreen(p) { return p.x > canvas.width + 20 || p.y < -20 || p.x < -20 || p.y > canvas.height + 20; }
function drawParticle(p) { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.shade + p.alpha.toFixed(3) + ")"; ctx.fill(); }
const particles = [];
for (let i = 0; i < 55; i++) particles.push(spawnParticle());
(function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < particles.length; i++) { if (isOffscreen(particles[i])) particles[i] = spawnParticle(); stepParticle(particles[i]); drawParticle(particles[i]); } requestAnimationFrame(animate); })();
</script>

<script>
const audio = new Audio();
audio.volume = 0.8;
let currentIndex = -1;
let currentQueue = [];
let searchDebounce = null;
let searchMode = "song";
const proxy = "https://onlinehomeworkhelper.onrender.com/p/"

audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  document.getElementById("progressFill").style.width = (audio.currentTime / audio.duration * 100) + "%";
  document.getElementById("timeElapsed").textContent = fmt(audio.currentTime);
});
audio.addEventListener("loadedmetadata", () => {
  document.getElementById("timeDuration").textContent = fmt(audio.duration);
});
audio.addEventListener("play", () => setPlayIcon(true));
audio.addEventListener("pause", () => setPlayIcon(false));
audio.addEventListener("ended", () => skipNext());

function fmt(s) {
  if (!s || isNaN(s)) return "0:00";
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}

function setMode(mode) {
  searchMode = mode;
  document.getElementById("btnSong").classList.toggle("active", mode === "song");
  document.getElementById("btnArtist").classList.toggle("active", mode === "artist");
  const input = document.getElementById("searchInput");
  input.placeholder = mode === "song" ? "search songs..." : "search artists...";
  const q = input.value.trim();
  if (q) {
    showLoading();
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => doSearch(q), 200);
  } else {
    showEmpty(mode === "song" ? "search any song or artist" : "search for an artist");
  }
}

function doSearch(q) {
  if (searchMode === "artist") {
    searchArtist(q);
  } else {
    searchItunes(q);
  }
}

function playTrack(idx) {
  const t = currentQueue[idx];
  if (!t) return;
  currentIndex = idx;
  audio.src = t.previewUrl;
  audio.load();
  audio.play().catch(e => console.warn("audio play blocked:", e));

  document.getElementById("trackTitle").textContent = t.title;
  document.getElementById("trackArtist").textContent = t.artist || "";
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("timeElapsed").textContent = "0:00";
  document.getElementById("timeDuration").textContent = "0:00";

  const artEl = document.getElementById("albumArt");
  const imgEl = document.getElementById("albumImg");
  const badge = document.getElementById("previewBadge");
  const link = document.getElementById("itunesLink");
  const linkA = document.getElementById("itunesA");

  if (t.artwork) {
    const hires = t.artwork.replace("100x100bb", "400x400bb");
    imgEl.src = hires;
    imgEl.onload = () => { imgEl.classList.add("loaded"); artEl.classList.add("has-art"); };
    imgEl.onerror = () => { imgEl.classList.remove("loaded"); artEl.classList.remove("has-art"); };
    imgEl.classList.remove("loaded");
  } else {
    imgEl.src = "";
    imgEl.classList.remove("loaded");
    artEl.classList.remove("has-art");
  }

  if (t.trackUrl) {
    linkA.href = t.trackUrl;
    link.classList.add("show");
    badge.style.display = "block";
  }

  updateHighlight();
}

function togglePlay() {
  if (currentIndex === -1 && currentQueue.length) { playTrack(0); return; }
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}

function setPlayIcon(playing) {
  document.getElementById("playIcon").innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function skipNext() {
  if (!currentQueue.length) return;
  const next = (currentIndex + 1) % currentQueue.length;
  playTrack(next);
}

function skipPrev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (!currentQueue.length) return;
  playTrack(currentIndex <= 0 ? currentQueue.length - 1 : currentIndex - 1);
}

function seekTo(e) {
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
}

function setVolume(v) { audio.volume = parseFloat(v); }

function showEmpty(msg) {
  document.getElementById("emptyState").style.display = "flex";
  document.getElementById("emptyText").textContent = msg;
  document.getElementById("loadingState").classList.remove("visible");
  document.querySelectorAll(".result-item, .section-label, .music-note").forEach(el => el.remove());
}

function showLoading() {
  document.getElementById("emptyState").style.display = "none";
  document.getElementById("loadingState").classList.add("visible");
  document.querySelectorAll(".result-item, .section-label, .music-note").forEach(el => el.remove());
}

function onSearchInput() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) {
    showEmpty(searchMode === "song" ? "search any song or artist" : "search for an artist");
    return;
  }
  clearTimeout(searchDebounce);
  showLoading();
  searchDebounce = setTimeout(() => doSearch(q), 420);
}

async function searchItunes(q) {
  if (q !== document.getElementById("searchInput").value.trim()) return;
  try {
    const url = proxy + encodeURIComponent(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=25`);
    const res = await fetch(url);
    const data = await res.json();
    proxyUrls(data);
    const results = (data.results || []).filter(r => r.previewUrl);
    currentQueue = results.map(r => ({
      title: r.trackName,
      artist: r.artistName,
      album: r.collectionName,
      previewUrl: r.previewUrl,
      artwork: r.artworkUrl100,
      trackUrl: r.trackViewUrl,
      duration: r.trackTimeMillis,
      source: "itunes"
    }));
    renderSongList(currentQueue);
  } catch (err) {
    showEmpty("couldn't reach itunes. try again.");
  }
}

async function searchArtist(q) {
  if (q !== document.getElementById("searchInput").value.trim()) return;
  try {
    const artistUrl = proxy + encodeURIComponent(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=musicArtist&limit=5`);
    const artistRes = await fetch(artistUrl);
    const artistData = await artistRes.json();
    proxyUrls(artistData);
    const artists = (artistData.results || []).filter(r => r.wrapperType === "artist");

    if (!artists.length) {
      showEmpty("no artists found.");
      return;
    }

    const topArtist = artists[0];
    const tracksUrl = proxy + encodeURIComponent(`https://itunes.apple.com/lookup?id=${topArtist.artistId}&entity=song&limit=25`);
    const tracksRes = await fetch(tracksUrl);
    const tracksData = await tracksRes.json();
    proxyUrls(tracksData);

    const tracks = (tracksData.results || []).filter(r => r.wrapperType === "track" && r.previewUrl);
    currentQueue = tracks.map(r => ({
      title: r.trackName,
      artist: r.artistName,
      album: r.collectionName,
      previewUrl: r.previewUrl,
      artwork: r.artworkUrl100,
      trackUrl: r.trackViewUrl,
      duration: r.trackTimeMillis,
      source: "itunes"
    }));

    renderArtistResults(artists, topArtist, currentQueue);
  } catch (err) {
    showEmpty("couldn't reach itunes. try again.");
  }
}

function renderSongList(list) {
  const area = document.getElementById("resultsArea");
  area.querySelectorAll(".result-item, .section-label, .music-note").forEach(el => el.remove());
  document.getElementById("loadingState").classList.remove("visible");

  if (!list.length) {
    document.getElementById("emptyState").style.display = "flex";
    document.getElementById("emptyText").textContent = "no results on itunes.";
    return;
  }
  document.getElementById("emptyState").style.display = "none";

  list.forEach((t, pos) => {
    const div = document.createElement("div");
    div.className = "result-item" + (pos === currentIndex ? " playing" : "");
    div.dataset.idx = pos;
    const dur = t.duration ? fmt(t.duration / 1000) : "";
    const thumb = t.artwork
      ? `<img class="result-thumb" src="${t.artwork}" loading="lazy" alt="" />`
      : `<div class="result-thumb-placeholder"></div>`;
    div.innerHTML =
      thumb +
      `<div class="result-meta"><div class="result-title">${escHtml(t.title)}</div><div class="result-artist">${escHtml(t.artist)}</div></div>` +
      (dur ? `<div class="result-duration">${dur}</div>` : "");
    div.onclick = () => { playTrack(pos); };
    area.appendChild(div);
  });

  const note = document.createElement("div");
  note.className = "music-note";
  note.textContent = "previews via itunes - 30 seconds each";
  area.appendChild(note);
}

function renderArtistResults(artists, topArtist, tracks) {
  const area = document.getElementById("resultsArea");
  area.querySelectorAll(".result-item, .section-label, .music-note").forEach(el => el.remove());
  document.getElementById("loadingState").classList.remove("visible");
  document.getElementById("emptyState").style.display = "none";

  if (artists.length > 1) {
    const altLabel = document.createElement("div");
    altLabel.className = "section-label";
    altLabel.textContent = "other matches";
    area.appendChild(altLabel);

    artists.slice(1).forEach(a => {
      const div = document.createElement("div");
      div.className = "result-item artist-item";
      const thumb = `<div class="result-thumb-placeholder"><svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(255,255,255,0.25)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>`;
      div.innerHTML =
        thumb +
        `<div class="result-meta"><div class="result-title">${escHtml(a.artistName)}</div><div class="result-artist-sub result-artist">artist</div></div>`;
      div.onclick = () => {
        document.getElementById("searchInput").value = a.artistName;
        showLoading();
        searchArtist(a.artistName);
      };
      area.appendChild(div);
    });
  }

  const topLabel = document.createElement("div");
  topLabel.className = "section-label";
  topLabel.textContent = `top tracks · ${escHtml(topArtist.artistName)}`;
  area.appendChild(topLabel);

  if (!tracks.length) {
    const empty = document.createElement("div");
    empty.className = "music-note";
    empty.textContent = "no previewable tracks found for this artist.";
    area.appendChild(empty);
    return;
  }

  tracks.forEach((t, pos) => {
    const div = document.createElement("div");
    div.className = "result-item" + (pos === currentIndex ? " playing" : "");
    div.dataset.idx = pos;
    const dur = t.duration ? fmt(t.duration / 1000) : "";
    const thumb = t.artwork
      ? `<img class="result-thumb" src="${t.artwork}" loading="lazy" alt="" />`
      : `<div class="result-thumb-placeholder"></div>`;
    div.innerHTML =
      thumb +
      `<div class="result-meta"><div class="result-title">${escHtml(t.title)}</div><div class="result-artist">${escHtml(t.album || t.artist)}</div></div>` +
      (dur ? `<div class="result-duration">${dur}</div>` : "");
    div.onclick = () => { playTrack(pos); };
    area.appendChild(div);
  });

  const note = document.createElement("div");
  note.className = "music-note";
  note.textContent = "previews via itunes - 30 seconds each";
  area.appendChild(note);
}

function updateHighlight() {
  document.querySelectorAll(".result-item").forEach(el => {
    el.classList.toggle("playing", parseInt(el.dataset.idx) === currentIndex);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function proxyUrls(obj) {
  if (!obj || typeof obj !== 'object') return;
  for (const key of Object.keys(obj)) {
    if (typeof obj[key] === 'string' && obj[key].startsWith('https://')) {
      obj[key] = proxy + encodeURIComponent(obj[key]);
    } else {
      proxyUrls(obj[key]);
    }
  }
}

showEmpty("search any song or artist");
</script>
</body>
