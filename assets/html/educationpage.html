<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { margin: 0; box-sizing: border-box; }

:root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #161616;
    --border: #1f1f1f;
    --text: #ffffff;
    --text-dim: #5a5a5a;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

.header {
    position: sticky;
    top: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px 20px;

    background: rgba(10,10,10,0.75);
    backdrop-filter: blur(14px);

    border-bottom: 1px solid rgba(255,255,255,0.04);
}

.header-title {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
}

.header-count {
    font-size: 12px;
    color: var(--text-dim);
}

.search-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;

    padding: 6px 10px;
    width: 190px;

    transition: 0.2s ease;
}

.search-wrap:focus-within {
    width: 230px;
    border-color: #2f2f2f;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
}

.search-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 12px;
    width: 100%;
}

.content {
    padding: 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
}

.game-card {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;

    overflow: hidden;
    cursor: pointer;
    text-decoration: none;

    display: flex;
    flex-direction: column;

    transition: transform 0.18s ease, box-shadow 0.18s ease, border 0.18s ease;

    animation: fadeUp 0.25s ease both;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.game-card:hover {
    transform: translateY(-3px) scale(1.01);
    border-color: rgba(255,255,255,0.12);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.game-thumb {
    aspect-ratio: 16/10;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.game-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.25s ease;
}

.game-card:hover .game-thumb img {
    transform: scale(1.05);
}

.game-info {
    padding: 10px;
}

.game-name {
    font-size: 12px;
    font-weight: 500;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.empty {
    grid-column: 1 / -1;
    padding: 60px 0;
    text-align: center;
    color: var(--text-dim);
    opacity: 0.7;
}

#gameOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    z-index: 100;

    animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

#gameIframe {
    width: 100%;
    height: 100%;
    border: none;
}

#loadingScreen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
}

.game-card,
.game-card:visited,
.game-card:active {
    color: inherit;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    <span class="header-title">nebula games</span>
    <div class="header-sep"></div>
    <span class="header-count" id="gameCount"></span>

    <div class="search-wrap">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="search games...">
    </div>
</div>

<div class="content">
    <div class="grid" id="grid"></div>
</div>

<div id="gameOverlay">
    <iframe id="gameIframe"></iframe>
    <div id="loadingScreen"></div>
</div>

<script>
const GAMES = [
    { name: "Geometry Dash", index: 1 },
    { name: "Five Nights at Epstein's", index: 2 },
    { name: "BitLife", index: 3 },
    { name: "Paper.io 2", index: 4 },
    { name: "ULTRAKILL", index: 5 },
    { name: "PolyTrack", index: 6 },
    { name: "Ragdoll Archers", index: 7 },
    { name: "Eaglercraft 1.12.2", index: 8 },
    { name: "GunSpin", index: 9 },
    { name: "Stickman Hook", index: 10 },
    { name: "Among Us", index: 11 },
    { name: "Infinite Craft (Scratch)", index: 12 },
    { name: "Gladihoppers", index: 13 },
    { name: "Flappy Bird", index: 14 },
    { name: "Tomb of the Mask", index: 15 },
    { name: "Subway Surfers", index: 16 },
    { name: "Baldi's Basics", index: 17 },
    { name: "Drive Mad", index: 18 },
    { name: "Slope", index: 19 },
    { name: "Friday Night Funkin'", index: 20 },
    { name: "FNAF", index: 21 },
    { name: "Crossy Road", index: 22 },
    { name: "Fruit Ninja", index: 23 },
    { name: "Chrome Dino", index: 24 },
    { name: "Basketball Stars", index: 25 },
    { name: "The Impossible Quiz", index: 26 },
    { name: "Sandboxels", index: 27 },
    { name: "Hacker Typer", index: 28 },
];

let searchQuery = "";

const grid = document.getElementById("grid");
const gameOverlay = document.getElementById("gameOverlay");
const loadingScreen = document.getElementById("loadingScreen");
const gameIframe = document.getElementById("gameIframe");

document.getElementById("searchInput").addEventListener("input", e => {
    searchQuery = e.target.value.toLowerCase();
    renderGrid();
});

function renderGrid() {
    const filtered = GAMES.filter(g =>
        g.name.toLowerCase().includes(searchQuery)
    );

    document.getElementById("gameCount").textContent =
        filtered.length + " game" + (filtered.length !== 1 ? "s" : "");

    if (!filtered.length) {
        grid.innerHTML = `<div class="empty">no games found.</div>`;
        return;
    }

    grid.innerHTML = "";

    filtered.forEach(game => {
        const a = document.createElement("a");
        a.className = "game-card";
        a.href = "#";

        a.addEventListener("click", e => {
            e.preventDefault();
            openGame(game);
        });

        const thumb = document.createElement("div");
        thumb.className = "game-thumb";

        const img = document.createElement("img");
        img.src = `../education/icons/${game.index}.png`;
        img.alt = game.name;

        img.onerror = () => {
            img.remove();
            thumb.innerHTML = `
                <svg class="fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>`;
        };

        thumb.appendChild(img);

        const info = document.createElement("div");
        info.className = "game-info";
        info.innerHTML = `<div class="game-name">${game.name}</div>`;

        a.appendChild(thumb);
        a.appendChild(info);
        grid.appendChild(a);
    });
}

function openGame(game) {
    gameOverlay.style.display = "flex";

    loadingScreen.innerHTML = `
        <iframe src="./loading.html"
        style="width:100%;height:100%;border:none;"></iframe>
    `;

    gameIframe.style.opacity = "0";

    gameIframe.onload = () => {
        loadingScreen.style.opacity = "0";
        setTimeout(() => loadingScreen.remove(), 200);

        gameIframe.style.transition = "opacity 0.2s ease";
        gameIframe.style.opacity = "1";
    };

    gameIframe.src = `../education/${game.index}/index.html`;
}

renderGrid();
</script>

</body>
</html>
