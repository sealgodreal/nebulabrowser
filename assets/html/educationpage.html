<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0d0b14">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://sealgodreal.github.io" crossorigin>
<link rel="preconnect" href="https://www.google.com" crossorigin>

<style>
:root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: #1f1f1f;
    --border-hover: #2a2a2a;
    --text: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #5a5a5a;
    --accent: #7a7a7a;
    --accent2: #b5b5b5;
    --accent-glow: rgba(122,122,122,0.28);
    --danger: #ef4444;
    --danger-soft: rgba(239,68,68,0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 14px;
    --shadow-md: 0 8px 32px rgba(0,0,0,0.5);
    --shadow-lg: 0 16px 56px rgba(0,0,0,0.6);
    --transition-fast: 0.15s cubic-bezier(0.4,0,0.2,1);
    --transition-smooth: 0.25s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #444; }

.header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 20px;
    height: 52px;
    background: rgba(10,10,10,0.88);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--border);
}

.header-brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
    flex-shrink: 0;
    margin-right: 20px;
}

.nav-tabs { display: flex; align-items: center; gap: 2px; flex: 1; }

.nav-tab {
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
    user-select: none;
    border: none;
    background: transparent;
    font-family: inherit;
}

.nav-tab:hover { background: var(--surface-hover); color: var(--text); }
.nav-tab.active { background: rgba(255,255,255,0.09); color: #ffffff; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

.search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    width: 200px;
    transition: var(--transition-smooth);
}

.search-wrap:focus-within {
    width: 260px;
    border-color: #333;
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
}

.search-wrap svg { color: var(--text-muted); flex-shrink: 0; }
.search-wrap:focus-within svg { color: var(--text-secondary); }

.search-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    width: 100%;
    font-family: inherit;
}

.search-wrap input::placeholder { color: var(--text-muted); }

.content {
    position: relative;
    z-index: 1;
    padding: 20px 20px 40px;
    max-width: 1500px;
    margin: 0 auto;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
}

.grid.web-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

.game-card {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    display: block;
    aspect-ratio: 16 / 10;
    background: #161616;
    border: 1px solid var(--border);
    color: #ffffff !important;
    transition:
        transform var(--transition-smooth),
        box-shadow var(--transition-smooth),
        border-color var(--transition-smooth);
    animation: fadeUp 0.3s ease both;
}

.game-card:link, .game-card:visited, .game-card:hover, .game-card:active {
    color: #ffffff !important;
    text-decoration: none !important;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.game-card:hover {
    transform: translateY(-3px) scale(1.025);
    border-color: var(--border-hover);
    box-shadow: 0 8px 32px rgba(0,0,0,0.55), var(--shadow-lg);
}

.game-card:active { transform: translateY(-1px) scale(1.01); }

.game-thumb {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #141414, #1a1a1a);
}

.game-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    display: block;
    content-visibility: auto;
}

.game-card:hover .game-thumb img { transform: scale(1.06); }

.fallback-icon { width: 36px; height: 36px; color: var(--text-muted); opacity: 0.4; }
.game-thumb-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.16); pointer-events: none; }

.game-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    pointer-events: none;
    background: rgba(12,12,12,0.38);
    backdrop-filter: blur(2px) saturate(1.05);
    -webkit-backdrop-filter: blur(2px) saturate(1.05);
    border: 1px solid rgba(255,255,255,0.07);
    transition: background var(--transition-smooth), backdrop-filter var(--transition-smooth);
}

.game-card:hover .game-label {
    background: rgba(12,12,12,0.42);
    backdrop-filter: blur(2px) saturate(1.08);
    -webkit-backdrop-filter: blur(2px) saturate(1.08);
}

.game-label-inner {
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    font-size: 14px;
    font-weight: 650;
    color: #ffffff !important;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90%;
    text-align: center;
    text-shadow: 0 1px 5px rgba(0,0,0,0.45);
}

.empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 14px;
    animation: fadeUp 0.4s ease both;
}

.empty-state svg { width: 44px; height: 44px; color: var(--text-muted); opacity: 0.35; }
.empty-state p { color: var(--text-muted); font-size: 14px; text-align: center; }

#gameOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    z-index: 100;
    animation: fadeIn 0.25s ease;
    touch-action: none;
    overscroll-behavior: none;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.overlay-topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(15,15,15,0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 200;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s cubic-bezier(0.4,0,0.2,1);
}

.overlay-topbar.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }

.menu-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    transition: var(--transition-fast);
    color: var(--text);
    touch-action: none;
}

.menu-btn:hover { background: var(--surface-hover); }

.menu-btn span {
    display: block; width: 16px; height: 1.5px;
    background: currentColor; border-radius: 1px;
    transition: var(--transition-fast);
}

.menu-btn.active span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.menu-btn.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.menu-btn.active span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

.topbar-brand { display: flex; align-items: center; gap: 8px; }
.topbar-brand span span { color: rgb(190,190,190); margin-left: 4px; }
.topbar-brand span span span { margin-left: -3px; color: #5aa2ff; }

.topbar-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #a78bfa, #c084fc, #e879f9, #a78bfa);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
}

@keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.topbar-sub { font-size: 11px; color: var(--text-muted); }

.close-bar-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    background: transparent; border: none;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: var(--transition-fast);
}

.close-bar-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.close-bar-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.floating-menu-btn {
    position: absolute;
    top: 10px; left: 16px;
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    background: rgba(18,18,18,0.9);
    border: 1px solid var(--border);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    transition: var(--transition-fast);
    color: var(--text);
    touch-action: none;
    z-index: 205;
    box-shadow: var(--shadow-md);
}

.floating-menu-btn.visible { display: flex; animation: slideInLeft 0.3s ease; }

@keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
}

.floating-menu-btn.faded { opacity: 0.3; }
.floating-menu-btn:hover, .floating-menu-btn:active { opacity: 1 !important; background: var(--surface-hover); }
.floating-menu-btn span { display: block; width: 16px; height: 1.5px; background: currentColor; border-radius: 1px; }

.menu-panel {
    position: absolute;
    top: 56px; left: 14px;
    width: 220px;
    background: rgba(20,20,20,0.98);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px;
    z-index: 210;
    display: none; flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow-lg);
    animation: menuIn 0.2s cubic-bezier(0.4,0,0.2,1);
}

.menu-panel.open { display: flex; }

@keyframes menuIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.menu-btn-row { display: flex; gap: 8px; }

.menu-action {
    flex: 1;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition-fast);
    text-align: center;
    font-family: inherit;
    touch-action: none;
    letter-spacing: 0.01em;
}

.menu-action:hover { background: rgba(255,255,255,0.08); }

.menu-action.danger {
    color: var(--danger);
    border-color: rgba(239,68,68,0.15);
    background: var(--danger-soft);
}

.menu-action.danger:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.3); }

.menu-divider { height: 1px; background: var(--border); margin: 2px 0; }

.proxy-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 2px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    gap: 10px;
}

.proxy-toggle-labels { display: flex; flex-direction: column; gap: 1px; }
.proxy-toggle-name { font-size: 12px; font-weight: 500; color: var(--text-secondary); transition: color var(--transition-fast); }
.proxy-toggle-hint { font-size: 10px; color: var(--text-muted); }
.proxy-toggle-row.active .proxy-toggle-name { color: var(--accent2); }

.proxy-toggle-row .ios-track { background: rgba(255,255,255,0.12); transition: background 0.25s ease; }
.proxy-toggle-row .ios-thumb { transition: transform 0.25s cubic-bezier(0.34,1.4,0.64,1); }
.proxy-toggle-row.active .ios-track { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.proxy-toggle-row.active .ios-thumb { transform: translateX(16px); }

.ios-toggle { position: relative; width: 40px; height: 24px; flex-shrink: 0; pointer-events: none; }
.ios-track { position: absolute; inset: 0; border-radius: 12px; }
.ios-thumb { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

#gameFrameWrap {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
    touch-action: none;
    overscroll-behavior: none;
}

#gameIframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    touch-action: none;
    contain: strict;
}

#loadingScreen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 1;
    transition: opacity 0.4s ease;
    overflow: hidden;
}

#loadingFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: var(--bg);
}

@media (max-width: 768px) {
    .content { padding: 14px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
    .header { padding: 0 14px; }
    .search-wrap { width: 150px; }
    .search-wrap:focus-within { width: 190px; }
    .nav-tab { padding: 5px 10px; font-size: 12px; }
}

@media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .header-brand { font-size: 16px; margin-right: 10px; }
    .nav-tab:not(.active) { display: none; }
}

::selection { background: rgba(140,140,140,0.35); color: #fff; }
</style>

<body>

<div class="header">
    <div class="header-brand">Nebula Study</div>

    <div class="nav-tabs">
        <button class="nav-tab active" id="tabLocal" onclick="switchTab('local')">GitHub</button>
        <button class="nav-tab" id="tabWeb" onclick="switchTab('web')">Web</button>
    </div>

    <div class="header-right">
        <div class="search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search study..." autocomplete="off">
        </div>
    </div>
</div>

<div class="content">
    <div class="grid" id="grid"></div>
</div>

<div id="gameOverlay">

    <div class="overlay-topbar" id="overlayTopbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>

        <div class="topbar-brand">
            <span class="topbar-title">Nebula Study</span>
            <span class="topbar-sub">| <span>Developed by </span>: <span><span>sealgod</span></span></span>
        </div>

        <button class="close-bar-btn" id="closeBarBtn" aria-label="Hide bar">
            <svg viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>

    <button class="floating-menu-btn" id="floatMenuBtn" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>

    <div class="menu-panel" id="menuPanel">
        <div class="menu-btn-row">
            <button class="menu-action danger" id="btnExit">Exit Game</button>
            <button class="menu-action" id="btnFullscreen">Fullscreen</button>
        </div>

        <div class="menu-divider"></div>

        <div class="proxy-toggle-row" id="proxyToggleRow" role="switch" aria-checked="false" tabindex="0">
            <div class="proxy-toggle-labels">
                <span class="proxy-toggle-name">Use Proxy</span>
                <span class="proxy-toggle-hint">Buggy</span>
            </div>
            <div class="ios-toggle">
                <div class="ios-track"></div>
                <div class="ios-thumb"></div>
            </div>
        </div>
    </div>

    <div id="gameFrameWrap">
        <iframe id="gameIframe" allow="fullscreen"></iframe>

        <div id="loadingScreen">
            <iframe
                id="loadingFrame"
                src="loading_v2.html"
                title="Loading"
                scrolling="no"
            ></iframe>
        </div>
    </div>

</div>

<script>
let _p = "";
let proxyEnabled = false;
let currentGame = null;
let currentGameType = null;

(async function () {
    const keys = await caches.keys();
    for (const key of keys) await caches.delete(key);
    sessionStorage.clear();

    const proxyUrls = [
        "https://closure-guided-refused-furthermore.trycloudflare.com",
        "https://calvin-stanley-reg-tournament.trycloudflare.com",
        "https://pty-nicole-consider-collectibles.trycloudflare.com"
    ];

    const overlay = Object.assign(document.createElement("div"), {
        id: "proxyOverlay",
        style: "position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;flex-direction:column;user-select:none;"
    });

    const statusText = Object.assign(document.createElement("div"), {
        id: "proxyStatus",
        style: "color:#fff;font-size:16px;font-weight:300;letter-spacing:1px;",
        textContent: "finding unblocked proxy..."
    });

    overlay.appendChild(statusText);
    document.body.appendChild(overlay);

    const probeFrame = Object.assign(document.createElement("iframe"), {
        style: "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;",
        sandbox: "allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
    });
    document.body.appendChild(probeFrame);

    const isFrameBlocked = () => {
        try {
            const src = probeFrame.src;
            if (!src || src === "about:blank" || src.startsWith("about:")) return true;

            let href = null;
            try { href = probeFrame.contentWindow?.location?.href || probeFrame.src; } catch (_) { href = probeFrame.src; }

            const lower = (href || src || "").toLowerCase();
            const blockedKeywords = [
                "securly.com/broker/blocked","goguardian.com/blocked","goguardian.com/filter",
                "lightspeed.com/blocked","iboss.com/blocked","smoothwall.com/blocked",
                "fortiguard.com/blocked","opendns.com/blocked","umbrella.com/blocked",
                "zscaler.com/blocked","mcafee.com/blocked","barracuda.com/blocked",
                "forcepoint.com/blocked","netnanny.com/blocked","cyberpatrol.com/blocked",
                "surfwatch.com/blocked","covenanteyes.com/blocked",
                "blocked","filter","restricted","denied","forbidden","notallowed",
                "policyviolation","accessdenied","categoryblocked","webfilter","dnsfilter","contentfilter"
            ];
            if (blockedKeywords.some(k => lower.includes(k))) return true;

            try {
                const doc = probeFrame.contentDocument || probeFrame.contentWindow?.document;
                if (doc) {
                    const title = (doc.title || "").toLowerCase();
                    if (["blocked","securly","goguardian","access denied","forbidden","restricted","filter"].some(k => title.includes(k))) return true;
                    if (doc.body) {
                        const bodyText = (doc.body.innerText || doc.body.textContent || "").toLowerCase();
                        if (bodyText.includes("login to continue") && bodyText.includes("school email")) return true;
                        if (bodyText.trim().length < 10) return true;
                    }
                }
            } catch (_) {}

            return false;
        } catch (_) { return false; }
    };

    const fetchBlocked = async url => {
        try {
            await fetch(url, { method: "HEAD", mode: "no-cors", cache: "no-store" });
            return false;
        } catch (_) { return true; }
    };

    const loadFrame = (url, timeout = 15000) => new Promise((resolve, reject) => {
        let timer = null, settled = false;
        const cleanup = () => { if (timer) clearTimeout(timer); probeFrame.onload = null; probeFrame.onerror = null; };
        probeFrame.onload = () => { if (!settled) { settled = true; cleanup(); resolve(); } };
        probeFrame.onerror = () => { if (!settled) { settled = true; cleanup(); reject(); } };
        timer = setTimeout(() => { if (!settled) { settled = true; cleanup(); reject(); } }, timeout);
        probeFrame.src = url;
    });

    const findProxy = async () => {
        let attempt = 0;
        const maxAttempts = proxyUrls.length * 3;
        let idx = 0;
        while (attempt < maxAttempts) {
            const url = proxyUrls[idx % proxyUrls.length];
            const proxyPath = url.replace(/\/$/, "") + "/learn/study/";
            try {
                await loadFrame(proxyPath, 18000);
                let blocked = isFrameBlocked();
                if (!blocked && await fetchBlocked(proxyPath)) {
                    const src = probeFrame.src || "";
                    if (src.includes("securly") || src.includes("goguardian") || src.includes("blocked") || src.includes("filter")) blocked = true;
                }
                const lower = url.toLowerCase();
                if (lower.includes("securly.com/broker/blocked") || lower.includes("goguardian.com/blocked")) blocked = true;
                if (!blocked) return url;
            } catch (_) {}
            idx = (idx + 1) % proxyUrls.length;
            attempt++;
            await new Promise(r => setTimeout(r, 500));
        }
        return null;
    };

    const found = await findProxy();
    const overlayEl = document.getElementById("proxyOverlay");
    const statusEl  = document.getElementById("proxyStatus");

    if (found) {
        if (statusEl) statusEl.textContent = "link found! initializing...";
        _p = found + "/learn/study/";
        await new Promise(r => setTimeout(r, 100));
        if (overlayEl) overlayEl.remove();
    } else {
        if (statusEl) statusEl.textContent = "all proxy links are blocked.";
        await new Promise(r => setTimeout(r, 1500));
        if (overlayEl) overlayEl.remove();
    }

    probeFrame.src = "about:blank";
    probeFrame.remove();
})();

function getFaviconUrl(url) {
    try { return `https://www.google.com/s2/favicons?domain=${new URL(url).origin}&sz=128`; }
    catch { return null; }
}

function renderGrid() {
    if (webMode) {
        const filtered = WEB_GAMES.filter(g =>
            g.name.toLowerCase().includes(searchQuery) ||
            g.displayUrl.toLowerCase().includes(searchQuery)
        );
        grid.className = "grid web-grid";
        if (!filtered.length) { grid.innerHTML = emptyHTML(`No web games matching "${searchQuery}"`); return; }
        grid.innerHTML = "";
        filtered.forEach((game, i) =>
            grid.appendChild(createGameCard({
                name: game.name,
                imageSrc: getFaviconUrl(game.url) || "",
                onClick: () => openWebGame(game),
                delay: i * 0.05
            }))
        );
    } else {
        const filtered = LOCAL_GAMES.filter(g => g.name.toLowerCase().includes(searchQuery));
        grid.className = "grid";
        if (!filtered.length) { grid.innerHTML = emptyHTML(`No games matching "${searchQuery}"`); return; }

            grid.appendChild(createGameCard({
                name: game.name,

                onClick: () => openGame(game),

function createGameCard({ name, imageSrc, onClick, delay }) {
    const card = document.createElement("a");
    card.className = "game-card";

    card.style.animationDelay = `${delay}s`;
    card.addEventListener("click", e => { e.preventDefault(); onClick(); });

    const thumb = document.createElement("div");
    thumb.className = "game-thumb";

    const img = document.createElement("img");
    img.src     = imageSrc;
    img.alt     = name;
    img.loading = "lazy";
    img.decoding = "async";

    img.onerror = () => {
        img.remove();
        thumb.innerHTML += `<svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    label.className = "game-label";
    const labelText = document.createElement("span");
    labelText.className = "game-label-inner";
    labelText.textContent = name;
    label.appendChild(labelText);

    card.appendChild(thumb);
    card.appendChild(label);
    return card;
}

function prepareGameIframe() {
    gameIframe.onload  = null;
    gameIframe.onerror = null;
    gameIframe.src = "about:blank";
    gameIframe.style.transition = "none";
    gameIframe.style.opacity    = "0";
}

const nextFrame = () => new Promise(r => requestAnimationFrame(r));

function waitForGameLoad() {
    return new Promise(resolve => {
        let finished = false;
        const finish = () => {
            if (finished) return;
            finished = true;
            gameIframe.style.transition = "opacity 0.4s ease";
            gameIframe.style.opacity    = "1";
            hideLoadingScreen();
            resolve();
        };
        gameIframe.onload  = finish;
        gameIframe.onerror = finish;
        setTimeout(finish, 15000);
    });
}

function resetOverlay() {
    gameOverlay.style.display = "flex";
    barHidden = menuOpen = false;
    topbar.classList.remove("hidden");
    floatMenuBtn.classList.remove("visible", "faded");
    menuPanel.classList.remove("open");
    menuBtn.classList.remove("active");
    clearTimeout(floatFadeTimer);
}

async function openGame(game) {

    showLoadingScreen();
    await nextFrame();
    gameIframe.src = getPrefix() + `https://sealgodreal.github.io/nebulagames/${game.index}/index.html`;
    setIframePermissions();
    await waitForGameLoad();

    showLoadingScreen();

}

<canvas id="stars"></canvas>
<style>
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
</style>
<script>
(function () {
    const canvas = document.getElementById("stars");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = canvas.width  = canvas.offsetWidth  || innerWidth;
    let h = canvas.height = canvas.offsetHeight || innerHeight;

    const stars = Array.from({ length: 200 }, () => ({
        x:  Math.random() * w,
        y:  Math.random() * h,
        r:  Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        o:  Math.random() * 0.8 + 0.2
    }));

    function draw() {
        ctx.clearRect(0, 0, w, h);
        const t = Date.now() / 1000;
        for (const s of stars) {
            s.x += s.vx;  if (s.x < 0 || s.x > w) s.vx *= -1;
            s.y += s.vy;  if (s.y < 0 || s.y > h) s.vy *= -1;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(70,70,75,${s.o + Math.sin(t + s.x) * 0.2})`;
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }

    window.addEventListener("resize", () => {
        w = canvas.width  = canvas.offsetWidth  || innerWidth;
        h = canvas.height = canvas.offsetHeight || innerHeight;
    });

    draw();
})();
</script>
