<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: "Poppins", Arial, Helvetica, sans-serif;
      background: #101010;
      color: white;
    }
    body {
      overflow-x: hidden;
    }
    #vanta {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
    }
    .welcome {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90%, 700px);
      text-align: center;
    }
    .welcome-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
    .nebula {
      font-weight: 600;
      color: rgba(190, 145, 255, 0.97);
      text-shadow:
        0 0 6px rgba(170, 100, 255, 0.32),
        0 0 15px rgba(140, 70, 255, 0.18);
    }
    .welcome-subtitle {
      margin-top: 10px;
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.52);
      text-shadow: 0 1px 7px rgba(0, 0, 0, 0.3);
    }
    @media (max-width: 600px) {
      .welcome {
        width: calc(100% - 44px);
      }
      .welcome-title {
        font-size: 1.7rem;
      }
      .welcome-subtitle {
        margin-top: 8px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>
  <div id="vanta"></div>
  <main class="content">
    <section class="welcome">
      <h1 class="welcome-title">
        welcome to <span class="nebula">nebula</span>!
      </h1>
      <p class="welcome-subtitle">
        use the search bar at the top to get started.
      </p>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script>
  VANTA.FOG({
    el: "#vanta",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    highlightColor: 0x2a2a2a,
    midtoneColor: 0x1c1c1c,
    lowlightColor: 0x101010,
    baseColor: 0x080808,
    blurFactor: 0.90,
    speed: 6.00,
    zoom: 0.50
  });
  </script>
</body>
</html>
