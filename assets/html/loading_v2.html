<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    font-family: "Nunito", sans-serif;
    transition: opacity 5s ease;
    opacity: 1;
    background: rgba(15, 15, 15, 0.95);
}
.loading-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    user-select: none;
}
.spinner {
    position: relative;
    width: 50px;
    height: 50px;
    margin-bottom: 22px;
}
.spinner-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px solid rgba(150, 150, 150, 0.2);
    border-top-color: rgba(230, 230, 230, 0.9);
    animation: spin 0.9s linear infinite;
}
.loading-text {
    color: rgba(255, 255, 255, 1);
    font-size: clamp(18px, 1.45vw, 22px);
    font-weight: 700;
    letter-spacing: 0.01em;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
}
.sub-text {
    margin-top: 10px;
    color: rgba(200, 200, 200, 1);
    font-size: clamp(12px, 0.95vw, 15px);
    font-weight: 400;
    letter-spacing: 0.015em;
    opacity: 1;
    transition: opacity 0.45s ease;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    text-align: center;
}
.loading-container {
    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}
@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}
@media (max-width: 600px) {
    .spinner {
        width: 42px;
        height: 42px;
        margin-bottom: 18px;
    }
    .spinner-ring {
        border-width: 3px;
    }
}
</style>
</head>
<body>
<div class="loading-container">
    <div class="spinner"><div class="spinner-ring"></div></div>
    <div class="loading-text"></div>
    <div class="sub-text"></div>
</div>
<script>
const subText = document.querySelector(".sub-text");
const loadingText = document.querySelector(".loading-text");
loadingText.textContent = "Loading your education...";
subText.textContent = "Please be patient.";
</script>
</body>
</html>
